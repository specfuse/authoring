# =============================================================================
# example-regen.yml — regression net for the bundled hello-orders example
# =============================================================================
# This workflow re-validates the spec-authoring-kit's bundled example project
# at examples/hello-orders/ on every PR. If a handbook or template change
# breaks the example, the PR fails.
#
# Two jobs run today:
#   - validate: YAML parseability + project.json validity (the floor).
#   - spectral: bundle the OpenAPI surface with redocly, then lint all three
#     surfaces against the kit's rulesets; fail on any `error`-severity finding.
#
# Every Spectral invocation goes through scripts/spectral-lint.sh rather than
# calling `spectral lint` directly. The wrapper exists because the default
# failure mode of a lint tool is silence: a crash, a timeout, or a bad ruleset
# path makes Spectral emit no findings at all, which is byte-for-byte
# indistinguishable from a clean spec if you only look at the report. The
# wrapper treats "produced no output" and "exited >= 2" as failures. See
# authoring issue #14.
#
# Still to come as the toolchain grows:
#   - End-to-end generator regeneration + diff (once wired into CI).
# =============================================================================

name: example-regen

on:
  pull_request:
    paths:
      - 'examples/hello-orders/**'
      - 'handbooks/**'
      - 'samples/**'
      - 'templates/**'
      - 'schemas/**'
      - '.github/workflows/example-regen.yml'
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate hello-orders example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate every YAML file under examples/hello-orders/api/
        run: |
          set -euo pipefail
          python3 <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob('examples/hello-orders/api/**/*.yaml', recursive=True))
          if not files:
              print('FAIL: no YAML files found under examples/hello-orders/api/')
              sys.exit(1)

          errors = []
          for f in files:
              try:
                  with open(f) as fh:
                      # safe_load_all handles multi-document files
                      # (Arazzo scenario files may contain multiple workflows)
                      list(yaml.safe_load_all(fh))
              except Exception as e:
                  errors.append((f, str(e)))

          print(f'Validated {len(files)} YAML files; {len(errors)} errors')
          for f, e in errors:
              print(f'  FAIL: {f}: {e}')
          sys.exit(1 if errors else 0)
          PY

      - name: Confirm hello-orders project.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('examples/hello-orders/hello-orders-project.json'))"

  spectral:
    name: Spectral lint hello-orders (OpenAPI + AsyncAPI + Arazzo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install redocly + spectral
        run: npm install -g @redocly/cli @stoplight/spectral-cli

      - name: Bundle the OpenAPI surface
        run: |
          redocly bundle examples/hello-orders/api/specs/v1/openapi.yaml \
            -o "${RUNNER_TEMP}/hello-orders.bundle.yaml"

      - name: Lint the bundle against the kit's OpenAPI ruleset
        run: |
          # The wrapper fails the job on error-severity findings AND on any
          # Spectral crash or empty report, which would otherwise look like a
          # clean run. See scripts/spectral-lint.sh.
          scripts/spectral-lint.sh "OpenAPI (hello-orders bundle)" \
            schemas/spectral/specfuse-openapi.yaml \
            "${RUNNER_TEMP}/hello-orders.bundle.yaml"

      # AsyncAPI and Arazzo need no bundling — Spectral resolves their $refs
      # directly (no operation-level-$ref antipattern as in OpenAPI).
      - name: Lint the AsyncAPI surface
        run: |
          scripts/spectral-lint.sh "AsyncAPI (hello-orders)" \
            schemas/spectral/specfuse-asyncapi.yaml \
            examples/hello-orders/api/specs/v1/asyncapi.yaml

      - name: Lint the Arazzo scenarios and recipes
        run: |
          scripts/spectral-lint.sh "Arazzo (hello-orders scenarios)" \
            schemas/spectral/specfuse-arazzo.yaml \
            "examples/hello-orders/api/specs/v1/scenarios/**/*.yaml"

      # The three lint steps above prove the corpus is CLEAN. They cannot prove
      # the ruleset is AWAKE — a rule whose `given` selects nothing contributes
      # exactly as much silence as a rule that passes, which is how eleven rules
      # (nine at `severity: error`) stayed inert for the whole life of the kit.
      # See authoring #73 and scripts/spectral-rule-coverage.py.
      #
      # This step asserts the complement: every rule's JSONPath selects at least
      # one node somewhere in the corpus. Add a construct to the given-coverage
      # fixtures when a new rule has nothing to select — the allowlist is the
      # fallback, not the habit.
      - name: Install the coverage-harness dependency
        run: python -m pip install --quiet PyYAML

      - name: Every OpenAPI rule's `given` selects something
        run: |
          scripts/spectral-rule-coverage.py \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            --allowlist schemas/spectral/coverage-allowlist.yaml \
            "${RUNNER_TEMP}/hello-orders.bundle.yaml" \
            'schemas/spectral/fixtures/*.yaml'

      - name: Every AsyncAPI rule's `given` selects something
        run: |
          scripts/spectral-rule-coverage.py \
            --ruleset schemas/spectral/specfuse-asyncapi.yaml \
            --allowlist schemas/spectral/coverage-allowlist.yaml \
            examples/hello-orders/api/specs/v1/asyncapi.yaml \
            'schemas/spectral/fixtures/*.yaml'

      - name: Every Arazzo rule's `given` selects something
        run: |
          scripts/spectral-rule-coverage.py \
            --ruleset schemas/spectral/specfuse-arazzo.yaml \
            --allowlist schemas/spectral/coverage-allowlist.yaml \
            'examples/hello-orders/api/specs/v1/scenarios/**/*.yaml' \
            schemas/spectral/fixtures/given-coverage-arazzo.yaml

      # The coverage harness proves a rule SELECTS. It cannot prove a rule
      # REJECTS — a `then` can be silent on a live `given` too. Three of the
      # rules below were checking `$ref` on the RESOLVED document, where the ref
      # has already been inlined, and stayed silent even after their JSONPath
      # was repaired. So assert the findings, not the exit code.
      - name: The rules authoring #73 found inert actually reject (regression)
        run: |
          # This fixture is SUPPOSED to fail, so spectral exits 1 and `bash -e`
          # would abort before the assertions run. Same opener as the other
          # fixture steps in this file.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/inert-rules.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/inert-rules-regression.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"
          [ $STATUS -ge 2 ] && { echo "::error::Spectral crashed on the inert-rules fixture" >&2; exit 1; }

          fail=0
          for rule in specfuse-auth-meta-present specfuse-auth-roles-pascal \
                      specfuse-401-required specfuse-401-predefined \
                      specfuse-403-required specfuse-403-predefined \
                      specfuse-400-required specfuse-400-predefined \
                      specfuse-404-predefined specfuse-415-when-request-body \
                      specfuse-406-when-alt-accept \
                      specfuse-list-response-requires-pagination-params; do
            if ! grep -q "$rule" "$REPORT"; then
              echo "::error::$rule did not fire on a fixture that violates it." >&2
              echo "It has gone inert again — see authoring #73." >&2
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "==> all twelve rules fired."

      - name: The AsyncAPI x-ai rule actually rejects (regression)
        run: |
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/async-ai.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-asyncapi.yaml \
            schemas/spectral/fixtures/given-coverage-async.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"
          [ $STATUS -ge 2 ] && { echo "::error::Spectral crashed on the async coverage fixture" >&2; exit 1; }

          if ! grep -q "specfuse-async-ai-must-have-entities" "$REPORT"; then
            echo "::error::specfuse-async-ai-must-have-entities did not fire on an x-ai" >&2
            echo "block that is enabled and declares no entities. It has gone inert." >&2
            exit 1
          fi
          echo "==> specfuse-async-ai-must-have-entities fired."

      # Regression net for authoring issue #14. Asserts two things that a
      # passing hello-orders run cannot assert on its own, because the example
      # contains no nulls and no duplicate enums:
      #
      #   1. A document full of nulls does not abort the run. The upstream
      #      `duplicated-entry-in-enum` rule crashes on any null; the kit turns
      #      it off and ships a null-safe replacement.
      #   2. That replacement still FIRES. A rule that stops crashing by never
      #      running looks identical to a fixed rule if you only watch the error
      #      count fall — so check for the finding, not for the exit code.
      - name: Null tolerance and duplicate-enum detection (regression)
        run: |
          # GitHub runs `run:` blocks under `bash -e`, which would abort this
          # step the moment `spectral lint` exits non-zero — before $? can be
          # inspected. This step needs to distinguish exit 1 (expected findings
          # on a deliberately invalid fixture) from exit >= 2 (a crash), so
          # disable errexit explicitly.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/null-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/null-and-enum-regression.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          # The fixture intentionally contains invalid constructs (a null schema
          # node), so error-severity findings are expected and fine. Only a
          # crash — exit 2 or above — is a failure here.
          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the null fixture (exit ${STATUS})." >&2
            echo "A null in the document is aborting the run and emitting zero" >&2
            echo "findings. Check for an unguarded '[?(' filter missing its" >&2
            echo "leading '@ &&' null check, in this kit's rules or an upstream" >&2
            echo "ruleset it extends. See authoring issue #14." >&2
            exit 1
          fi

          if ! grep -q "specfuse-no-duplicate-enum-entries" "$REPORT"; then
            echo "::error::specfuse-no-duplicate-enum-entries did not fire on the" >&2
            echo "fixture's BadEnum, which contains a duplicate entry. The rule is" >&2
            echo "silently not running — duplicate enum entries are unguarded." >&2
            exit 1
          fi

          echo "==> Null tolerance and duplicate-enum detection both verified."

      # Regression net for authoring issue #13. The updatedAt requirement is
      # exempted for entities declaring a non-mutable write policy. Both
      # directions are asserted: an exemption that accidentally swallows every
      # entity is indistinguishable from a working one if you only watch the
      # error count fall.
      - name: x-entity.mutability exemption matrix (regression)
        run: |
          # See the note on the previous step: `bash -e` would abort here on
          # the fixture's expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/mutability-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/mutability-exemption.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the mutability fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0
          flagged() { grep -q "components.schemas.$1.properties" "$REPORT"; }

          # Must still fire: no declaration means mutable, and so does an
          # explicit `mutable`.
          for entity in MutableThing DefaultedThing; do
            if ! flagged "$entity"; then
              echo "::error::${entity} should require updatedAt but was not flagged." >&2
              echo "The exemption is over-matching — it is now excusing mutable entities." >&2
              fail=1
            fi
          done

          # Must be exempt: rows are never modified, so updatedAt would be a
          # field asserting something untrue.
          for entity in ImmutableThing AppendOnlyThing GoodMutable; do
            if flagged "$entity"; then
              echo "::error::${entity} was flagged for a missing updatedAt but should be exempt." >&2
              fail=1
            fi
          done

          # The closed value set is what keeps the exemption from being an
          # escape hatch. If an unknown write policy stops being rejected,
          # any entity can opt out of updatedAt silently.
          if ! grep -q "specfuse-xentity-shape.*BogusMutability\|BogusMutability.x-entity.mutability" "$REPORT"; then
            echo "::error::An unknown x-entity.mutability value was accepted." >&2
            echo "The exemption is only safe while the value set stays closed." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> mutability exemption matrix verified in both directions."

      # Regression net for authoring issue #19. Each relationship/projection
      # rule must fire on its own violation, and a correctly-marked schema must
      # produce none of them — the second half is what keeps a shape rule from
      # quietly becoming a no-op.
      - name: Relationship and projection marker rules (regression)
        run: |
          # See the note two steps up: `bash -e` would abort on the fixture's
          # expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/relationship-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/relationship-markers.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the relationship fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0

          # Every rule must fire on the schema built to violate it.
          check() {
            if ! grep -q "$1" "$REPORT"; then
              echo "::error::$2 did not fire on ${1##*schemas.}." >&2
              fail=1
            fi
          }
          check "components.schemas.BadReferenceValue"  "specfuse-x-references-shape"
          check "components.schemas.UnjustifiedOpaque.properties.token" "specfuse-opaque-reference-justified"
          check "components.schemas.BadFkForValue"      "specfuse-x-fk-for-shape"
          check "components.schemas.ConflictingMarkers" "specfuse-fk-marker-exclusive"
          check "components.schemas.DanglingExpandOf"   "specfuse-projection-coherence"
          check "components.schemas.BadExpandOfTwin"    "specfuse-projection-coherence"
          check "components.schemas.InlineProjection"   "specfuse-projection-coherence"
          check "components.schemas.RequiredProjection" "specfuse-projection-coherence"
          check "components.schemas.NewThing"           "specfuse-no-projection-markers-on-derivatives"
          check "components.schemas.UpdateThing"        "specfuse-no-expand-of-on-derivatives"

          # And a correctly-marked schema must trip none of them. This is the
          # direction that catches over-matching — notably specfuse-projection-coherence
          # runs unresolved precisely so a compliant array-of-$ref is not
          # inlined-then-flagged.
          if grep -E "components.schemas.GoodMarkers.*(x-references|x-fk-for|x-projection|x-expand-of)" "$REPORT"; then
            echo "::error::GoodMarkers uses every marker correctly but was flagged." >&2
            echo "A relationship or projection rule is over-matching." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> relationship and projection marker rules verified in both directions."

      # Regression net for authoring issue #20. The reconcile identity rule
      # covers exactly one shape — an Update* DTO used as an array element
      # inside another Update* DTO — because requiring `id` on every Update*
      # DTO would be a false-positive storm. So the silent direction is the
      # one that matters most here, and it gets four cases to the violations'
      # two.
      - name: PATCH child-collection reconcile rule (regression)
        run: |
          # See the note further up: `bash -e` would abort on the fixture's
          # expected findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/reconcile-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/child-collection-reconcile.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the reconcile fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0

          # Fires: element DTO with no identity property.
          if ! grep -q "UpdateOrderLineNoId" "$REPORT"; then
            echo "::error::specfuse-child-collection-reconcile-id did not fire on" >&2
            echo "UpdateOrder.lines, whose element DTO has no 'id'. The reconcile" >&2
            echo "contract is unimplementable for that shape." >&2
            fail=1
          fi

          # Fires: `id` present but required, which forbids the create leg.
          if ! grep -q "UpdateInvoiceRow" "$REPORT"; then
            echo "::error::specfuse-child-collection-reconcile-id did not fire on" >&2
            echo "UpdateInvoiceRow, which requires 'id' and so cannot express a create." >&2
            fail=1
          fi

          # Stays silent everywhere else. A rule that flags every Update* DTO
          # would bury the two real findings above in noise.
          for clean in UpdateGoodOrderLine UpdateCustomer UpdateBasket UpdateCatalog; do
            if grep "reconcile-id" "$REPORT" | grep -q "$clean"; then
              echo "::error::specfuse-child-collection-reconcile-id flagged ${clean}," >&2
              echo "which is outside the rule's intended shape. It is over-matching." >&2
              fail=1
            fi
          done

          [[ $fail -eq 0 ]] || exit 1
          echo "==> child-collection reconcile rule verified in both directions."

      # Regression net for the service-topology rules (info.x-services, holds,
      # Read{Entity}). These lint a vocabulary the PINNED generator (0.5.8) does
      # not implement — it landed on generator `main` after that release — so
      # for now the kit's rules are an author's only feedback and nothing
      # generator-side corroborates them. That makes both directions load-
      # bearing rather than merely good practice: an over-matching rule here has
      # no second opinion to correct it. See compatibility.md §24.
      - name: Service topology and Read{Entity} rules (regression)
        run: |
          # See the note on the earlier fixture steps: `bash -e` would abort on
          # the fixture's expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/service-topology.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/service-topology.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the service-topology fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0
          fired() { grep -q "$1" "$REPORT"; }

          # ---- Each rule fires on its violation --------------------------
          declare -a EXPECTED=(
            "specfuse-services-registry-shape|ghost-service|a 'hold:' typo was accepted as a service-entry key"
            "specfuse-services-domain-single-owner|catalog|a domain claimed by two services was not reported"
            "specfuse-services-domain-registered|shipping|a domain outside info.x-domains was accepted"
            "specfuse-services-holds-pairing|Ghost|holds naming a non-entity was accepted"
            "specfuse-services-holds-pairing|ReadInvoice|holds with no matching Read schema was accepted"
            "specfuse-read-model-primary-key|ReadCompany|a replica with no primary key was accepted"
            "specfuse-read-model-nested-entity|ReadEmployee|a replica embedding a Basic* projection was accepted"
            "specfuse-read-model-not-a-wire-type|ReadUser|a replica used as a response payload was accepted"
            "specfuse-read-model-source-delete|ReadOrder|a source with x-entity.delete undeclared was accepted"
            "specfuse-read-model-source-delete|ReadTable|a soft-delete source's replica with no deletedAt was accepted"
            "specfuse-read-model-unheld|ReadCompany|a Read schema no service holds was not reported"
          )
          for row in "${EXPECTED[@]}"; do
            IFS='|' read -r rule needle why <<<"$row"
            if ! grep "$rule" "$REPORT" | grep -q "$needle"; then
              echo "::error::${rule} did not fire for '${needle}': ${why}." >&2
              fail=1
            fi
          done

          # ---- and stays silent on the clean case sitting beside it -------
          #
          # ReadRestaurant is the whole point of the fixture: primary key
          # present, soft-delete source's deletion state carried, an enum
          # reference rather than an entity embed, held by booking-service, and
          # nowhere on the wire. A rule that flags it is over-matching, and the
          # error count alone would not say so.
          if grep -E "specfuse-(services|read-model)" "$REPORT" | grep -q "ReadRestaurant"; then
            echo "::error::A service-topology rule flagged ReadRestaurant, which is the" >&2
            echo "fixture's correct replica. The rule is over-matching." >&2
            fail=1
          fi

          # `Readme` is `Read` + a lowercase letter — an ordinary schema name,
          # not a replica declaration. Treating it as one would make every
          # project with a Readme/Readiness schema fail lint.
          if grep -E "specfuse-(services|read-model)" "$REPORT" | grep -q "Readme"; then
            echo "::error::A service-topology rule treated 'Readme' as a Read{Entity}." >&2
            echo "The 'Read' + uppercase guard is not holding." >&2
            fail=1
          fi

          # warehouse-service declares one registered domain and holds nothing,
          # which is a complete and correct entry. Only the duplicate-owner rule
          # may name it, and only because ghost-service re-claims its domain.
          if grep -E "specfuse-services-(registry-shape|domain-registered|holds-pairing)" "$REPORT" \
               | grep -q "warehouse-service"; then
            echo "::error::A registry rule flagged warehouse-service, which is well-formed." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> service topology and Read{Entity} rules verified in both directions."

      # Regression net for the x-classification value rules. Three of the four
      # run over EVERY property of every entity schema, so an over-matching one
      # does not produce a few wrong findings — it produces one per property
      # across the whole spec, which is the state in which a team turns the
      # rule off. The clean-case assertions below are the ones that catch that.
      - name: x-classification value rules (regression)
        run: |
          # See the note on the earlier fixture steps: `bash -e` would abort on
          # the fixture's expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/classification.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/classification.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the classification fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0

          # ---- Each rule fires on its violation --------------------------
          declare -a EXPECTED=(
            "specfuse-classification-values|nickname|a value outside the closed set was accepted"
            "specfuse-classification-values|alias|a scalar x-classification was accepted"
            "specfuse-classification-values|tag|an empty x-classification was accepted"
            "specfuse-classification-exposed-contradiction|sessionHash|exposed + encrypted was accepted"
            "specfuse-classification-exposed-contradiction|resetSalt|exposed + sensitive was accepted"
            "specfuse-classification-exposed-needs-description|tokenHash|exposed with no description was accepted"
            "specfuse-classification-exposed-needs-description|blankHash|exposed with a blank description was accepted"
            "specfuse-classification-pii-required|firstName|a PII-named property with no classification was accepted"
            "specfuse-classification-pii-required|dateOfBirth|a PII-named property with no classification was accepted"
            "specfuse-classification-pii-required|contactEmail|a format:email property with no classification was accepted"
            # NOTE: #76 asserted exposedCard / exposedSecret / exposedCvv here,
            # on a contradiction set reasoned rather than measured. Generator
            # 0.6.0 ACCEPTS [cardholder, exposed] and owns credential and sad
            # through different rules, so those three assertions were wrong and
            # are gone. exposedCardholder below is now a must-STAY-SILENT
            # control for exactly that reason.
            "specfuse-classification-encrypted-superseded|sinEncrypted|the encrypted supersession notice did not fire"
            # x-protection, generator 0.6.0. Each of these was cross-checked
            # against the jar: the kit fires exactly where the generator does.
            "specfuse-xprotection-atrest-required|classifiedNoAtRest|a classified property with no atRest was accepted"
            "specfuse-xprotection-none-requires-rationale|noneNoRationale|atRest none with no rationale was accepted"
            "specfuse-xprotection-shape|unknownSubKey|an unknown x-protection sub-key was accepted"
            "specfuse-xprotection-shape|badAtRest|an atRest value outside the enum was accepted"
            "specfuse-xprotection-shape|camelNeverPersist|neverPersist was accepted; the separator is an underscore"
            "specfuse-xprotection-shape|badBlindIndexKey|an unknown blindIndex sub-key was accepted"
            "specfuse-xprotection-mode-deterministic-unsupported|deterministicMode|mode deterministic was accepted"
            # The exposed mutex, corrected in this PR to mirror the generator.
            "specfuse-classification-exposed-contradiction|exposedSensitive|exposed + sensitive was accepted"
            "specfuse-classification-exposed-contradiction|exposedConfidential|exposed + confidential was accepted"
            "specfuse-classification-exposed-contradiction|exposedButEncrypted|exposed + an encrypted atRest was accepted"
            "specfuse-xprotection-sad-not-persisted|exposedCvv|sad on an x-entity property was accepted (PCI-DSS: never stored)"
            "specfuse-xprotection-never-persist-not-mapped|exposedCvv|never_persist on a persisted x-entity property was accepted"
          )
          for row in "${EXPECTED[@]}"; do
            IFS='|' read -r rule needle why <<<"$row"
            if ! grep "$rule" "$REPORT" | grep -q "$needle"; then
              echo "::error::${rule} did not fire for '${needle}': ${why}." >&2
              fail=1
            fi
          done

          # ---- and stays silent on the correct case beside it -------------
          #
          # Customer is the positive control: every property correctly
          # classified, including a legitimate `exposed` with its justification.
          # A rule that flags any of it is over-matching.
          # Scoped to `error`, not to any finding. Customer.taxId is correctly
          # classified `[pii, encrypted]`, and `encrypted` now draws a WARN
          # supersession notice by design (authoring #76) — that is the rule
          # working, not over-matching. An ERROR on this schema still is.
          if grep -E "specfuse-(classification|xprotection)" "$REPORT" | grep "error" | grep -q "Customer"; then
            echo "::error::A classification rule raised an ERROR on the Customer control schema," >&2
            echo "every property of which is correctly classified. It is over-matching." >&2
            fail=1
          fi

          # ...and the notice must actually reach a correctly-classified
          # `encrypted` property, or it is a rule that only fires on fixtures
          # built for it.
          if ! grep "specfuse-classification-encrypted-superseded" "$REPORT" | grep -q "taxId"; then
            echo "::error::The encrypted supersession notice did not fire on Customer.taxId," >&2
            echo "a correct [pii, encrypted] declaration. The notice is not reaching real usage." >&2
            fail=1
          fi

          # The five tokens added in authoring #76 must be ACCEPTED. The
          # four-value enum errored on every one of them while the pinned jar
          # had no opinion at all — the domain/concurrency/delete failure mode,
          # live in a shipped release. Any finding here means it has returned.
          if grep "specfuse-classification" "$REPORT" | grep -q "WidenedVocabulary"; then
            echo "::error::A classification rule flagged WidenedVocabulary, which uses only" >&2
            echo "confidential/financial/credential/cardholder/sad. The enum has narrowed again." >&2
            fail=1
          fi

          # `pii` beside `exposed` has always been legal — your own email, shown
          # to you. `confidential` and `financial` follow that precedent on
          # purpose; if they start contradicting, the widening went too far.
          if grep "specfuse-classification-exposed-contradiction" "$REPORT" | grep -q "ownInvoiceTotal"; then
            echo "::error::exposed-contradiction fired on 'ownInvoiceTotal'. [financial, exposed] is" >&2
            echo "accepted by generator 0.6.0 — data shown to the person it concerns stays pairable." >&2
            fail=1
          fi

          # The generator ACCEPTS these two pairings. #76 set the contradiction
          # set by reasoning rather than measurement and got both backwards —
          # it rejected `cardholder` (which the jar accepts) and accepted
          # `confidential` (which the jar rejects). Rejecting what the generator
          # accepts is the forbidden direction; these two assertions are what
          # stops it coming back.
          for ok in exposedCardholder exposedFinancial; do
            if grep "specfuse-classification-exposed-contradiction" "$REPORT" | grep -q "$ok"; then
              echo "::error::exposed-contradiction fired on '${ok}', which generator 0.6.0 accepts." >&2
              echo "The kit must not reject what the jar it distributes permits." >&2
              fail=1
            fi
          done

          # Valid x-protection blocks must stay silent, or the shape guard is
          # rejecting the vocabulary it is meant to admit.
          for ok in okEncrypted okNoneWithRationale okUnbounded; do
            if grep "specfuse-xprotection" "$REPORT" | grep -q "$ok"; then
              echo "::error::An x-protection rule fired on '${ok}', which is valid against" >&2
              echo "generator 0.6.0. The guard is over-matching." >&2
              fail=1
            fi
          done

          # `encrypted` is NOTICED, not rejected. It stays valid until a
          # RELEASED generator removes it; erroring here would reject a value
          # the pinned jar still reads.
          if grep "specfuse-classification-values" "$REPORT" | grep -q "sinEncrypted"; then
            echo "::error::specfuse-classification-values rejected 'encrypted'. It must stay in" >&2
            echo "the set until a released generator removes it — see compatibility.md §26." >&2
            fail=1
          fi

          # The jar's PII name list is deliberately narrow: `emails` on an
          # Inbox-shaped schema must not be treated as PII. Widening the list
          # kit-side would fail lint on specs that generate fine.
          if grep "specfuse-classification-pii-required" "$REPORT" | grep -q "emails"; then
            echo "::error::pii-required fired on 'emails', which is not an exact match for the" >&2
            echo "jar's name list. The heuristic has been widened past the generator." >&2
            fail=1
          fi

          # Presence only, exactly as the jar checks it. `phonePrimary` carrying
          # any classification satisfies the rule. Tightening past the jar is
          # the forbidden direction even when the tightening looks correct.
          if grep "specfuse-classification-pii-required" "$REPORT" | grep -q "phonePrimary"; then
            echo "::error::pii-required fired on 'phonePrimary', which declares a classification." >&2
            echo "The rule has moved from presence to value and is now stricter than the jar." >&2
            fail=1
          fi

          # Entity schemas only. DTOs project the same fields, and double-
          # flagging every PII property is how the rule stops being read.
          if grep "specfuse-classification-pii-required" "$REPORT" | grep -q "NotAnEntity"; then
            echo "::error::pii-required reached NotAnEntity, which carries no x-entity." >&2
            fail=1
          fi

          # ...but the value set applies wherever it is written, entity or not.
          if ! grep "specfuse-classification-values" "$REPORT" | grep -q "NotAnEntity"; then
            echo "::error::specfuse-classification-values did not fire on NotAnEntity.nickname." >&2
            echo "The value rule has been scoped to entities and now misses DTO typos." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> x-classification value rules verified in both directions."

      # Regression net for the x-scopes grammar. `x-scopes` is read by nothing
      # in the generator, so these rules are the ONLY feedback this vocabulary
      # has — there is no second opinion to correct an over-matching one, which
      # makes the clean-case assertions the load-bearing half here.
      - name: x-scopes grammar rules (regression)
        run: |
          # See the note on the earlier fixture steps: `bash -e` would abort on
          # the fixture's expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/scope-grammar.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/scope-grammar.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the scope-grammar fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0

          # ---- Each rule fires on its violation --------------------------
          declare -a EXPECTED=(
            "specfuse-auth-scopes-shape|oneSegment|a one-segment scope was accepted"
            "specfuse-auth-scopes-shape|fourSegments|a four-segment scope was accepted"
            "specfuse-auth-scopes-shape|badOperation|a scope not ending in an operation was accepted"
            "specfuse-auth-scopes-shape|camelDomain|a camelCase domain segment was accepted"
            "specfuse-auth-scopes-shape|lowerEntity|a lowercase entity segment was accepted"
            "specfuse-auth-scopes-shape|operationDomain|a domain named for an operation was accepted"
            "specfuse-auth-scopes-registry|unknownDomain|a domain outside info.x-domains was accepted"
            "specfuse-auth-scopes-registry|unknownEntity|a scope naming a non-entity was accepted"
            "specfuse-auth-scopes-registry|wrongDomain|an entity/domain mismatch was accepted"
            "specfuse-auth-scopes-all-on-operation|allOnly|'all' required at an endpoint was not reported"
            "specfuse-auth-scopes-all-on-operation|allRedundant|'all' beside a narrower sibling was not reported"
          )
          for row in "${EXPECTED[@]}"; do
            IFS='|' read -r rule needle why <<<"$row"
            if ! grep "$rule" "$REPORT" | grep -q "$needle"; then
              echo "::error::${rule} did not fire for '${needle}': ${why}." >&2
              fail=1
            fi
          done

          # ---- and stays silent on every correct form ---------------------
          #
          # /clean/* covers both segment counts, a kebab-case multi-word domain,
          # `delete` as its own action, and two scopes on one operation. A rule
          # that flags any of them is over-matching, and with no generator-side
          # check on x-scopes nothing else would catch that.
          if grep "specfuse-auth-scopes" "$REPORT" | grep -q "/clean/"; then
            echo "::error::A scope rule flagged a /clean/ operation. It is over-matching." >&2
            fail=1
          fi

          # One mistake, one finding. A malformed domain is the shape rule's to
          # report — the registry rule must not also call it unregistered, or
          # fixing the casing silently removes a second finding the author was
          # never given a way to understand.
          for once in camelDomain operationDomain lowerEntity; do
            n=$(grep -c "specfuse-auth-scopes.*${once}" "$REPORT")
            if [[ "$n" -ne 1 ]]; then
              echo "::error::'${once}' produced ${n} scope findings; expected exactly 1." >&2
              echo "The shape and registry rules are double-reporting one mistake." >&2
              fail=1
            fi
          done

          [[ $fail -eq 0 ]] || exit 1
          echo "==> x-scopes grammar rules verified in both directions."

      # Lint the linter. `$.paths[*].[verb,…]` — a dot before the bracket
      # union — is never the intended form: every other rule in the file spells
      # it `$.paths[*][verb,…]`, and jsonpath-plus's handling of the dotted
      # variant is an implementation detail no rule should rest on.
      #
      # Reported by a consumer (restomanager-specs, 2026-08-20) who saw rules
      # using the dotted form fire on `components.schemas.<Entity>.x-entity.delete`
      # — nodes far outside `paths`. That leak does NOT reproduce against this
      # ruleset on Spectral 6.16.2: probed directly, both spellings match the
      # identical node set, and normalising all ten occurrences moved no count
      # on the example or on any fixture. So this guard is not a fix for a
      # confirmed leak; it removes a form that is inconsistent, is documented
      # ambiguously upstream, and cost nothing to retire.
      #
      # It is a grep rather than a Spectral rule because Spectral cannot lint
      # its own ruleset, which is exactly the gap the reporter flagged in their
      # own fix: theirs is a convention in CLAUDE.md, so a new rule can
      # reintroduce the form and nothing catches it.
      - name: Ruleset self-check — no dot-before-bracket JSONPath unions
        run: |
          set -uo pipefail
          hits=$(grep -rn '\$\.paths\[[^]]*\]\.\[' schemas/spectral/*.yaml || true)
          if [[ -n "$hits" ]]; then
            echo "::error::A rule uses the dot-before-bracket union form." >&2
            echo "$hits" >&2
            echo "Write \$.paths[*][verb,...] — no dot before the bracket." >&2
            exit 1
          fi
          echo "==> No dot-before-bracket JSONPath unions in any ruleset."

      # Regression net for the phantom cascade keys. Both directions matter and
      # the *accept* direction matters more: `cascadeDelete` and `children` are
      # read by nothing, but they are still accepted by the shape guard on
      # purpose (retiring an extension is the generator's call, follow-up 23).
      # A rule that errored here would fail lint on specs that generate exactly
      # as they do today — the forbidden direction.
      - name: Phantom cascade keys warn but do not block (regression)
        run: |
          # See the note on the earlier fixture steps: `bash -e` would abort on
          # the fixture's expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/cascade-phantom.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/xentity-shape-keys.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the xentity-shape fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0

          # Fires on the entity that declares them.
          for rule in specfuse-xentity-cascade-phantom specfuse-xentity-children-phantom; do
            if ! grep "$rule" "$REPORT" | grep -q "CascadePhantom"; then
              echo "::error::${rule} did not fire on CascadePhantom." >&2
              fail=1
            fi
          done

          # Still ACCEPTED by the closed guard — a shape error here would mean
          # the kit had unilaterally retired a key the generator has not.
          if grep "specfuse-xentity-shape" "$REPORT" | grep -q "CascadePhantom"; then
            echo "::error::specfuse-xentity-shape rejected CascadePhantom. The phantom keys" >&2
            echo "must stay accepted; the nudge is a WARNING, not an error." >&2
            fail=1
          fi

          # Silent on an entity that declares neither.
          if grep -E "specfuse-xentity-(cascade|children)-phantom" "$REPORT" | grep -q "CascadeClean"; then
            echo "::error::A phantom-key rule fired on CascadeClean, which declares neither key." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> Phantom cascade keys warn, stay accepted, and do not over-match."
