# =============================================================================
# example-regen.yml — regression net for the bundled hello-orders example
# =============================================================================
# This workflow re-validates the spec-authoring-kit's bundled example project
# at examples/hello-orders/ on every PR. If a handbook or template change
# breaks the example, the PR fails.
#
# Two jobs run today:
#   - validate: YAML parseability + project.json validity (the floor).
#   - spectral: bundle the OpenAPI surface with redocly, then lint all three
#     surfaces against the kit's rulesets; fail on any `error`-severity finding.
#
# Every Spectral invocation goes through scripts/spectral-lint.sh rather than
# calling `spectral lint` directly. The wrapper exists because the default
# failure mode of a lint tool is silence: a crash, a timeout, or a bad ruleset
# path makes Spectral emit no findings at all, which is byte-for-byte
# indistinguishable from a clean spec if you only look at the report. The
# wrapper treats "produced no output" and "exited >= 2" as failures. See
# authoring issue #14.
#
# Still to come as the toolchain grows:
#   - End-to-end generator regeneration + diff (once wired into CI).
# =============================================================================

name: example-regen

on:
  pull_request:
    paths:
      - 'examples/hello-orders/**'
      - 'handbooks/**'
      - 'samples/**'
      - 'templates/**'
      - 'schemas/**'
      - '.github/workflows/example-regen.yml'
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate hello-orders example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate every YAML file under examples/hello-orders/api/
        run: |
          set -euo pipefail
          python3 <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob('examples/hello-orders/api/**/*.yaml', recursive=True))
          if not files:
              print('FAIL: no YAML files found under examples/hello-orders/api/')
              sys.exit(1)

          errors = []
          for f in files:
              try:
                  with open(f) as fh:
                      # safe_load_all handles multi-document files
                      # (Arazzo scenario files may contain multiple workflows)
                      list(yaml.safe_load_all(fh))
              except Exception as e:
                  errors.append((f, str(e)))

          print(f'Validated {len(files)} YAML files; {len(errors)} errors')
          for f, e in errors:
              print(f'  FAIL: {f}: {e}')
          sys.exit(1 if errors else 0)
          PY

      - name: Confirm hello-orders project.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('examples/hello-orders/hello-orders-project.json'))"

  spectral:
    name: Spectral lint hello-orders (OpenAPI + AsyncAPI + Arazzo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install redocly + spectral
        run: npm install -g @redocly/cli @stoplight/spectral-cli

      - name: Bundle the OpenAPI surface
        run: |
          redocly bundle examples/hello-orders/api/specs/v1/openapi.yaml \
            -o "${RUNNER_TEMP}/hello-orders.bundle.yaml"

      - name: Lint the bundle against the kit's OpenAPI ruleset
        run: |
          # The wrapper fails the job on error-severity findings AND on any
          # Spectral crash or empty report, which would otherwise look like a
          # clean run. See scripts/spectral-lint.sh.
          scripts/spectral-lint.sh "OpenAPI (hello-orders bundle)" \
            schemas/spectral/specfuse-openapi.yaml \
            "${RUNNER_TEMP}/hello-orders.bundle.yaml"

      # AsyncAPI and Arazzo need no bundling — Spectral resolves their $refs
      # directly (no operation-level-$ref antipattern as in OpenAPI).
      - name: Lint the AsyncAPI surface
        run: |
          scripts/spectral-lint.sh "AsyncAPI (hello-orders)" \
            schemas/spectral/specfuse-asyncapi.yaml \
            examples/hello-orders/api/specs/v1/asyncapi.yaml

      - name: Lint the Arazzo scenarios and recipes
        run: |
          scripts/spectral-lint.sh "Arazzo (hello-orders scenarios)" \
            schemas/spectral/specfuse-arazzo.yaml \
            "examples/hello-orders/api/specs/v1/scenarios/**/*.yaml"

      # Regression net for authoring issue #14. Asserts two things that a
      # passing hello-orders run cannot assert on its own, because the example
      # contains no nulls and no duplicate enums:
      #
      #   1. A document full of nulls does not abort the run. The upstream
      #      `duplicated-entry-in-enum` rule crashes on any null; the kit turns
      #      it off and ships a null-safe replacement.
      #   2. That replacement still FIRES. A rule that stops crashing by never
      #      running looks identical to a fixed rule if you only watch the error
      #      count fall — so check for the finding, not for the exit code.
      - name: Null tolerance and duplicate-enum detection (regression)
        run: |
          # GitHub runs `run:` blocks under `bash -e`, which would abort this
          # step the moment `spectral lint` exits non-zero — before $? can be
          # inspected. This step needs to distinguish exit 1 (expected findings
          # on a deliberately invalid fixture) from exit >= 2 (a crash), so
          # disable errexit explicitly.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/null-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/null-and-enum-regression.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          # The fixture intentionally contains invalid constructs (a null schema
          # node), so error-severity findings are expected and fine. Only a
          # crash — exit 2 or above — is a failure here.
          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the null fixture (exit ${STATUS})." >&2
            echo "A null in the document is aborting the run and emitting zero" >&2
            echo "findings. Check for an unguarded '[?(' filter missing its" >&2
            echo "leading '@ &&' null check, in this kit's rules or an upstream" >&2
            echo "ruleset it extends. See authoring issue #14." >&2
            exit 1
          fi

          if ! grep -q "specfuse-no-duplicate-enum-entries" "$REPORT"; then
            echo "::error::specfuse-no-duplicate-enum-entries did not fire on the" >&2
            echo "fixture's BadEnum, which contains a duplicate entry. The rule is" >&2
            echo "silently not running — duplicate enum entries are unguarded." >&2
            exit 1
          fi

          echo "==> Null tolerance and duplicate-enum detection both verified."

      # Regression net for authoring issue #13. The updatedAt requirement is
      # exempted for entities declaring a non-mutable write policy. Both
      # directions are asserted: an exemption that accidentally swallows every
      # entity is indistinguishable from a working one if you only watch the
      # error count fall.
      - name: x-entity.mutability exemption matrix (regression)
        run: |
          # See the note on the previous step: `bash -e` would abort here on
          # the fixture's expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/mutability-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/mutability-exemption.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the mutability fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0
          flagged() { grep -q "components.schemas.$1.properties" "$REPORT"; }

          # Must still fire: no declaration means mutable, and so does an
          # explicit `mutable`.
          for entity in MutableThing DefaultedThing; do
            if ! flagged "$entity"; then
              echo "::error::${entity} should require updatedAt but was not flagged." >&2
              echo "The exemption is over-matching — it is now excusing mutable entities." >&2
              fail=1
            fi
          done

          # Must be exempt: rows are never modified, so updatedAt would be a
          # field asserting something untrue.
          for entity in ImmutableThing AppendOnlyThing GoodMutable; do
            if flagged "$entity"; then
              echo "::error::${entity} was flagged for a missing updatedAt but should be exempt." >&2
              fail=1
            fi
          done

          # The closed value set is what keeps the exemption from being an
          # escape hatch. If an unknown write policy stops being rejected,
          # any entity can opt out of updatedAt silently.
          if ! grep -q "specfuse-xentity-shape.*BogusMutability\|BogusMutability.x-entity.mutability" "$REPORT"; then
            echo "::error::An unknown x-entity.mutability value was accepted." >&2
            echo "The exemption is only safe while the value set stays closed." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> mutability exemption matrix verified in both directions."

      # Regression net for authoring issue #19. Each relationship/projection
      # rule must fire on its own violation, and a correctly-marked schema must
      # produce none of them — the second half is what keeps a shape rule from
      # quietly becoming a no-op.
      - name: Relationship and projection marker rules (regression)
        run: |
          # See the note two steps up: `bash -e` would abort on the fixture's
          # expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/relationship-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/relationship-markers.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the relationship fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0

          # Every rule must fire on the schema built to violate it.
          check() {
            if ! grep -q "$1" "$REPORT"; then
              echo "::error::$2 did not fire on ${1##*schemas.}." >&2
              fail=1
            fi
          }
          check "components.schemas.BadReferenceValue"  "specfuse-x-references-shape"
          check "components.schemas.UnjustifiedOpaque.properties.token" "specfuse-opaque-reference-justified"
          check "components.schemas.BadFkForValue"      "specfuse-x-fk-for-shape"
          check "components.schemas.ConflictingMarkers" "specfuse-fk-marker-exclusive"
          check "components.schemas.DanglingExpandOf"   "specfuse-projection-coherence"
          check "components.schemas.BadExpandOfTwin"    "specfuse-projection-coherence"
          check "components.schemas.InlineProjection"   "specfuse-projection-coherence"
          check "components.schemas.RequiredProjection" "specfuse-projection-coherence"
          check "components.schemas.NewThing"           "specfuse-no-projection-markers-on-derivatives"
          check "components.schemas.UpdateThing"        "specfuse-no-expand-of-on-derivatives"

          # And a correctly-marked schema must trip none of them. This is the
          # direction that catches over-matching — notably specfuse-projection-coherence
          # runs unresolved precisely so a compliant array-of-$ref is not
          # inlined-then-flagged.
          if grep -E "components.schemas.GoodMarkers.*(x-references|x-fk-for|x-projection|x-expand-of)" "$REPORT"; then
            echo "::error::GoodMarkers uses every marker correctly but was flagged." >&2
            echo "A relationship or projection rule is over-matching." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> relationship and projection marker rules verified in both directions."

      # Regression net for authoring issue #20. The reconcile identity rule
      # covers exactly one shape — an Update* DTO used as an array element
      # inside another Update* DTO — because requiring `id` on every Update*
      # DTO would be a false-positive storm. So the silent direction is the
      # one that matters most here, and it gets four cases to the violations'
      # two.
      - name: PATCH child-collection reconcile rule (regression)
        run: |
          # See the note further up: `bash -e` would abort on the fixture's
          # expected findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/reconcile-regression.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/child-collection-reconcile.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the reconcile fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0

          # Fires: element DTO with no identity property.
          if ! grep -q "UpdateOrderLineNoId" "$REPORT"; then
            echo "::error::specfuse-child-collection-reconcile-id did not fire on" >&2
            echo "UpdateOrder.lines, whose element DTO has no 'id'. The reconcile" >&2
            echo "contract is unimplementable for that shape." >&2
            fail=1
          fi

          # Fires: `id` present but required, which forbids the create leg.
          if ! grep -q "UpdateInvoiceRow" "$REPORT"; then
            echo "::error::specfuse-child-collection-reconcile-id did not fire on" >&2
            echo "UpdateInvoiceRow, which requires 'id' and so cannot express a create." >&2
            fail=1
          fi

          # Stays silent everywhere else. A rule that flags every Update* DTO
          # would bury the two real findings above in noise.
          for clean in UpdateGoodOrderLine UpdateCustomer UpdateBasket UpdateCatalog; do
            if grep "reconcile-id" "$REPORT" | grep -q "$clean"; then
              echo "::error::specfuse-child-collection-reconcile-id flagged ${clean}," >&2
              echo "which is outside the rule's intended shape. It is over-matching." >&2
              fail=1
            fi
          done

          [[ $fail -eq 0 ]] || exit 1
          echo "==> child-collection reconcile rule verified in both directions."

      # Regression net for the service-topology rules (info.x-services, holds,
      # Read{Entity}). These lint a vocabulary the PINNED generator (0.5.8) does
      # not implement — it landed on generator `main` after that release — so
      # for now the kit's rules are an author's only feedback and nothing
      # generator-side corroborates them. That makes both directions load-
      # bearing rather than merely good practice: an over-matching rule here has
      # no second opinion to correct it. See compatibility.md §24.
      - name: Service topology and Read{Entity} rules (regression)
        run: |
          # See the note on the earlier fixture steps: `bash -e` would abort on
          # the fixture's expected error-severity findings.
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/service-topology.txt"

          spectral lint \
            --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/service-topology.yaml \
            >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"

          if [[ $STATUS -ge 2 ]]; then
            echo "::error::Spectral crashed on the service-topology fixture (exit ${STATUS})." >&2
            exit 1
          fi

          fail=0
          fired() { grep -q "$1" "$REPORT"; }

          # ---- Each rule fires on its violation --------------------------
          declare -a EXPECTED=(
            "specfuse-services-registry-shape|ghost-service|a 'hold:' typo was accepted as a service-entry key"
            "specfuse-services-domain-single-owner|catalog|a domain claimed by two services was not reported"
            "specfuse-services-domain-registered|shipping|a domain outside info.x-domains was accepted"
            "specfuse-services-holds-pairing|Ghost|holds naming a non-entity was accepted"
            "specfuse-services-holds-pairing|ReadInvoice|holds with no matching Read schema was accepted"
            "specfuse-read-model-primary-key|ReadCompany|a replica with no primary key was accepted"
            "specfuse-read-model-nested-entity|ReadEmployee|a replica embedding a Basic* projection was accepted"
            "specfuse-read-model-not-a-wire-type|ReadUser|a replica used as a response payload was accepted"
            "specfuse-read-model-source-delete|ReadOrder|a source with x-entity.delete undeclared was accepted"
            "specfuse-read-model-source-delete|ReadTable|a soft-delete source's replica with no deletedAt was accepted"
            "specfuse-read-model-unheld|ReadCompany|a Read schema no service holds was not reported"
          )
          for row in "${EXPECTED[@]}"; do
            IFS='|' read -r rule needle why <<<"$row"
            if ! grep "$rule" "$REPORT" | grep -q "$needle"; then
              echo "::error::${rule} did not fire for '${needle}': ${why}." >&2
              fail=1
            fi
          done

          # ---- and stays silent on the clean case sitting beside it -------
          #
          # ReadRestaurant is the whole point of the fixture: primary key
          # present, soft-delete source's deletion state carried, an enum
          # reference rather than an entity embed, held by booking-service, and
          # nowhere on the wire. A rule that flags it is over-matching, and the
          # error count alone would not say so.
          if grep -E "specfuse-(services|read-model)" "$REPORT" | grep -q "ReadRestaurant"; then
            echo "::error::A service-topology rule flagged ReadRestaurant, which is the" >&2
            echo "fixture's correct replica. The rule is over-matching." >&2
            fail=1
          fi

          # `Readme` is `Read` + a lowercase letter — an ordinary schema name,
          # not a replica declaration. Treating it as one would make every
          # project with a Readme/Readiness schema fail lint.
          if grep -E "specfuse-(services|read-model)" "$REPORT" | grep -q "Readme"; then
            echo "::error::A service-topology rule treated 'Readme' as a Read{Entity}." >&2
            echo "The 'Read' + uppercase guard is not holding." >&2
            fail=1
          fi

          # warehouse-service declares one registered domain and holds nothing,
          # which is a complete and correct entry. Only the duplicate-owner rule
          # may name it, and only because ghost-service re-claims its domain.
          if grep -E "specfuse-services-(registry-shape|domain-registered|holds-pairing)" "$REPORT" \
               | grep -q "warehouse-service"; then
            echo "::error::A registry rule flagged warehouse-service, which is well-formed." >&2
            fail=1
          fi

          [[ $fail -eq 0 ]] || exit 1
          echo "==> service topology and Read{Entity} rules verified in both directions."
