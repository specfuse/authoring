#
# Always-run gate. Unlike build-wheel.yml / example-regen.yml (which are
# path-filtered), this runs on EVERY push to main and EVERY pull request, so it
# is safe to mark as a required status check on `main` (a PR can never leave it
# "pending" for lack of a matching path). Keep it fast: build the wheel and
# prove a clean install bootstraps a project and the versions agree.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Clean-install and bootstrap from the built wheel
        run: |
          python -m venv /tmp/ci
          /tmp/ci/bin/pip install --quiet "$(ls dist/*.whl)"
          /tmp/ci/bin/python -c "import specfuse.authoring as a; print('import OK', a.__version__)"
          # The umbrella dispatches `specfuse authoring …` into this exact
          # dotted path (specfuse.authoring.cli:_run). Renaming the module or
          # the function turns the subcommand into a run-time ImportError that
          # only surfaces after this package is on PyPI, so assert it here.
          /tmp/ci/bin/python -c "from specfuse.authoring.cli import _run; assert callable(_run)"
          # Usage must read as the suite subcommand for every invocation except
          # the deprecated flat script, which keeps printing the name typed.
          /tmp/ci/bin/python -m specfuse.authoring.cli --help >/tmp/help.txt
          grep -q '^usage: specfuse authoring' /tmp/help.txt
          # The flat script stays until the coordinated 1.0.0 removal; CI
          # installs this package alone, so it is also what CI drives below.
          /tmp/ci/bin/specfuse-authoring --version
          /tmp/ci/bin/specfuse-authoring init /tmp/smoke \
            --name beta-shop --token beta --domain cart --yes
          test -f /tmp/smoke/.specfuse/authoring/handbooks/API_Handbook.md
          test -d /tmp/smoke/api/specs/v1/domains/cart
          /tmp/ci/bin/python -c "import json; s=json.load(open('/tmp/smoke/.claude/settings.json')); assert s['enabledPlugins']['specfuse-authoring@specfuse'] is True; assert s['extraKnownMarketplaces']['specfuse']['source']['repo']=='specfuse/specfuse'"
          ! find /tmp/smoke -name '*.template' | grep -q .
          test -f /tmp/smoke/.specfuse/authoring/VERSION
          test -f /tmp/smoke/.specfuse/authoring/.scaffold-manifest
          test -f /tmp/smoke/.specfuse/authoring/schemas/spectral/specfuse-openapi.yaml

      # The overlay's whole job is reaching projects that already exist. Each
      # case below is one the manifest was added to make possible — without it
      # an upgrade can only clobber everything or touch nothing.
      - name: Upgrade overlay behaviour
        run: |
          set -euo pipefail
          CLI=/tmp/ci/bin/specfuse-authoring
          P=/tmp/smoke

          # Idempotent: a current project is a no-op, not a rewrite.
          $CLI upgrade "$P" | tee /tmp/up1.txt
          grep -q "0 file(s) written" /tmp/up1.txt

          # A locally-modified kit file is restored, and the user is told.
          # Note: capture to a file rather than piping into `grep -q`. grep -q
          # exits on first match and closes the pipe, which under `pipefail`
          # surfaces as a SIGPIPE failure of the CLI rather than a passing
          # assertion. (The CLI now handles EPIPE gracefully too.)
          echo "# local edit" >> "$P/.specfuse/authoring/handbooks/API_Handbook.md"
          $CLI upgrade "$P" >/tmp/up2.txt 2>/tmp/up2.err
          grep -q "1 file(s) written" /tmp/up2.txt
          grep -q "overwriting locally-modified" /tmp/up2.err
          ! grep -q "local edit" "$P/.specfuse/authoring/handbooks/API_Handbook.md"

          # --dry-run reports without writing.
          echo "# again" >> "$P/.specfuse/authoring/handbooks/API_Handbook.md"
          $CLI upgrade "$P" --dry-run >/dev/null 2>&1
          grep -q "again" "$P/.specfuse/authoring/handbooks/API_Handbook.md"
          $CLI upgrade "$P" >/dev/null 2>&1

          # A project-authored file inside a kit directory is never deleted.
          echo mine > "$P/.specfuse/authoring/samples/my-notes.md"
          $CLI upgrade "$P" >/dev/null 2>&1
          test -f "$P/.specfuse/authoring/samples/my-notes.md"

          # A project scaffolded by a NEWER kit is refused, not silently rolled back.
          echo "99.0.0" > "$P/.specfuse/authoring/VERSION"
          if $CLI upgrade "$P" >/dev/null 2>/tmp/up3.err; then
            echo "::error::upgrade did not refuse a downgrade"; exit 1
          fi
          grep -q "refusing downgrade" /tmp/up3.err
          grep -q "99.0.0" "$P/.specfuse/authoring/VERSION"   # untouched

          # A pre-overlay project (no VERSION, no manifest) is adopted and
          # receives kit content it never had. This is the case that motivated
          # the overlay: before it, nothing could reach an existing project.
          /tmp/ci/bin/specfuse-authoring init /tmp/legacy \
            --name old-shop --token old --domain cart --yes >/dev/null
          rm -rf /tmp/legacy/.specfuse/authoring/schemas \
                 /tmp/legacy/.specfuse/authoring/.scaffold-manifest \
                 /tmp/legacy/.specfuse/authoring/VERSION
          $CLI upgrade /tmp/legacy | tee /tmp/up4.txt
          grep -q "unversioned -> " /tmp/up4.txt
          test -f /tmp/legacy/.specfuse/authoring/schemas/spectral/specfuse-openapi.yaml
          test -f /tmp/legacy/.specfuse/authoring/VERSION

          # `refresh` still works, and says it is deprecated.
          $CLI refresh /tmp/legacy >/tmp/up5.txt 2>&1
          grep -q "deprecated" /tmp/up5.txt

          # Piping into a reader that exits early (`| head`) closes stdout under
          # the CLI. That must end the pipeline quietly, not print a
          # BrokenPipeError traceback that reads as a crash.
          set +o pipefail
          PIPED="$($CLI upgrade "$P" 2>&1 | head -1)"
          set -o pipefail
          case "$PIPED" in
            *BrokenPipeError*)
              echo "::error::CLI leaked a BrokenPipeError traceback when piped into head" >&2
              exit 1 ;;
          esac

          echo "==> upgrade overlay behaviour verified."

      # Installed once here: several regression steps below shell out to
      # spectral, and the first of them used to carry the install inline —
      # so reordering the steps broke them.
      - name: Install the lint toolchain
        run: |
          npm install -g @redocly/cli @stoplight/spectral-cli >/dev/null 2>&1
          # bundle-async-spec.sh post-processes the bundle with a PyYAML helper.
          python -m pip install --quiet PyYAML

      # The x-entity allow-list is `additionalProperties: false`, so it must
      # track the handbooks exactly: a documented key missing from it fails
      # lint at error severity on every entity that uses it. That has happened
      # twice (#13, #36). This pins the documented surface AND the typo guard
      # that justifies keeping the list closed.
      - name: x-entity allow-list covers the documented keys (regression)
        run: |
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/xentity-keys.txt"
          spectral lint --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/xentity-shape-keys.yaml >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"
          [ $STATUS -ge 2 ] && { echo "::error::Spectral crashed on the x-entity fixture" >&2; exit 1; }

          fail=0
          # A schema using every documented key must lint clean.
          for good in FullyDocumented ShorthandDelete ConcurrencyUnprotected \
                      DeleteReasonPlain DeleteReasonOtherWithText \
                      BareConcurrencyNone UnprotectedNoReason \
                      ConcurrencyOtherWithText ConcurrencyTextNoReason \
                      ConcurrencyDelegated ArchiveVisibilityOperational \
                      UniqueBySingleAndComposite UniqueByEmptyList \
                      DeprecatedSchemaKey; do
            if grep "specfuse-xentity-shape" "$REPORT" | grep -q "$good"; then
              echo "::error::$good uses only documented x-entity keys but was flagged." >&2
              echo "The allow-list has fallen behind the handbooks again." >&2
              fail=1
            fi
          done
          # Each malformed value must still be caught.
          for bad in BadCascadeValue BadChildName BadStorage UnknownSubKey \
                     BadDeleteReason DeleteReasonOtherNoText \
                     DeleteReasonTextWithoutOther DeleteReasonOnSoft \
                     BadDeleteMode BadRetention DeleteUnknownKey \
                     BadConcurrencyMode ConcurrencyUnknownKey TypoKey \
                     RetiredEncryptedProperties \
                     ConcurrencyFreeTextReason ConcurrencyOtherNoText \
                     ConcurrencyTextWithoutOther \
                     DelegatedBareString DelegatedWithoutTo \
                     DelegatedWithReason ToOnOptimistic \
                     ArchiveVisibilityOnHard BadArchiveVisibility \
                     UniqueByNoProperties UniqueByEmptyProperties \
                     UniqueByUnknownMember UniqueByBadPropertyName; do
            if ! grep "specfuse-xentity-shape" "$REPORT" | grep -q "$bad"; then
              echo "::error::specfuse-xentity-shape did not flag $bad." >&2
              fail=1
            fi
          done

          # `concurrency: none` is accepted by the shape guard on purpose — the
          # generator accepts it, and a guard that rejects what generates fine
          # blocks the adoption rather than the bad spec (#47). The nudge toward
          # the justified object form is a separate WARNING, and it is the only
          # thing standing between "deliberately unprotected" and "nobody
          # looked", so it is asserted in both directions here.
          REASON_RULE=specfuse-xentity-concurrency-unprotected-needs-reason
          for unjustified in BareConcurrencyNone UnprotectedNoReason; do
            if ! grep "$REASON_RULE" "$REPORT" | grep -q "$unjustified"; then
              echo "::error::$REASON_RULE did not flag $unjustified." >&2
              fail=1
            fi
          done
          for justified in FullyDocumented ConcurrencyUnprotected; do
            if grep "$REASON_RULE" "$REPORT" | grep -q "$justified"; then
              echo "::error::$REASON_RULE flagged $justified, which declares its concurrency." >&2
              fail=1
            fi
          done

          # `x-entity.schema` is deprecated, not removed: the generator still
          # parses it (EntityDefinition.KNOWN_SUB_KEYS, verified against the
          # pinned jar). So the shape guard accepts it — asserted above — and a
          # separate WARNING carries the migration notice. Both halves matter:
          # without the accept, a deprecated key stops a project linting; without
          # the warning, it goes quiet and nobody migrates before it is removed.
          SCHEMA_RULE=specfuse-xentity-schema-deprecated
          if ! grep "$SCHEMA_RULE" "$REPORT" | grep -q "DeprecatedSchemaKey"; then
            echo "::error::$SCHEMA_RULE did not flag DeprecatedSchemaKey." >&2
            echo "A deprecated key with no warning is an invisible migration." >&2
            fail=1
          fi
          if grep "$SCHEMA_RULE" "$REPORT" | grep -q "FullyDocumented"; then
            echo "::error::$SCHEMA_RULE flagged FullyDocumented, which declares no schema." >&2
            fail=1
          fi

          [ $fail -eq 0 ] || exit 1
          echo "==> x-entity allow-list verified in both directions."

      # The ratchet is a reference implementation, not a supported kit tool —
      # but a ratchet that never fires is indistinguishable from one that works,
      # so it is asserted in both directions like any other gate here. The
      # crash-shaped cases are the ones that matter: a ratchet is uniquely
      # exposed to silence, because zero findings is under every baseline.
      - name: Spectral ratchet (reference implementation, both directions)
        run: |
          # `set +e` first: this step asserts on non-zero exits deliberately, and
          # the default `bash -e` would abort at the first one before the check
          # that reads it. Same opener as the fixture steps above.
          set +e
          set -uo pipefail
          WORK="${RUNNER_TEMP}/ratchet"; mkdir -p "$WORK"
          R=schemas/spectral/specfuse-openapi.yaml
          S=scripts/spectral-ratchet.py

          cat > "$WORK/specs.yaml" <<'YAML'
          openapi: 3.0.3
          info: { title: Ratchet fixture, version: "1.0.0" }
          paths: {}
          components:
            schemas:
              A:
                type: object
                x-entity: { domain: orders, type: aggregate, cascadeDelete: maybe }
                properties: { id: { type: string, format: uuid } }
          YAML
          cat > "$WORK/clean.yaml" <<'YAML'
          openapi: 3.0.3
          info: { title: Clean, version: "1.0.0" }
          paths: {}
          YAML

          fail=0
          echo "--- seeds a baseline"
          python3 "$S" --ruleset "$R" --baseline "$WORK/b.json" "$WORK/specs.yaml" --update \
            || { echo "::error::ratchet could not seed a baseline" >&2; fail=1; }

          echo "--- unchanged tree passes"
          python3 "$S" --ruleset "$R" --baseline "$WORK/b.json" "$WORK/specs.yaml" \
            || { echo "::error::ratchet failed on an unchanged tree" >&2; fail=1; }

          echo "--- a new violation fails"
          cat >> "$WORK/specs.yaml" <<'YAML'
              B:
                type: object
                x-entity: { domain: orders, type: aggregate, cascadeDelete: nope }
                properties: { id: { type: string, format: uuid } }
          YAML
          if python3 "$S" --ruleset "$R" --baseline "$WORK/b.json" "$WORK/specs.yaml"; then
            echo "::error::ratchet passed a regression — it does not ratchet" >&2
            fail=1
          fi

          echo "--- a crashed run is not a clean run"
          python3 "$S" --ruleset "$R" --baseline "$WORK/b.json" /nonexistent.yaml >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::ratchet did not treat a failed Spectral run as fatal" >&2; fail=1; }

          echo "--- a collapse to zero cannot be locked in by --update"
          BEFORE=$(cat "$WORK/b.json")
          python3 "$S" --ruleset "$R" --baseline "$WORK/b.json" "$WORK/clean.yaml" --update >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::ratchet let a suspicious collapse rewrite the baseline" >&2; fail=1; }
          [ "$BEFORE" = "$(cat "$WORK/b.json")" ] \
            || { echo "::error::ratchet modified the baseline while refusing" >&2; fail=1; }

          [ $fail -eq 0 ] || exit 1
          echo "==> ratchet verified: it fires on regressions and refuses to lock in silence."

      # The rename map is the input to two migrations, so a stale entry in it
      # is not a typo — it silently rekeys a baseline onto a rule that can
      # never fire again, and every downstream report stays green about it.
      # Both consumers refuse a stale map; this asserts the shipped one is not.
      - name: Spectral rename map is complete and live
        run: |
          set +e
          set -uo pipefail
          python3 - <<'PY'
          import sys, yaml
          from pathlib import Path
          doc = yaml.safe_load(Path("schemas/spectral/rule-renames.yaml").read_text())
          fail = 0
          seen = {}
          for surface, body in doc["rulesets"].items():
              kit = Path(body["kit"])
              if not kit.exists():
                  print(f"::error::{surface}: kit ruleset {kit} does not exist"); fail = 1; continue
              rules = yaml.safe_load(kit.read_text()).get("rules") or {}
              renames = body.get("renames") or {}
              retained = body.get("retained") or {}
              non_mech = body.get("non_mechanical") or {}

              # A rename target that no longer exists is the stale case.
              for legacy, canonical in renames.items():
                  if canonical not in rules:
                      print(f"::error::{surface}: {legacy} -> {canonical}, which {kit.name} does not define")
                      fail = 1
                  if legacy in seen and seen[legacy] != canonical:
                      print(f"::error::{legacy} maps to two ids: {seen[legacy]} and {canonical}")
                      fail = 1
                  seen[legacy] = canonical

              # `retained` means "no counterpart". An id in both sections is a
              # contradiction, and the two consumers would disagree about it.
              overlap = sorted(set(renames) & set(retained))
              if overlap:
                  print(f"::error::{surface}: {overlap} are both renamed and retained")
                  fail = 1

              # Every non-mechanical entry must also be in `renames` — that is
              # what lets a consumer read one map and still be warned.
              for legacy, entry in non_mech.items():
                  if renames.get(legacy) != entry.get("to"):
                      print(f"::error::{surface}: non_mechanical {legacy} disagrees with renames")
                      fail = 1
                  if not (entry.get("note") or "").strip():
                      print(f"::error::{surface}: non_mechanical {legacy} carries no reason")
                      fail = 1

              # A `retained` entry that names a kit rule it overlays must name a
              # real one, or the guidance points at nothing.
              for legacy, entry in (retained or {}).items():
                  for key in ("overlay_for", "partially_superseded_by"):
                      ref = (entry or {}).get(key)
                      if ref and ref not in rules:
                          print(f"::error::{surface}: {legacy}.{key} -> {ref}, not defined by {kit.name}")
                          fail = 1
              print(f"    {surface}: {len(renames)} renames, {len(non_mech)} non-mechanical, "
                    f"{len(retained)} retained, against {len(rules)} kit rules")
          if not seen:
              print("::error::the rename map declares no renames at all — it cannot be read as complete")
              fail = 1
          sys.exit(fail)
          PY
          [ $? -eq 0 ] || exit 1
          echo "==> rename map verified against the shipped rulesets."

      # --migrate-rule-ids rewrites a committed baseline, which is the one
      # artefact a ratchet cannot recover from. Asserted in both directions for
      # the same reason as the ratchet itself: a migration that quietly does
      # nothing, or quietly empties the file, reads exactly like one that worked.
      - name: Spectral baseline migration (both directions)
        run: |
          set +e
          set -uo pipefail
          WORK="${RUNNER_TEMP}/migrate"; mkdir -p "$WORK"
          R=schemas/spectral/specfuse-openapi.yaml
          S=scripts/spectral-ratchet.py
          fail=0

          echo "--- a legacy id is rekeyed through the shipped map"
          echo '{"rm-delete-204": 4, "rm-x-kiosk-session-shape": 2}' > "$WORK/b.json"
          python3 "$S" --ruleset "$R" --baseline "$WORK/b.json" --migrate-rule-ids >"$WORK/out.txt" 2>&1 \
            || { echo "::error::migration failed on a normal baseline" >&2; cat "$WORK/out.txt"; fail=1; }
          grep -q '"specfuse-delete-204": 4' "$WORK/b.json" \
            || { echo "::error::the renamed rule did not carry its count" >&2; fail=1; }
          grep -q '"rm-x-kiosk-session-shape": 2' "$WORK/b.json" \
            || { echo "::error::a project-specific rule was not kept as-is" >&2; fail=1; }
          grep -q 'no baseline entry' "$WORK/out.txt" \
            || { echo "::error::migration did not report the kit rules with no baseline" >&2; fail=1; }

          echo "--- a non-mechanical rename is flagged, not silently swapped"
          echo '{"rm-auth-scopes-pattern": 3}' > "$WORK/nm.json"
          python3 "$S" --ruleset "$R" --baseline "$WORK/nm.json" --migrate-rule-ids >"$WORK/nm.txt" 2>&1
          grep -q 'NOT a prefix swap' "$WORK/nm.txt" \
            || { echo "::error::a non-mechanical rename migrated without a warning" >&2; fail=1; }
          grep -q '"specfuse-auth-scopes-shape": 3' "$WORK/nm.json" \
            || { echo "::error::the non-mechanical rename did not reach its successor" >&2; fail=1; }

          echo "--- two legacy ids colliding on one successor are refused"
          echo '{"rm-no-embedded-objects": 3, "rm-no-inline-objects": 5}' > "$WORK/col.json"
          BEFORE=$(cat "$WORK/col.json")
          python3 "$S" --ruleset "$R" --baseline "$WORK/col.json" --migrate-rule-ids >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::migration guessed how to merge two counts" >&2; fail=1; }
          [ "$BEFORE" = "$(cat "$WORK/col.json")" ] \
            || { echo "::error::migration wrote the baseline while refusing" >&2; fail=1; }

          echo "--- a migration that would empty the baseline is refused"
          cat > "$WORK/retire-map.yaml" <<'MAP'
          version: 1
          prefix: { legacy: "rm-", canonical: "specfuse-" }
          rulesets:
            openapi:
              kit: schemas/spectral/specfuse-openapi.yaml
              renames: { rm-delete-204: specfuse-delete-204 }
              retired: [rm-gone-one, rm-gone-two]
          MAP
          echo '{"rm-gone-one": 3, "rm-gone-two": 9}' > "$WORK/empty.json"
          BEFORE=$(cat "$WORK/empty.json")
          python3 "$S" --ruleset "$R" --baseline "$WORK/empty.json" \
            --rule-renames "$WORK/retire-map.yaml" --migrate-rule-ids >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::migration emptied the baseline and called it success" >&2; fail=1; }
          [ "$BEFORE" = "$(cat "$WORK/empty.json")" ] \
            || { echo "::error::migration wrote an emptied baseline while refusing" >&2; fail=1; }

          echo "--- a stale map is refused rather than migrated through"
          cat > "$WORK/stale-map.yaml" <<'MAP'
          version: 1
          prefix: { legacy: "rm-", canonical: "specfuse-" }
          rulesets:
            openapi:
              kit: schemas/spectral/specfuse-openapi.yaml
              renames: { rm-delete-204: specfuse-delete-204, rm-ghost: specfuse-ghost }
          MAP
          echo '{"rm-delete-204": 4}' > "$WORK/s.json"
          python3 "$S" --ruleset "$R" --baseline "$WORK/s.json" \
            --rule-renames "$WORK/stale-map.yaml" --migrate-rule-ids >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::migration accepted a map naming a dropped rule" >&2; fail=1; }

          echo "--- an empty baseline is not a starting point"
          echo '{}' > "$WORK/nothing.json"
          python3 "$S" --ruleset "$R" --baseline "$WORK/nothing.json" --migrate-rule-ids >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::migration accepted an empty baseline" >&2; fail=1; }

          [ $fail -eq 0 ] || exit 1
          echo "==> baseline migration verified: it rekeys, it flags, and it refuses."

      # The overlay classifier decides which of a project's rules get DELETED,
      # so "nothing is redundant" has to be earned rather than defaulted to.
      # Its worst failure is the vacuous one — wrong file pair, unreadable
      # ruleset, stale map — because every one of those reports a clean bill of
      # health for a comparison that never happened.
      - name: Spectral overlay classifier (both directions)
        run: |
          set +e
          set -uo pipefail
          WORK="${RUNNER_TEMP}/overlay"; mkdir -p "$WORK"
          K=schemas/spectral/specfuse-openapi.yaml
          D=templates/project-init/scripts/specfuse/spectral-overlay-diff.py
          fail=0

          # A fork of the kit under legacy ids: one exact duplicate, one that
          # has drifted, one that is genuinely the project's.
          cat > "$WORK/fork.yaml" <<'YML'
          extends: spectral:oas
          rules:
            rm-delete-204:
              description: "DELETE must define a 204 response."
              severity: error
              given: $.paths[*].delete.responses
              then: { field: "204", function: truthy }
            rm-no-inline-enums:
              description: "drifted copy — the kit's runs unresolved"
              severity: error
              given: $.components.schemas[*].properties[?(@ && @.enum)]
              then: { function: falsy }
            myproject-roles-enum:
              severity: error
              given: $.paths[*][*]["x-roles"][*]
              then: { function: enumeration, functionOptions: { values: [Admin] } }
          YML
          python3 "$D" --kit-ruleset "$K" --project-ruleset "$WORK/fork.yaml" \
            --json "$WORK/cls.json" >"$WORK/out.txt" 2>&1
          [ $? -eq 1 ] || { echo "::error::classifier did not flag a forked overlay" >&2; cat "$WORK/out.txt"; fail=1; }
          python3 - "$WORK/cls.json" <<'PY' || fail=1
          import json, sys
          c = json.load(open(sys.argv[1]))
          ok = True
          if [r["project"] for r in c["redundant"]] != ["rm-delete-204"]:
              print(f"::error::redundant bucket wrong: {c['redundant']}"); ok = False
          if [r["project"] for r in c["diverged"]] != ["rm-no-inline-enums"]:
              print(f"::error::diverged bucket wrong: {c['diverged']}"); ok = False
          if [r["rule"] for r in c["project_specific"]] != ["myproject-roles-enum"]:
              print(f"::error::project-specific bucket wrong: {c['project_specific']}"); ok = False
          if not c["kit_only_new"]:
              print("::error::classifier found no new kit coverage against a 3-rule fork"); ok = False
          sys.exit(0 if ok else 1)
          PY

          echo "--- a reduced overlay passes"
          cat > "$WORK/reduced.yaml" <<YML
          extends:
            - $(pwd)/schemas/spectral/specfuse-openapi.yaml
          rules:
            myproject-roles-enum:
              severity: error
              given: \$.paths[*][*]["x-roles"][*]
              then: { function: enumeration, functionOptions: { values: [Admin] } }
          YML
          python3 "$D" --kit-ruleset "$K" --project-ruleset "$WORK/reduced.yaml" >/dev/null 2>&1
          [ $? -eq 0 ] || { echo "::error::classifier failed a correctly reduced overlay" >&2; fail=1; }

          echo "--- the wrong pair of files is a crash, not a clean report"
          python3 "$D" --kit-ruleset "$K" \
            --project-ruleset schemas/spectral/specfuse-arazzo.yaml >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::classifier gave a clean report for an unrelated pair" >&2; fail=1; }

          echo "--- a ruleset with no rules is a crash, not a clean report"
          printf 'rules: {}\n' > "$WORK/empty.yaml"
          python3 "$D" --kit-ruleset "$WORK/empty.yaml" --project-ruleset "$WORK/fork.yaml" >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::classifier compared against a ruleset with no rules" >&2; fail=1; }

          echo "--- a stale rename map is a crash, not a clean report"
          cat > "$WORK/stale.yaml" <<'MAP'
          version: 1
          prefix: { legacy: "rm-", canonical: "specfuse-" }
          rulesets:
            openapi:
              kit: schemas/spectral/specfuse-openapi.yaml
              renames: { rm-ghost: specfuse-ghost }
          MAP
          python3 "$D" --kit-ruleset "$K" --project-ruleset "$WORK/fork.yaml" \
            --rule-renames "$WORK/stale.yaml" >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::classifier ran against a stale rename map" >&2; fail=1; }

          [ $fail -eq 0 ] || exit 1
          echo "==> overlay classifier verified: it separates the buckets and refuses to be vacuous."

      # AsyncAPI_Handbook.md §2.3 promises three snapshot guardrails; none
      # existed in any ruleset (#37). The two that compare a snapshot to its
      # source entity stay generator-side — the entity is in the OpenAPI
      # document. What is pinned here is the size rule and the shape/honesty of
      # both overrides: an override that can be malformed, or can name a field
      # the snapshot lacks, silently covers nothing.
      - name: Snapshot guardrails (regression)
        run: |
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/snapshot-guardrails.txt"
          spectral lint --ruleset schemas/spectral/specfuse-asyncapi.yaml \
            schemas/spectral/fixtures/snapshot-guardrails.yaml >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"
          [ $STATUS -ge 2 ] && { echo "::error::Spectral crashed on the snapshot fixture" >&2; exit 1; }

          fail=0
          for bad in BareListAck ShortJustification NonStringJustification StaleAck BadSizeAck WideSnapshot; do
            if ! grep "snapshot-guardrails" "$REPORT" | grep -q "$bad"; then
              echo "::error::specfuse-async-snapshot-guardrails did not flag $bad." >&2
              fail=1
            fi
          done
          # The overrides must actually suppress, or they are decoration.
          for clean in GoodSnapshot WideButAcknowledged; do
            if grep "snapshot-guardrails" "$REPORT" | grep -q "$clean"; then
              echo "::error::$clean is correctly acknowledged but was flagged." >&2
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "==> snapshot guardrails verified in both directions."

      # A bootstrapped project must validate cleanly with the scripts the kit
      # hands it. Until now CI only linted examples/hello-orders/, so defects
      # fixed there could survive in the template it came from — and did: every
      # new project started with 4 Spectral errors and an invalid AsyncAPI root
      # `tags` key, because nothing ever linted the scaffold.
      - name: Script ownership boundary — scripts/ is the project's, scripts/specfuse/ is ours
        run: |
          set -euo pipefail
          CLI=/tmp/ci/bin/specfuse-authoring
          P=/tmp/smoke

          # Kit tooling lives in its own subdirectory, and nothing the kit ships
          # lands loose in scripts/.
          test -d "$P/scripts/specfuse"
          test -x "$P/scripts/specfuse/validate-specs.sh"
          loose=$(find "$P/scripts" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$loose" != "0" ]]; then
            echo "::error::The kit shipped $loose file(s) directly into scripts/." >&2
            find "$P/scripts" -maxdepth 1 -type f >&2
            exit 1
          fi

          # The manifest must never claim a path outside scripts/specfuse/,
          # because the manifest is what authorises deletion.
          if python3 - "$P" <<'PY'; then :; else exit 1; fi
          import json, pathlib, sys
          m = json.loads((pathlib.Path(sys.argv[1]) / ".specfuse/authoring/.scaffold-manifest").read_text())
          bad = [k for k in m if k.startswith("scripts/") and not k.startswith("scripts/specfuse/")]
          if bad:
              print(f"::error::manifest claims paths outside scripts/specfuse/: {bad}")
              sys.exit(1)
          PY

          # THE POINT OF THE MOVE: a project file whose name collides with a kit
          # script must survive an upgrade untouched. Under the old flat layout
          # this file was overwritten, with only a stderr warning to say so.
          printf 'echo mine\n' > "$P/scripts/validate-specs.sh"
          printf 'print("substrate")\n' > "$P/scripts/validate-event.py"
          mkdir -p "$P/scripts/ci" && printf 'echo ci\n' > "$P/scripts/ci/deploy.sh"

          $CLI upgrade "$P" >/tmp/own.txt 2>/tmp/own.err || true
          cat /tmp/own.txt

          for f in scripts/validate-specs.sh scripts/validate-event.py scripts/ci/deploy.sh; do
            if [[ ! -f "$P/$f" ]]; then
              echo "::error::upgrade deleted $f, which the kit does not own." >&2
              exit 1
            fi
          done
          grep -q "echo mine" "$P/scripts/validate-specs.sh" || {
            echo "::error::upgrade overwrote a project file that merely shares a name" >&2
            echo "with a kit script. The subdirectory boundary is not holding." >&2
            exit 1
          }
          if grep -q "WARNING" /tmp/own.err; then
            echo "::error::upgrade warned about project-owned files it should not have looked at:" >&2
            cat /tmp/own.err >&2
            exit 1
          fi
          echo "==> Script ownership boundary holds in both directions."

      - name: Scaffolded project validates with its own scripts
        run: |
          set -euo pipefail
          /tmp/ci/bin/specfuse-authoring init /tmp/scripted \
            --name beta-shop --token beta --domain cart --yes >/dev/null
          cd /tmp/scripted

          test -x scripts/specfuse/validate-spectral.sh
          test -f scripts/specfuse/README.md

          # `pip install` byte-compiles the Python helper the kit ships under
          # templates/, so site-packages carries a __pycache__/ the wheel never
          # did. Only an installed-wheel run catches this; a source-tree run
          # cannot.
          if find . \( -name '__pycache__' -o -name '*.pyc' \) | grep -q .; then
            echo "::error::build residue was delivered into the scaffolded project" >&2
            find . \( -name '__pycache__' -o -name '*.pyc' \) >&2
            exit 1
          fi

          # The vocabulary drift guard, in both directions, against a synthetic
          # jar. The real generator is a private release asset CI cannot pull,
          # but the check only reads `x-<ext>.<key>` string literals out of
          # class files — so a zip carrying those literals exercises the whole
          # comparison, and this runs on every PR instead of only where a token
          # exists. The failing direction is the one that blocks spec authors:
          # the generator knows a key the closed ruleset rejects.
          python3 - <<'PY'
          import pathlib, zipfile
          out = pathlib.Path("/tmp/fakejars"); out.mkdir(exist_ok=True)
          def jar(name, literals):
              # A real constant pool: magic, version, count, then UTF8 entries
              # (tag 1, u2 length, bytes). The check parses the pool, so the
              # fixture has to be a pool — a bag of concatenated strings would
              # test a reader this deliberately is not.
              body = b"\xca\xfe\xba\xbe\x00\x00\x00\x34"
              body += (len(literals) + 1).to_bytes(2, "big")
              for s in literals:
                  b = s.encode()
                  body += b"\x01" + len(b).to_bytes(2, "big") + b
              p = out / name
              with zipfile.ZipFile(p, "w") as z:
                  z.writestr("com/specfuse/Gen.class", body)
              return p
          # Every x-entity key the kit's guard declares -> clean.
          jar("specfuse-generator-9.0.0.jar", ["x-entity.domain", "x-entity.type"])
          # A key no guard accepts -> must fail.
          jar("specfuse-generator-9.0.1.jar", ["x-entity.domain", "x-entity.warpFactor"])
          PY

          echo "--- vocabulary check: generator in sync"
          SPECFUSE_GENERATOR_JAR=/tmp/fakejars/specfuse-generator-9.0.0.jar \
            python3 scripts/specfuse/check-extension-vocabulary.py --require-jar

          echo "--- vocabulary check: generator ahead of the ruleset"
          if SPECFUSE_GENERATOR_JAR=/tmp/fakejars/specfuse-generator-9.0.1.jar \
               python3 scripts/specfuse/check-extension-vocabulary.py --require-jar >/tmp/drift.out 2>&1; then
            echo "::error::vocabulary drift guard passed a key no closed guard accepts" >&2
            cat /tmp/drift.out >&2
            exit 1
          fi
          grep -q "warpFactor" /tmp/drift.out

          # The synthetic jars above cannot answer `extensions --format json`,
          # so they exercise only the constant-pool fallback — and the two
          # things that path cannot see are exactly what generator 0.8.0 added:
          # a MEMBER key (`delete.archiveVisibility`) and a new VALUE in an
          # existing closed set (`concurrency: delegated`). Both walked past the
          # guard once. These assertions drive the published-document readers
          # directly so they cannot walk past it again.
          echo "--- vocabulary check: member keys and closed value sets"
          python3 - <<'PY'
          import importlib.util, itertools, pathlib
          spec = importlib.util.spec_from_file_location(
              "vocab", "scripts/specfuse/check-extension-vocabulary.py")
          v = importlib.util.module_from_spec(spec); spec.loader.exec_module(v)

          doc = {"x-entity": [
              {"key": "concurrency", "values": ["optimistic", "none", "delegated"]},
              {"key": "delete", "values": ["hard", "soft"],
               "members": [{"key": "archiveVisibility",
                            "values": ["operational", "restricted"]}]},
          ]}
          keys = v.published_vocabulary(doc)["x-entity"]
          assert "archiveVisibility" in keys, "member keys must reach the key comparison"
          values = v.published_values(doc)["x-entity"]
          assert values[("delete", "archiveVisibility")] == {"operational", "restricted"}, values

          # A guard whose enum has fallen behind must read as rejecting the value.
          stale = {"additionalProperties": False,
                   "properties": {"concurrency": {"enum": ["optimistic", "none"]}}}
          accepted = v._accepted_values(v._descend([stale], "concurrency"))
          assert accepted == {"optimistic", "none"}, accepted
          assert "delegated" not in accepted

          # And the shipped ruleset must actually accept everything the jar publishes.
          delivered = sorted(itertools.chain.from_iterable(
              v.ROOT.glob(pattern) for pattern in v.RULESET_GLOBS))
          assert delivered, "no ruleset was delivered into the scaffolded project"
          guards = [g for g in v.closed_guards(delivered) if g["surface"] == "x-entity"]
          assert guards, "no x-entity guard found in the delivered ruleset"
          for g in guards:
              live = v._accepted_values(v._descend([g["schema"]], "concurrency"))
              assert live and {"optimistic", "none", "delegated"} <= live, live
              av = v._accepted_values(
                  v._descend(v._descend([g["schema"]], "delete"), "archiveVisibility"))
              assert av == {"operational", "restricted"}, av
          print("ok")
          PY

          echo "--- vocabulary check: missing jar is a loud skip, fatal only with --require-jar"
          SPECFUSE_HOME=/tmp/no-such-home python3 scripts/specfuse/check-extension-vocabulary.py
          if SPECFUSE_HOME=/tmp/no-such-home \
               python3 scripts/specfuse/check-extension-vocabulary.py --require-jar; then
            echo "::error::--require-jar must fail when nothing was verified" >&2
            exit 1
          fi

          # Servers and the generator-driven docs build need external tooling or
          # block by design; everything else must exit 0 on a fresh project.
          for s in validate-structure validate-redocly validate-spectral \
                   validate-async-structure validate-async-spectral \
                   validate-arazzo validate-arazzo-spectral \
                   bundle-spec bundle-async-spec build-prompt-index; do
            echo "--- $s"
            ./scripts/specfuse/$s.sh
          done

          # The Spectral validators must be linting against the kit rulesets
          # delivered by the overlay, not a stale project-local copy.
          grep -q ".specfuse/authoring/schemas/spectral/" scripts/specfuse/validate-spectral.sh

          # Every script a shipped script calls must itself be shipped.
          # validate-specs.sh composes nine layers; running them individually
          # (as the 0.5.6 verification did) proves each works but not that the
          # aggregate resolves. validate-generator.sh was missing for exactly
          # that reason, so the entry-point validator died on its last step.
          missing=0
          for dep in $(grep -rhoE '\$(SCRIPT_DIR|ROOT_DIR)?/?[A-Za-z0-9_-]+\.(sh|py)|\./scripts/specfuse/[A-Za-z0-9_-]+\.(sh|py)' scripts/specfuse/*.sh \
                       | sed 's|.*/||' | sort -u); do
            if [ ! -f "scripts/specfuse/$dep" ]; then
              echo "::error::scripts/specfuse/ references $dep, which is not shipped" >&2
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

          # No anonymous `type: object` placeholders in the scaffolded specs.
          #
          # The generator refuses them (ANONYMOUS_OBJECT_PLACEHOLDER) because an
          # untyped inline object cannot be modelled into a DTO. That check runs
          # in validate-generator.sh, which needs the private jar — so CI cannot
          # reach it, and a scaffolded project shipped for some time failing its
          # own validate-specs.sh on `Error.details` and
          # `PreconditionFailedBody.currentResource`. This is the jar-free half
          # of that guard: it is a pure shape check over the YAML, so it holds
          # in a runner with no generator access.
          #
          # Both fields are genuine open maps and now say so with
          # `additionalProperties`. Adding a third is fine — declare it the same
          # way rather than leaving the object anonymous.
          python3 - <<'ANON'
          import pathlib, sys, yaml

          def walk(node, path, hits):
              if isinstance(node, dict):
                  if (node.get("type") == "object" and "properties" not in node
                          and "additionalProperties" not in node and "$ref" not in node
                          and "allOf" not in node and "oneOf" not in node):
                      hits.append(path)
                  for k, v in node.items():
                      walk(v, f"{path}.{k}", hits)
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, f"{path}[{i}]", hits)

          bad = []
          for p in sorted(pathlib.Path("/tmp/smoke/api").rglob("*.yaml")):
              try:
                  docs = list(yaml.safe_load_all(p.read_text()))
              except Exception:
                  continue
              for d in docs:
                  h = []
                  walk(d, "", h)
                  bad += [f"{p}:{x}" for x in h]

          if bad:
              print("::error::anonymous `type: object` placeholder(s) in the scaffolded specs —")
              print("::error::the generator cannot model them (ANONYMOUS_OBJECT_PLACEHOLDER).")
              for b in bad:
                  print(f"  {b}")
              sys.exit(1)
          print("==> No anonymous type: object placeholders in the scaffolded specs.")
          ANON

          # The OpenAPI-generator layer must select spec files by content, not
          # by extension: the documented layout puts asyncapi.yaml beside
          # openapi.yaml, so a *.yaml glob feeds an AsyncAPI document to
          # openapi-generator and the layer can never pass. Asserted here
          # rather than by running the layer, which needs the generator CLI.
          grep -qF '"?openapi"?' scripts/specfuse/validate-openapi-generator.sh \
            || { echo "::error::validate-openapi-generator.sh no longer selects specs by content" >&2; exit 1; }
          if grep -qE 'find .*-maxdepth 1 -name "\*\.yaml" -o' scripts/specfuse/validate-openapi-generator.sh; then
            echo "::error::validate-openapi-generator.sh globs by extension again — it will pick up asyncapi.yaml" >&2
            exit 1
          fi

          echo "==> scaffolded project validates with the shipped scripts."

      - name: Versions agree (pyproject == __version__ == generator.lock)
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('specfuse/authoring/__init__.py').read()).group(1))")
          KIT=$(python -c "import json;print(json.load(open('generator.lock'))['kit_version'])")
          echo "pyproject=$PKG __version__=$INIT generator.lock=$KIT"
          test "$PKG" = "$INIT" && test "$PKG" = "$KIT" || { echo "::error::version sources disagree"; exit 1; }
