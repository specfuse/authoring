#
# Always-run gate. Unlike build-wheel.yml / example-regen.yml (which are
# path-filtered), this runs on EVERY push to main and EVERY pull request, so it
# is safe to mark as a required status check on `main` (a PR can never leave it
# "pending" for lack of a matching path). Keep it fast: build the wheel and
# prove a clean install bootstraps a project and the versions agree.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Clean-install and bootstrap from the built wheel
        run: |
          python -m venv /tmp/ci
          /tmp/ci/bin/pip install --quiet "$(ls dist/*.whl)"
          /tmp/ci/bin/python -c "import specfuse.authoring as a; print('import OK', a.__version__)"
          # The umbrella dispatches `specfuse authoring …` into this exact
          # dotted path (specfuse.authoring.cli:_run). Renaming the module or
          # the function turns the subcommand into a run-time ImportError that
          # only surfaces after this package is on PyPI, so assert it here.
          /tmp/ci/bin/python -c "from specfuse.authoring.cli import _run; assert callable(_run)"
          # Usage must read as the suite subcommand for every invocation except
          # the deprecated flat script, which keeps printing the name typed.
          /tmp/ci/bin/python -m specfuse.authoring.cli --help >/tmp/help.txt
          grep -q '^usage: specfuse authoring' /tmp/help.txt
          # The flat script stays until the coordinated 1.0.0 removal; CI
          # installs this package alone, so it is also what CI drives below.
          /tmp/ci/bin/specfuse-authoring --version
          /tmp/ci/bin/specfuse-authoring init /tmp/smoke \
            --name beta-shop --token beta --domain cart --yes
          test -f /tmp/smoke/.specfuse/authoring/handbooks/API_Handbook.md
          test -d /tmp/smoke/api/specs/v1/domains/cart
          /tmp/ci/bin/python -c "import json; s=json.load(open('/tmp/smoke/.claude/settings.json')); assert s['enabledPlugins']['specfuse-authoring@specfuse'] is True; assert s['extraKnownMarketplaces']['specfuse']['source']['repo']=='specfuse/specfuse'"
          ! find /tmp/smoke -name '*.template' | grep -q .
          test -f /tmp/smoke/.specfuse/authoring/VERSION
          test -f /tmp/smoke/.specfuse/authoring/.scaffold-manifest
          test -f /tmp/smoke/.specfuse/authoring/schemas/spectral/specfuse-openapi.yaml

      # The overlay's whole job is reaching projects that already exist. Each
      # case below is one the manifest was added to make possible — without it
      # an upgrade can only clobber everything or touch nothing.
      - name: Upgrade overlay behaviour
        run: |
          set -euo pipefail
          CLI=/tmp/ci/bin/specfuse-authoring
          P=/tmp/smoke

          # Idempotent: a current project is a no-op, not a rewrite.
          $CLI upgrade "$P" | tee /tmp/up1.txt
          grep -q "0 file(s) written" /tmp/up1.txt

          # A locally-modified kit file is restored, and the user is told.
          # Note: capture to a file rather than piping into `grep -q`. grep -q
          # exits on first match and closes the pipe, which under `pipefail`
          # surfaces as a SIGPIPE failure of the CLI rather than a passing
          # assertion. (The CLI now handles EPIPE gracefully too.)
          echo "# local edit" >> "$P/.specfuse/authoring/handbooks/API_Handbook.md"
          $CLI upgrade "$P" >/tmp/up2.txt 2>/tmp/up2.err
          grep -q "1 file(s) written" /tmp/up2.txt
          grep -q "overwriting locally-modified" /tmp/up2.err
          ! grep -q "local edit" "$P/.specfuse/authoring/handbooks/API_Handbook.md"

          # --dry-run reports without writing.
          echo "# again" >> "$P/.specfuse/authoring/handbooks/API_Handbook.md"
          $CLI upgrade "$P" --dry-run >/dev/null 2>&1
          grep -q "again" "$P/.specfuse/authoring/handbooks/API_Handbook.md"
          $CLI upgrade "$P" >/dev/null 2>&1

          # A project-authored file inside a kit directory is never deleted.
          echo mine > "$P/.specfuse/authoring/samples/my-notes.md"
          $CLI upgrade "$P" >/dev/null 2>&1
          test -f "$P/.specfuse/authoring/samples/my-notes.md"

          # A project scaffolded by a NEWER kit is refused, not silently rolled back.
          echo "99.0.0" > "$P/.specfuse/authoring/VERSION"
          if $CLI upgrade "$P" >/dev/null 2>/tmp/up3.err; then
            echo "::error::upgrade did not refuse a downgrade"; exit 1
          fi
          grep -q "refusing downgrade" /tmp/up3.err
          grep -q "99.0.0" "$P/.specfuse/authoring/VERSION"   # untouched

          # A pre-overlay project (no VERSION, no manifest) is adopted and
          # receives kit content it never had. This is the case that motivated
          # the overlay: before it, nothing could reach an existing project.
          /tmp/ci/bin/specfuse-authoring init /tmp/legacy \
            --name old-shop --token old --domain cart --yes >/dev/null
          rm -rf /tmp/legacy/.specfuse/authoring/schemas \
                 /tmp/legacy/.specfuse/authoring/.scaffold-manifest \
                 /tmp/legacy/.specfuse/authoring/VERSION
          $CLI upgrade /tmp/legacy | tee /tmp/up4.txt
          grep -q "unversioned -> " /tmp/up4.txt
          test -f /tmp/legacy/.specfuse/authoring/schemas/spectral/specfuse-openapi.yaml
          test -f /tmp/legacy/.specfuse/authoring/VERSION

          # `refresh` still works, and says it is deprecated.
          $CLI refresh /tmp/legacy >/tmp/up5.txt 2>&1
          grep -q "deprecated" /tmp/up5.txt

          # Piping into a reader that exits early (`| head`) closes stdout under
          # the CLI. That must end the pipeline quietly, not print a
          # BrokenPipeError traceback that reads as a crash.
          set +o pipefail
          PIPED="$($CLI upgrade "$P" 2>&1 | head -1)"
          set -o pipefail
          case "$PIPED" in
            *BrokenPipeError*)
              echo "::error::CLI leaked a BrokenPipeError traceback when piped into head" >&2
              exit 1 ;;
          esac

          echo "==> upgrade overlay behaviour verified."

      # Installed once here: several regression steps below shell out to
      # spectral, and the first of them used to carry the install inline —
      # so reordering the steps broke them.
      - name: Install the lint toolchain
        run: |
          npm install -g @redocly/cli @stoplight/spectral-cli >/dev/null 2>&1
          # bundle-async-spec.sh post-processes the bundle with a PyYAML helper.
          python -m pip install --quiet PyYAML

      # The x-entity allow-list is `additionalProperties: false`, so it must
      # track the handbooks exactly: a documented key missing from it fails
      # lint at error severity on every entity that uses it. That has happened
      # twice (#13, #36). This pins the documented surface AND the typo guard
      # that justifies keeping the list closed.
      - name: x-entity allow-list covers the documented keys (regression)
        run: |
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/xentity-keys.txt"
          spectral lint --ruleset schemas/spectral/specfuse-openapi.yaml \
            schemas/spectral/fixtures/xentity-shape-keys.yaml >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"
          [ $STATUS -ge 2 ] && { echo "::error::Spectral crashed on the x-entity fixture" >&2; exit 1; }

          fail=0
          # A schema using every documented key must lint clean.
          for good in FullyDocumented ShorthandDelete ConcurrencyUnprotected \
                      BareConcurrencyNone UnprotectedNoReason \
                      ConcurrencyOtherWithText ConcurrencyTextNoReason; do
            if grep "specfuse-xentity-shape" "$REPORT" | grep -q "$good"; then
              echo "::error::$good uses only documented x-entity keys but was flagged." >&2
              echo "The allow-list has fallen behind the handbooks again." >&2
              fail=1
            fi
          done
          # Each malformed value must still be caught.
          for bad in BadCascadeValue BadChildName BadStorage UnknownSubKey \
                     BadDeleteMode BadRetention DeleteUnknownKey \
                     BadConcurrencyMode ConcurrencyUnknownKey TypoKey \
                     ConcurrencyFreeTextReason ConcurrencyOtherNoText \
                     ConcurrencyTextWithoutOther; do
            if ! grep "specfuse-xentity-shape" "$REPORT" | grep -q "$bad"; then
              echo "::error::specfuse-xentity-shape did not flag $bad." >&2
              fail=1
            fi
          done

          # `concurrency: none` is accepted by the shape guard on purpose — the
          # generator accepts it, and a guard that rejects what generates fine
          # blocks the adoption rather than the bad spec (#47). The nudge toward
          # the justified object form is a separate WARNING, and it is the only
          # thing standing between "deliberately unprotected" and "nobody
          # looked", so it is asserted in both directions here.
          REASON_RULE=specfuse-xentity-concurrency-unprotected-needs-reason
          for unjustified in BareConcurrencyNone UnprotectedNoReason; do
            if ! grep "$REASON_RULE" "$REPORT" | grep -q "$unjustified"; then
              echo "::error::$REASON_RULE did not flag $unjustified." >&2
              fail=1
            fi
          done
          for justified in FullyDocumented ConcurrencyUnprotected; do
            if grep "$REASON_RULE" "$REPORT" | grep -q "$justified"; then
              echo "::error::$REASON_RULE flagged $justified, which declares its concurrency." >&2
              fail=1
            fi
          done

          [ $fail -eq 0 ] || exit 1
          echo "==> x-entity allow-list verified in both directions."

      # AsyncAPI_Handbook.md §2.3 promises three snapshot guardrails; none
      # existed in any ruleset (#37). The two that compare a snapshot to its
      # source entity stay generator-side — the entity is in the OpenAPI
      # document. What is pinned here is the size rule and the shape/honesty of
      # both overrides: an override that can be malformed, or can name a field
      # the snapshot lacks, silently covers nothing.
      - name: Snapshot guardrails (regression)
        run: |
          set +e
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/snapshot-guardrails.txt"
          spectral lint --ruleset schemas/spectral/specfuse-asyncapi.yaml \
            schemas/spectral/fixtures/snapshot-guardrails.yaml >"$REPORT" 2>&1
          STATUS=$?
          cat "$REPORT"
          [ $STATUS -ge 2 ] && { echo "::error::Spectral crashed on the snapshot fixture" >&2; exit 1; }

          fail=0
          for bad in BareListAck ShortJustification NonStringJustification StaleAck BadSizeAck WideSnapshot; do
            if ! grep "snapshot-guardrails" "$REPORT" | grep -q "$bad"; then
              echo "::error::specfuse-async-snapshot-guardrails did not flag $bad." >&2
              fail=1
            fi
          done
          # The overrides must actually suppress, or they are decoration.
          for clean in GoodSnapshot WideButAcknowledged; do
            if grep "snapshot-guardrails" "$REPORT" | grep -q "$clean"; then
              echo "::error::$clean is correctly acknowledged but was flagged." >&2
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "==> snapshot guardrails verified in both directions."

      # A bootstrapped project must validate cleanly with the scripts the kit
      # hands it. Until now CI only linted examples/hello-orders/, so defects
      # fixed there could survive in the template it came from — and did: every
      # new project started with 4 Spectral errors and an invalid AsyncAPI root
      # `tags` key, because nothing ever linted the scaffold.
      - name: Scaffolded project validates with its own scripts
        run: |
          set -euo pipefail
          /tmp/ci/bin/specfuse-authoring init /tmp/scripted \
            --name beta-shop --token beta --domain cart --yes >/dev/null
          cd /tmp/scripted

          test -x scripts/validate-spectral.sh
          test -f scripts/README.md

          # `pip install` byte-compiles the Python helper the kit ships under
          # templates/, so site-packages carries a __pycache__/ the wheel never
          # did. Only an installed-wheel run catches this; a source-tree run
          # cannot.
          if find . \( -name '__pycache__' -o -name '*.pyc' \) | grep -q .; then
            echo "::error::build residue was delivered into the scaffolded project" >&2
            find . \( -name '__pycache__' -o -name '*.pyc' \) >&2
            exit 1
          fi

          # The vocabulary drift guard, in both directions, against a synthetic
          # jar. The real generator is a private release asset CI cannot pull,
          # but the check only reads `x-<ext>.<key>` string literals out of
          # class files — so a zip carrying those literals exercises the whole
          # comparison, and this runs on every PR instead of only where a token
          # exists. The failing direction is the one that blocks spec authors:
          # the generator knows a key the closed ruleset rejects.
          python3 - <<'PY'
          import pathlib, zipfile
          out = pathlib.Path("/tmp/fakejars"); out.mkdir(exist_ok=True)
          def jar(name, literals):
              # A real constant pool: magic, version, count, then UTF8 entries
              # (tag 1, u2 length, bytes). The check parses the pool, so the
              # fixture has to be a pool — a bag of concatenated strings would
              # test a reader this deliberately is not.
              body = b"\xca\xfe\xba\xbe\x00\x00\x00\x34"
              body += (len(literals) + 1).to_bytes(2, "big")
              for s in literals:
                  b = s.encode()
                  body += b"\x01" + len(b).to_bytes(2, "big") + b
              p = out / name
              with zipfile.ZipFile(p, "w") as z:
                  z.writestr("com/specfuse/Gen.class", body)
              return p
          # Every x-entity key the kit's guard declares -> clean.
          jar("specfuse-generator-9.0.0.jar", ["x-entity.domain", "x-entity.type"])
          # A key no guard accepts -> must fail.
          jar("specfuse-generator-9.0.1.jar", ["x-entity.domain", "x-entity.warpFactor"])
          PY

          echo "--- vocabulary check: generator in sync"
          SPECFUSE_GENERATOR_JAR=/tmp/fakejars/specfuse-generator-9.0.0.jar \
            python3 scripts/check-extension-vocabulary.py --require-jar

          echo "--- vocabulary check: generator ahead of the ruleset"
          if SPECFUSE_GENERATOR_JAR=/tmp/fakejars/specfuse-generator-9.0.1.jar \
               python3 scripts/check-extension-vocabulary.py --require-jar >/tmp/drift.out 2>&1; then
            echo "::error::vocabulary drift guard passed a key no closed guard accepts" >&2
            cat /tmp/drift.out >&2
            exit 1
          fi
          grep -q "warpFactor" /tmp/drift.out

          echo "--- vocabulary check: missing jar is a loud skip, fatal only with --require-jar"
          SPECFUSE_HOME=/tmp/no-such-home python3 scripts/check-extension-vocabulary.py
          if SPECFUSE_HOME=/tmp/no-such-home \
               python3 scripts/check-extension-vocabulary.py --require-jar; then
            echo "::error::--require-jar must fail when nothing was verified" >&2
            exit 1
          fi

          # Servers and the generator-driven docs build need external tooling or
          # block by design; everything else must exit 0 on a fresh project.
          for s in validate-structure validate-redocly validate-spectral \
                   validate-async-structure validate-async-spectral \
                   validate-arazzo validate-arazzo-spectral \
                   bundle-spec bundle-async-spec build-prompt-index; do
            echo "--- $s"
            ./scripts/$s.sh
          done

          # The Spectral validators must be linting against the kit rulesets
          # delivered by the overlay, not a stale project-local copy.
          grep -q ".specfuse/authoring/schemas/spectral/" scripts/validate-spectral.sh

          # Every script a shipped script calls must itself be shipped.
          # validate-specs.sh composes nine layers; running them individually
          # (as the 0.5.6 verification did) proves each works but not that the
          # aggregate resolves. validate-generator.sh was missing for exactly
          # that reason, so the entry-point validator died on its last step.
          missing=0
          for dep in $(grep -rhoE '\$(SCRIPT_DIR|ROOT_DIR)?/?[A-Za-z0-9_-]+\.(sh|py)|\./scripts/[A-Za-z0-9_-]+\.(sh|py)' scripts/*.sh \
                       | sed 's|.*/||' | sort -u); do
            if [ ! -f "scripts/$dep" ]; then
              echo "::error::scripts/ references $dep, which is not shipped" >&2
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

          # The OpenAPI-generator layer must select spec files by content, not
          # by extension: the documented layout puts asyncapi.yaml beside
          # openapi.yaml, so a *.yaml glob feeds an AsyncAPI document to
          # openapi-generator and the layer can never pass. Asserted here
          # rather than by running the layer, which needs the generator CLI.
          grep -qF '"?openapi"?' scripts/validate-openapi-generator.sh \
            || { echo "::error::validate-openapi-generator.sh no longer selects specs by content" >&2; exit 1; }
          if grep -qE 'find .*-maxdepth 1 -name "\*\.yaml" -o' scripts/validate-openapi-generator.sh; then
            echo "::error::validate-openapi-generator.sh globs by extension again — it will pick up asyncapi.yaml" >&2
            exit 1
          fi

          echo "==> scaffolded project validates with the shipped scripts."

      - name: Versions agree (pyproject == __version__ == generator.lock)
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('specfuse/authoring/__init__.py').read()).group(1))")
          KIT=$(python -c "import json;print(json.load(open('generator.lock'))['kit_version'])")
          echo "pyproject=$PKG __version__=$INIT generator.lock=$KIT"
          test "$PKG" = "$INIT" && test "$PKG" = "$KIT" || { echo "::error::version sources disagree"; exit 1; }
