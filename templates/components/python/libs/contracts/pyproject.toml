# Seeded once by `specfuse authoring add-component` for generator {{GeneratorVersion}}. Yours to change.
[project]
name = "{{ContractsDist}}"
version = "0.1.0"
description = "Generated contracts for {{ProjectName}}: SQLAlchemy models, enums, value objects, events and snapshots."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
