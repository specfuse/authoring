# Vendor-extension vocabulary exceptions.
#
# Read by scripts/specfuse/check-extension-vocabulary.py. Two sections, making opposite
# claims — keep them apart, because conflating them hides real drift:
#
#   out_of_surface  The generator knows this key, but under a different
#                   extension than the guard that rejects it. Not drift; the
#                   generator namespaces a key by the extension it belongs to
#                   rather than by where an author writes it.
#
#   kit_only        Nothing in codegen reads this key, and that is intended.
#                   The kit's own tooling does. Without this section the guard
#                   reports it as drift on every run, and a report that always
#                   fires is a report nobody reads.
#
# A key belongs here only with a reason someone can check later. "It was noisy"
# is not a reason.

out_of_surface: {}

kit_only:
  x-entity:
    - key: mutability
      reason: >-
        Read by the kit's own Spectral rules, not by codegen.
        `specfuse-main-resource-has-updatedAt` tells an author to declare
        `mutability: immutable` or `appendOnly` instead of adding the field,
        and `specfuse-xentity-mutability-exemption` keys its exemption off the
        same value (fixture: mutability-exemption.yaml). The generator's
        ENTITY_SHAPE_UNKNOWN_PROPERTY warning is correct that codegen drops it
        and misleading about the key's purpose: removing it from the ruleset
        would cost a working lint rule and change nothing about generated
        output. Revisit if the generator gains a write-policy concept.
  # The six informational x-ai keys. AsyncAPI_Handbook §4.3 documents them as
  # informational and read by nothing, and `extensions --format json` (from
  # generator 0.16.0) deliberately leaves them out, so the drift report would
  # flag each one. `specfuse-async-ai-shape` accepts them so a misspelt
  # parser key is caught without failing the keys the handbook teaches.
  x-ai:
    - key: model
      reason: Informational; documented in AsyncAPI_Handbook §4.3, ignored by the parser.
    - key: promptTemplate
      reason: Informational; documented in AsyncAPI_Handbook §4.3, ignored by the parser.
    - key: capabilities
      reason: Informational; documented in AsyncAPI_Handbook §4.3, ignored by the parser.
    - key: estimatedTokens
      reason: Informational; documented in AsyncAPI_Handbook §4.3, ignored by the parser.
    - key: maxLatency
      reason: Informational; documented in AsyncAPI_Handbook §4.3, ignored by the parser.
    - key: fallback
      reason: >-
        Ignored by the parser, but its value set is checked by the kit's
        `specfuse-async-ai-fallback-values`; documented in AsyncAPI_Handbook §4.3.
