# gen-contract.yml — the machine-checkable half of this repo's generated-code bar.
#
# Seeded from the Specfuse authoring kit (templates/component-contract/csharp/)
# and owned by this repo from then on: the rules are yours, the engine is
# `specfuse.loop.gen_contract` (specfuse-loop 0.30+). Every rule below is an
# assertion with a rule ID, a `file:line` verdict and a `why` that says what
# breaks when it is violated, so an agent can act on a finding without a
# conversation and two runs over the same tree always agree.
#
#   ./scripts/check-gen-contract.sh                 # every rule
#   ./scripts/check-gen-contract.sh --list          # what is enforced
#   ./scripts/check-gen-contract.sh --explain GEN-004
#   ./scripts/check-gen-contract.sh --json out.json
#   ./scripts/test-gen-contract.sh                  # mutation test: prove the rules bite
#
# Rule ID blocks:
#   GEN-00x  markers and file layout
#   GEN-01x  layer dependencies (generated code, and the project references)
#   GEN-02x  host wiring (the files the generator never writes)
#   GEN-03x  hand-written code holds up its end
#   GEN-04x  generated extension points are adopted
#
# Adding a rule: it must be green on the default branch the day it lands. If
# the tree already violates it, ship it with a `waived_until:` block (dated,
# with the event that ends it) or as a `ratchet`, never red. Give it a
# mutation case in scripts/test-gen-contract.sh in the same change.
#
# `__Prefix__` is the solution's root namespace (the `basePackage` of the
# C# groups minus the layer suffix): HelloOrders for HelloOrders.Domain,
# HelloOrders.Infrastructure, HelloOrders.Api. Replace it once when seeding.
#
# The engine reads this file with the loop's own strict YAML subset: block
# style only, no anchors, no flow mappings. Prose goes in folded scalars (>),
# regexes in single quotes.
#
# The filesets below assume project folders at the repo root named
# __Prefix__.Domain, __Prefix__.Infrastructure and __Prefix__.Api, and test
# projects ending in `.Test` or `Tests`. A different layout edits `filesets:`
# once when seeding; a scope that matches nothing is an error, not a pass.

version: 1
builtins: scripts/gen_contract_checks.py

filesets:
  gen_src:
    include:
      - "*/gen-src/**/*.cs"
  # Everything under gen-src/ that is NOT C#. Disjoint from `gen_src`, so
  # GEN-001 and GEN-005 never both fire on the same file. A group that emits a
  # non-C# file into gen-src/ by design (a worker manifest, for instance)
  # names it in `exclude` here with a comment saying which artifact writes it.
  gen_src_non_cs:
    include:
      - "*/gen-src/**"
    exclude:
      - "*/gen-src/**/*.cs"
  all_cs:
    include:
      - "**/*.cs"
  # Every hand-written C# file in the solution.
  src:
    include:
      - "*/src/**/*.cs"
  # Hand-written production code: every project's src/ except the test
  # projects. A test double standing in for a generated contract is not a
  # defect, so the extension-point rules read this set.
  production_src:
    include:
      - "*/src/**/*.cs"
    exclude:
      - "*.Test/**"
      - "*Tests/**"
  domain_gen:
    include:
      - "__Prefix__.Domain/gen-src/**/*.cs"
  infrastructure_gen:
    include:
      - "__Prefix__.Infrastructure/gen-src/**/*.cs"
  api_gen:
    include:
      - "__Prefix__.Api/gen-src/**/*.cs"
  domain_csproj:
    include:
      - "__Prefix__.Domain/*.csproj"
  infrastructure_csproj:
    include:
      - "__Prefix__.Infrastructure/*.csproj"
  build_props:
    include:
      - "Directory.Build.props"
  gitignore:
    include:
      - ".gitignore"

rules:

  # ── Markers and file layout ────────────────────────────────────────────
  # The generator stamps every C# file three ways: the `.g.cs` extension,
  # `#nullable enable` on line 1, and the `<auto-generated>` header block.
  # The header is what opts the file out of analyzers and formatters; the
  # extension and the folder are what the next regen's clean step keys on.

  - id: GEN-001
    title: Every file under gen-src/ is a .g.cs file
    severity: error
    doc: docs/generated-code-expectations.md#markers
    why: >
      A generated file without the .g.cs extension is indistinguishable from
      hand-written code, so the next regen either overwrites developer work or
      leaves a stale artifact behind that still compiles.
    check: filename_matches
    scope: gen_src
    pattern: '\.g\.cs$'

  - id: GEN-002
    title: Every generated file opens with `#nullable enable`
    severity: error
    doc: docs/generated-code-expectations.md#markers
    why: >
      Generated code takes part in the solution's nullable contract. A file
      missing the pragma silently downgrades every reference type in it to
      oblivious, and the CS86xx warnings that would have caught a bad
      annotation never fire.
    check: first_line_equals
    scope: gen_src
    value: "#nullable enable"

  - id: GEN-003
    title: Every generated file carries the auto-generated header block
    severity: error
    doc: docs/generated-code-expectations.md#markers
    why: >
      `// <auto-generated>` is what excludes the file from analyzers and
      formatters. Without it a regen produces thousands of style findings that
      bury the real ones, and a formatter "fixes" code the next regen rewrites.
    check: require_pattern
    scope: gen_src
    patterns:
      - '// <auto-generated'
      - 'Generated by the Specfuse Generator'

  - id: GEN-004
    title: No .g.cs file lives outside a gen-src/ folder
    severity: error
    doc: docs/generated-code-expectations.md#markers
    why: >
      A .g.cs outside gen-src/ is a stale artifact from an earlier generator
      layout or a file someone moved. It still compiles, so it shadows or
      duplicates the current output instead of failing loudly, and no regen
      will ever clean it up.
    check: forbid_paths
    scope: all_cs
    pattern: '\.g\.cs$'
    unless_path: '/gen-src/'

  - id: GEN-005
    title: Nothing but generated C# lives under gen-src/
    severity: error
    doc: docs/generated-code-expectations.md#markers
    why: >
      gen-src/ is wiped and re-emitted on every full-group regen, so anything
      parked there is lost without warning: a README, a stray .editorconfig
      (which would re-enable analyzers on the generated tree), leftover .json
      or .bak files. Notes belong in docs/, extensions in src/.
    check: forbid_paths
    scope: gen_src_non_cs
    pattern: '.'

  # ── Layer dependencies ─────────────────────────────────────────────────
  # Domain depends on nothing in the solution. Infrastructure implements
  # Domain's interfaces. Api talks to Domain and references Infrastructure
  # only to wire it up in Program.cs. Two views of the same rule: the
  # `using` lines the generator emits, and the ProjectReference edges you own.

  - id: GEN-010
    title: Domain gen-src depends on no other layer
    severity: error
    doc: docs/generated-code-expectations.md#layering
    why: >
      Domain is the dependency sink. An inbound using from Infrastructure or
      Api inverts the architecture and makes the domain untestable without a
      database. In generated code it is a generator defect: report it rather
      than work around it.
    check: forbid_pattern
    scope: domain_gen
    pattern: '^using __Prefix__\.(Infrastructure|Application|Api)\b'

  - id: GEN-011
    title: Infrastructure gen-src depends on Domain only
    severity: error
    doc: docs/generated-code-expectations.md#layering
    why: >
      Infrastructure implements Domain interfaces. A using of Api makes the
      persistence layer depend on its own callers.
    check: forbid_pattern
    scope: infrastructure_gen
    pattern: '^using __Prefix__\.Api\b'

  - id: GEN-012
    title: Api gen-src never references Infrastructure directly
    severity: error
    doc: docs/generated-code-expectations.md#layering
    why: >
      Controllers reach persistence through Domain interfaces resolved by DI.
      A direct Infrastructure using in generated code would make every
      controller untestable without a real DbContext.
    check: forbid_pattern
    scope: api_gen
    pattern: '^using __Prefix__\.Infrastructure\b'

  - id: GEN-013
    title: The Domain project references no other project
    severity: error
    doc: docs/generated-code-expectations.md#layering
    why: >
      A ProjectReference is the compile-time form of GEN-010. With one in
      place the using-line rule can be satisfied while the dependency exists
      anyway, through a fully-qualified name.
    check: forbid_pattern
    scope: domain_csproj
    pattern: '<ProjectReference\b'

  - id: GEN-014
    title: The Infrastructure project never references the Api project
    severity: error
    doc: docs/generated-code-expectations.md#layering
    why: >
      Api is the composition root and already references Infrastructure. The
      reverse edge is a cycle MSBuild refuses, or, split across assemblies, a
      persistence layer that cannot be built or tested without the web host.
    check: forbid_pattern
    scope: infrastructure_csproj
    pattern: '<ProjectReference Include="[^"]*\.Api\.csproj"'

  # ── Host wiring ────────────────────────────────────────────────────────
  # The generator writes gen-src/ and nothing else. The files that make it
  # compile are seeded once and owned here; these rules keep them doing their
  # one job.

  - id: GEN-020
    title: Directory.Build.props compiles src/ and gen-src/ and nothing else
    severity: error
    doc: docs/generated-code-expectations.md#build-wiring
    why: >
      With default globbing on, a .cs file anywhere in a project folder joins
      the build, so a file parked beside gen-src/ compiles and shadows the
      generated one. With one of the two Compile globs missing, half the
      solution silently stops compiling and the build goes red on every type
      it defined.
    check: require_pattern
    scope: build_props
    patterns:
      - '<EnableDefault(Compile)?Items>false</EnableDefault(Compile)?Items>'
      - 'Compile Include="src[\\/]\*\*[\\/]\*\.cs"'
      - 'Compile Include="gen-src[\\/]\*\*[\\/]\*\.cs"'

  - id: GEN-021
    title: The generator's path manifests are not git-ignored
    severity: error
    doc: docs/generated-code-expectations.md#build-wiring
    why: >
      `<Group>.generated-paths.json` beside each gen-src/ records every path
      the group emitted and every file a regen moved: the old-to-new mapping
      a layout-changing generator release hands over. Its capturedAt is read
      from the spec repo's baseline, not the clock, so a regen that moved
      nothing leaves it byte-identical. Ignored, the mapping never reaches
      the repo and a layout move reads as an unexplained delete plus add.
    check: forbid_pattern
    scope: gitignore
    # A comment saying the omission is deliberate is fine; an ignore line is not.
    pattern: '^[^#]*generated-paths'
    allow_empty: true

  # ── Hand-written code holds up its end ─────────────────────────────────

  - id: GEN-030
    title: No hand-written file carries the Specfuse generator header
    severity: error
    doc: docs/generated-code-expectations.md#extension-points
    why: >
      A generated file copied into src/ and edited is the hand edit the
      gen-src/ rule exists to forbid, moved one folder over. It compiles
      beside the real one until the next regen renames something, and then
      the copy is the stale one that still wins. The match is the generator's
      own header line, not the bare `<auto-generated />` marker: EF Core
      migrations and designer files carry that marker legitimately.
    check: forbid_pattern
    scope: src
    pattern: 'Generated by the Specfuse Generator'

  # ── Generated extension points are adopted ─────────────────────────────
  # The generator emits an abstract `*Base` plus an interface for every event
  # handler, scheduled job and gated application service; the concrete class
  # is yours, in src/. Implementing the interface directly compiles, resolves
  # through DI and runs, with none of the base's contract in effect (inbox
  # dedup, transaction scope, timeout, the If-Match precondition), and nothing
  # reports it. These rules make that silent drop a red gate.

  - id: GEN-040
    title: Every generated handler and job base has a concrete class deriving from it
    severity: error
    doc: docs/generated-code-expectations.md#extension-points
    why: >
      A `{X}HandlerBase` with no subclass is a handler the spec declared and
      nobody wrote. The generated trigger still subscribes to the label, so
      every delivery dead-letters until someone notices the queue.
    check: builtin
    name: generated_base_adopted
    base_glob: "*/gen-src/**/*HandlerBase.g.cs"
    consumer_glob: "*/src/**/*.cs"
    allow_empty: true

  - id: GEN-041
    title: Every generated application-service base has a concrete class deriving from it
    severity: error
    doc: docs/generated-code-expectations.md#extension-points
    why: >
      The If-Match precondition lives in a non-virtual method on
      `{Tag}ApplicationServiceBase` that delegates to a `...Core` override. A
      concrete service that implements the interface without the base compiles
      clean and silently drops the precondition: every concurrent write
      becomes a blind overwrite.
    check: builtin
    name: generated_base_adopted
    base_glob: "*/gen-src/**/*ApplicationServiceBase.g.cs"
    consumer_glob: "*/src/**/*.cs"
    allow_empty: true

  - id: GEN-042
    title: No production class implements a generated handler interface without its base
    severity: error
    doc: docs/generated-code-expectations.md#extension-points
    why: >
      `class X : IOrderPlacedHandler` compiles, is picked up by the generated
      assembly scan and is invoked by the trigger exactly as if it derived
      from `OrderPlacedHandlerBase`, with none of the base's scaffolding. The
      supported shape is `class X(...) : OrderPlacedHandlerBase(...)`, which
      already implements the interface. Only interfaces the generator emitted
      count, and only in production code: a test double implementing one is
      what a test is for.
    check: builtin
    name: generated_handler_interface_implemented_directly
    scope: production_src
    interface_glob: "*/gen-src/**/*.g.cs"
    allow_empty: true
