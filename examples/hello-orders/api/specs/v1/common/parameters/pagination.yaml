# =============================================================================
# Pagination and common query/header parameters.
# =============================================================================

page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

pageSize:
  name: pageSize
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 2500
    default: 25

sort:
  name: sort
  in: query
  required: false
  schema:
    type: string
  description: "Comma-separated: field[:asc|desc][,field2[:asc|desc]]"

validateOnly:
  name: validateOnly
  in: query
  required: false
  schema:
    type: boolean
    default: false
  description: Run full validation without committing side effects (AI-agent-friendly).

If-Match:
  name: If-Match
  in: header
  required: true
  schema:
    type: string
  description: Strong ETag of the current representation; required for PUT/PATCH/DELETE.
