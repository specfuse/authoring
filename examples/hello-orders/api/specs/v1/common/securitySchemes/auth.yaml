# =============================================================================
# Authentication / authorization schemes.
# =============================================================================
# See API Handbook §5. The closed role set is the info.x-roles registry in
# ../../openapi.yaml — see Vendor_Extensions.md §3.1.

bearerAuth:
  type: http
  scheme: bearer
  bearerFormat: JWT
  description: |
    Bearer JWT (RS256). For the hello-orders example, the iss/aud claims are
    not specified — this is illustrative, not deployable. Real projects map
    token role claims to the roles registered in info.x-roles at the
    gateway or auth middleware layer.
