post:
  operationId: placeOrder
  tags: [Orders]
  summary: Place a draft order
  description: Lifecycle action — transitions a draft order to `placed`. Emits `Order.Placed`.
  x-roles: [Admin, Manager, Customer]
  x-scopes: [order.Order.write]
  # REQUIRED here, and not decoration. Without x-operation the generator
  # categorises automatically (Vendor_Extensions.md §5.1), and a POST with no
  # request body resolves to `Create` — which then demands a body of type
  # Entity/ApiModel and aborts generation for the whole `Orders` tag:
  #
  #   OperationResolutionException: Operation 'PlaceOrder' is a Create but has
  #   no form parameters or body parameter of type Entity/ApiModel
  #
  # `coordination` is the category for an action that drives a transition
  # rather than creating a row. `target` names the entity the action addresses,
  # which the path (/v1/orders/{orderId}/place) does not spell as a schema name.
  # See authoring #97 — `validate` is silent on this, so the only thing that
  # catches it is running `generate`.
  x-operation:
    category: coordination
    target: Order
  x-emits:
    - event: Order.Placed
      description: Emitted on the draft → placed state transition
  parameters:
    - $ref: '../../../common/parameters/path.yaml#/orderId'
    - $ref: '../../../common/parameters/pagination.yaml#/validateOnly'
    # No If-Match here, deliberately. This is an action-style POST that
    # delegates to a consumer-owned application service, so no generated
    # write call site exists for a precondition gate to sit on — the
    # generator reports CONCURRENCY_PRECONDITION_UNENFORCEABLE, and opting
    # Order into optimistic concurrency does not change that. Declaring
    # If-Match and 412 here would advertise lost-update protection nothing
    # provides. The 409 below is the real guard: it rejects a transition
    # from a status that cannot be placed.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: OK — the order is now in `placed` status
      headers:
        Location:    { schema: { type: string, format: uri } }
        API-Version: { schema: { type: string } }
      content:
        application/json:
          schema:
            $ref: '../models/Order.yaml'
    '401': { $ref: '../../../common/responses/errors.yaml#/UnauthorizedError' }
    '403': { $ref: '../../../common/responses/errors.yaml#/ForbiddenError' }
    '404': { $ref: '../../../common/responses/errors.yaml#/NotFoundError' }
    '409':
      description: Conflict — the order is not in a state that can be placed (e.g., already placed)
      content:
        application/json:
          schema:
            $ref: '../../../common/responses/errors.yaml#/Error'
