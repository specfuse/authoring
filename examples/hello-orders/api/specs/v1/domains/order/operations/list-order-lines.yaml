get:
  operationId: listOrderLines
  tags: [OrderLines]
  summary: List line items on an order
  description: Returns all OrderLine items under the given order. Not paginated — line count per order is bounded.
  x-roles: [Admin, Manager, Customer]
  x-scopes: [order.OrderLine.read]
  parameters:
    - $ref: '../../../common/parameters/path.yaml#/orderId'
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: OK
      headers:
        API-Version: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../models/BasicOrderLine.yaml'
    '401': { $ref: '../../../common/responses/errors.yaml#/UnauthorizedError' }
    '403': { $ref: '../../../common/responses/errors.yaml#/ForbiddenError' }
    '404': { $ref: '../../../common/responses/errors.yaml#/NotFoundError' }
