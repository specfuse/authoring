name: OrderPlaced
title: Order Placed
summary: Emitted when an order transitions from draft to placed.
contentType: application/json
traits:
  - $ref: '../../../async-common/message-traits/common.yaml#/auditableEvent'
x-message-category: event
x-label:
  entity: Order
  action: Placed
x-version:
  current: 1
  status: stable
# State-transition event: required x-trigger-when. The generator-emitted
# service code evaluates this predicate before SaveChangesAsync. When matched,
# Order.Placed fires AND the corresponding Order.Updated is suppressed
# (mutual-exclusivity rule).
x-trigger-when: "After.status == 'placed' && Before.status != 'placed'"
x-partition-key:
  property: orderId
  scope: aggregate
payload:
  type: object
  required: [orderId, before, after]
  properties:
    orderId:
      type: string
      format: uuid
    before:
      $ref: '../events/OrderSnapshot.yaml'
    after:
      $ref: '../events/OrderSnapshot.yaml'
