[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specfuse-kit"
version = "0.3.1"
description = "Specfuse spec-authoring kit: handbooks, samples, Claude assets, project bootstrap, and the generator launcher."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Christian Labonté" }]
keywords = ["specfuse", "openapi", "asyncapi", "arazzo", "codegen", "spec-driven"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
specfuse-kit = "specfuse_kit.cli:main"

[project.urls]
Homepage = "https://github.com/Specfuse/authoring"
Source = "https://github.com/Specfuse/authoring"

[tool.hatch.build.targets.wheel]
packages = ["src/specfuse_kit"]

# The kit's authored content lives at the repo root for human browsing.
# Map it into the package so it ships inside the wheel as specfuse_kit/_kit/...
[tool.hatch.build.targets.wheel.force-include]
"handbooks" = "specfuse_kit/_kit/handbooks"
"samples" = "specfuse_kit/_kit/samples"
"templates" = "specfuse_kit/_kit/templates"
"claude-assets" = "specfuse_kit/_kit/claude-assets"
"schemas" = "specfuse_kit/_kit/schemas"
"generator.lock" = "specfuse_kit/_kit/generator.lock"

[tool.hatch.build.targets.sdist]
include = [
  "src/specfuse_kit",
  "handbooks",
  "samples",
  "templates",
  "claude-assets",
  "schemas",
  "generator.lock",
  "README.md",
  "LICENSE",
]
