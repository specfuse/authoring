[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specfuse-authoring"
version = "0.5.7"
description = "Specfuse authoring kit: handbooks, samples, Claude assets, project bootstrap, and the generator launcher."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Christian Labonté" }]
keywords = ["specfuse", "openapi", "asyncapi", "arazzo", "codegen", "spec-driven"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
specfuse-authoring = "specfuse.authoring.cli:_run"

[project.urls]
Homepage = "https://github.com/Specfuse/authoring"
Source = "https://github.com/Specfuse/authoring"

[tool.hatch.build.targets.wheel]
# Namespace package: ship specfuse/authoring/ (the `specfuse` namespace is
# shared with sibling packages like specfuse-loop).
packages = ["specfuse"]

# The kit's authored content lives at the repo root for human browsing.
# Map it into the package so it ships in the wheel as specfuse/authoring/_kit/...
# Claude assets (skills + agents) are NOT bundled — they ship via the `specfuse`
# plugin marketplace (specfuse/specfuse). The package carries only the contract
# the skills read (handbooks, samples) plus the project skeleton + schemas.
[tool.hatch.build.targets.wheel.force-include]
"handbooks" = "specfuse/authoring/_kit/handbooks"
"samples" = "specfuse/authoring/_kit/samples"
"templates" = "specfuse/authoring/_kit/templates"
"schemas" = "specfuse/authoring/_kit/schemas"
"generator.lock" = "specfuse/authoring/_kit/generator.lock"

[tool.hatch.build.targets.sdist]
include = [
  "specfuse",
  "handbooks",
  "samples",
  "templates",
  "schemas",
  "generator.lock",
  "README.md",
  "LICENSE",
]
