      rm-xentity-shape: specfuse-xentity-shape
      rm-xenumcase-on-enums-only: specfuse-xenumcase-on-enums-only
      rm-xenumcase-shape: specfuse-xenumcase-shape
      rm-xvalueobject-no-xentity: specfuse-xvalueobject-no-xentity
      rm-xvalueobject-not-main-resource: specfuse-xvalueobject-not-main-resource
      rm-xvalueobject-shape: specfuse-xvalueobject-shape

    non_mechanical:
      rm-auth-scopes-pattern:
        to: specfuse-auth-scopes-shape
        kind: split
        also:
          - specfuse-auth-scopes-registry
          - specfuse-auth-scopes-all-on-operation
        note: >-
          The legacy rule was a warn-severity `pattern` over dotted camelCase
          segments. The kit replaced it with a three-rule grammar (shape /
          registry / all-on-operation) at error severity, keyed on
          `<domain>[.Entity].<operation>`. `-pattern` -> `-shape` is not a
          prefix swap, and the semantics are strictly tighter: a baseline
          count for the legacy rule DOES NOT carry over. Re-count against the
          successor before trusting it.
      rm-no-embedded-objects:
        to: specfuse-no-inline-objects
        kind: merged
        note: >-
          A byte-identical duplicate of `rm-no-inline-objects`, retired on
          both sides. Kept in the map because baselines committed before the
          dedup still name it. If BOTH legacy ids carry a count, the migration
          refuses rather than guessing how to combine them.

    retained:
      rm-auth-roles-allowed:
        overlay_for: specfuse-auth-roles-pascal
        note: >-
          Kit rule constrains the SHAPE (PascalCase). The closed role set is
          the project's.
      rm-x-expand-of-shape:
        partially_superseded_by: specfuse-projection-coherence
        note: >-
          PARTIAL OVERLAP, not a rename. The kit rule checks the named twin is
          a sibling identifier property; it does not assert camelCase, and it
          only looks under `components.schemas`. Deleting this rule loses the
          casing check.
      rm-x-kiosk-session-shape:
        note: >-
          `x-kiosk-session` is a project vendor extension. The kit does not
          define it.
      rm-x-membership-gated-shape:
        note: >-
          `x-membership-gated` is a project vendor extension. The kit does not
          define it.
      rm-x-projection-shape:
        partially_superseded_by: specfuse-projection-coherence
        note: >-
          PARTIAL OVERLAP, not a rename. The kit rule checks that an
          `x-projection` property is a non-required array of `$ref` on an
          `x-entity` schema; it does not assert the marker is the boolean
          literal `true`, and it only looks under `components.schemas`.
          Deleting this rule loses the value check. Fold it into an overlay or
          keep it.
      rm-x-self-scoped-shape:
        note: >-
          `x-self-scoped` is a project vendor extension. The kit does not
          define it.
      rm-x-test-seed-shape:
        note: >-
          `x-test-seed` values are C# expressions — language-specific, so
          project-side.

    # `retired` also covers an INVERTED rule: a successor exists, but it counts
    # the complement of what the legacy rule counted, so the number cannot move
    # across. Dropping the key and letting the successors surface as new
    # coverage is the only safe migration.
    retired:
      rm-428-on-write:
        note: >-
          INVERTED, not renamed, and not merely deleted. The legacy rule
          REQUIRED a `428` on every write; the kit now FORBIDS one
          (`specfuse-no-428`, plus `specfuse-no-428-in-prose` for the sentence
          that motivated the declarations). `If-Match` is `required: true`, so
          an absent header is a `400` from model validation before any
          concurrency gate runs, and the generator emits no `428` under any
          entity configuration — since 0.8.0 it reports each declaration as a
          hard ERROR (`PRECONDITION_REQUIRED_DECLARED_UNEMITTED`). The legacy
          baseline count is the number of operations MISSING a `428`; the
          successors' population is the operations HAVING one. Complements, so
          carrying the count across would seed a ceiling that means nothing
          and could grant free passes. The key is dropped; seed the two
          successors deliberately. See `compatibility.md` §34.
      rm-etag-on-get:
        note: >-
          MIGRATED to the generator, not deleted. The rule keyed on PATH SHAPE
          alone (a trailing `{xId}` segment, or `/current` / `/settings` /
          `/preferences`) and demanded an `ETag` on the `200`. That held while
          "mutable resource" and "concurrency-controlled resource" were one
          set; `x-entity.concurrency: none` and `{mode: delegated, to: <root>}`
          split them. Such an entity publishes no validator of its own and the
          generated controller never writes the header, so the pinned generator
          reports the declaration as `ENTITY_TAG_DECLARED_UNGATED` — an ERROR
          since 0.8.0. Declaring the header and dropping it are BOTH findings,
          from different tools, so no authorable state satisfied both. Coverage
          did not shrink: `ENTITY_TAG_UNDECLARED_GATED` (ERROR) is the same
          direction keyed on the entity instead of the path, and
          `ENTITY_TAG_DECLARED_COLLECTION` (WARNING) is the case the path regex
          could only approximate. A path-shape-keyed version must NOT be
          reinstated — it cannot see the entity. See `compatibility.md` §35.

