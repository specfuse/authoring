#
# rule-renames.yaml — the complete `rm-*` -> `specfuse-*` Spectral rule-id map.
#
# WHY THIS IS DATA AND NOT PROSE
#
# The kit's rulesets were generalised from a source project by renaming every
# rule identifier from the legacy `rm-*` prefix to `specfuse-*`. Rule ids are a
# coupling surface: a committed Spectral baseline names them, so a rename turns
# "rule not in the baseline" into a hard failure on every rule simultaneously —
# and a project ruleset that forked from the same source names them too, so a
# naive `extends:` of the kit double-reports every shared rule.
#
# `compatibility.md` §1 declared twelve of those renames canonical. The other
# ~160 were applied mechanically and were recorded nowhere, which meant the only
# way to migrate was to guess the swap and hope no rule was an exception. Two
# are. This file is the whole map, machine-readable, and it is the source of
# truth that §1 now points at.
#
# HOW IT WAS DERIVED
#
# By set-comparing the kit rulesets against the pre-rename ruleset they were
# forked from (the source project's `api/spectral.restomanager*.yaml`), then
# reconciling the residue against the kit's own git history — which is where the
# two non-mechanical entries came from, since both post-date the fork.
#
# HOW TO READ IT
#
#   renames         legacy id -> kit id. A pure prefix swap. Mechanical.
#   non_mechanical  legacy id -> kit id where the swap gets it WRONG. These are
#                   the entries a sed script mangles, so they carry the reason.
#                   They are ALSO listed in `renames`, so a consumer only has to
#                   read one map; `non_mechanical` exists to be reported loudly.
#   retained        legacy ids with NO kit counterpart. The kit does not own the
#                   rule; the project keeps it. Most are value-set overlays of a
#                   shape-only kit rule — see `overlay_for`, and the table in
#                   `schemas/README.md` §"What the project must provide".
#   retired         legacy ids with no successor at all — the rule was deleted.
#                   Migrating a baseline DROPS these keys.
#
# Ids that never carried the `rm-` prefix are unchanged and are not listed:
# upstream Spectral rules the kit re-declares (`operation-tag-defined`,
# `duplicated-entry-in-enum`) and the `asyncapi-*` custom-function rules.
#
# CONSUMERS
#
#   scripts/spectral-ratchet.py --migrate-rule-ids   rekeys a committed baseline
#   scripts/spectral-overlay-diff.py                 classifies a forked ruleset
#
# Both verify that every `to:` target still exists in the kit ruleset for its
# surface, and refuse to run against a stale map rather than misclassifying.

version: 1

prefix:
  legacy: "rm-"
  canonical: "specfuse-"

rulesets:

