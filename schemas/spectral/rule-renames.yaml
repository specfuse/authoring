      rm-schema-name-pascal: specfuse-schema-name-pascal
      rm-single-tag: specfuse-single-tag
      rm-validate-only-on-writes: specfuse-validate-only-on-writes
      rm-x-fk-for-shape: specfuse-x-fk-for-shape
      rm-x-references-shape: specfuse-x-references-shape
      rm-x-sample-faker-path-format: specfuse-x-sample-faker-path-format
