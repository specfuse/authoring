# =============================================================================
# Specfuse OpenAPI Spectral Ruleset
# =============================================================================
# Enforces Specfuse conventions for OpenAPI 3.x specifications.
# Authoritative reference: handbooks/API_Handbook.md
#
# This ruleset validates the universal Specfuse conventions only. Value-set
# constraints that are project-defined (the closed role enum, the project
# domain list, project-specific URL path patterns) are NOT baked in here.
# Projects should extend this ruleset in their own .spectral.yaml and add the
# project-specific overlays. See schemas/README.md.
#
# Generalization notes for items lifted from the source project:
# - All rule IDs renamed from rm-* to specfuse-* (compatibility.md §1).
# - Closed role enum (the source project's closed role set) removed from
#   specfuse-auth-roles-allowed: rule now enforces the structural
#   PascalCase shape only. The project's overlay adds the closed value set.
# - Path-pattern exclusions that named source-specific suffixes (e.g.,
#   /dismiss, /access, /process, /errors on POST endpoints) were dropped:
#   the rule still distinguishes resource-creation paths from action paths
#   by the plural-noun heuristic. Projects with bespoke action verbs can
#   add their own exclusions via an overlay.
# - Illustrative event names in messages updated from source-project fixtures
#   to generic order/customer vocabulary (e.g., Order.Created) to match
#   examples/hello-orders/.
# =============================================================================

extends: "spectral:oas"
formats: [oas3]

functions:
  - openapiProjectionCoherence
  - openapiChildCollectionReconcile
  - openapiServiceRegistry
  - openapiReadModelShape
  - openapiClassification
  - openapiScopeGrammar

rules:

  # ===== Disabled / downgraded built-in rules =====
  operation-tag-defined: off

  # Upstream `spectral:oas` ships this rule with an unguarded recursive-descent
  # filter — `$..[?(@property !== 'properties' && @.enum && …)]` — with no `@ &&`
  # null check. Any null value anywhere in the document (a meaningful
  # `effectiveTo: null` in an example payload, a property-level `example: null`,
  # a null schema node) makes it throw
  #   Cannot read properties of null (reading 'enum')
  # which aborts the ENTIRE Spectral run: no findings are emitted, the process
  # exits 2, and any wrapper that only inspects the report reads it as a clean
  # pass. Reproduced against Spectral CLI 6.16.2 / nimma 0.7.2 with a 12-line
  # OpenAPI document. See authoring issue #14.
  #
  # Disabled here and replaced by the null-safe `specfuse-no-duplicate-enum-entries`
  # below, which keeps the coverage without the crash.
  duplicated-entry-in-enum: off

  # ===== Casing & naming =====
  specfuse-path-casing:
    description: "Paths must use camelCase segments (no hyphens/underscores); allow :operations and {params}."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        # Matches: /segment, /camelCase, /{param}, /segment:operation
        # Does NOT match: /kebab-case, /snake_case
        match: "^(/([a-z][a-zA-Z0-9]*|\\{[a-z][a-zA-Z0-9]*\\})(:[a-z][a-zA-Z0-9]*)?)+$"

  specfuse-schema-name-pascal:
    description: "Schema (model) names must be PascalCase."
    severity: error
    given: $.components.schemas[*]~
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]*$"

  specfuse-prop-camel:
    description: "Schema properties must be camelCase."
    severity: error
    given: $.components.schemas[*].properties[*]~
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][A-Za-z0-9]*$"

  specfuse-enum-camel:
    description: "Enum values must be camelCase (skipped when x-enum-case is declared)."
    severity: error
    given:
      - $.components.schemas[?(@ && !@["x-enum-case"] && @.enum)].enum[*]
    then:
      function: casing
      functionOptions:
        type: camel

  specfuse-xenumcase-shape:
    description: "x-enum-case must be one of the allowed formatting strategies."
    severity: error
    given: $.components.schemas[*]["x-enum-case"]
    then:
      function: enumeration
      functionOptions:
        values: ["preserve", "PascalCase", "camelCase", "snake_case", "kebab-case", "SCREAMING_SNAKE_CASE"]

  specfuse-xenumcase-on-enums-only:
    description: "x-enum-case must only be applied to schemas that define enum values."
    severity: error
    given: $.components.schemas[?(@ && @["x-enum-case"] && !@.enum)]
    then:
      function: falsy
      field: x-enum-case

  specfuse-single-tag:
    description: "Operations must have exactly one tag for clear API organization."
    severity: error
    given: $.paths[*][*].tags
    then:
      function: length
      functionOptions:
        min: 1
        max: 1

  # ===== Verbs & statuses =====
  specfuse-post-201-location:
    description: "Resource-creation POST must return 201 with Location header (operation paths ending in a plural noun)."
    # NOTE: The source project excluded source-specific action suffixes
    # (/dismiss, /access, /process, /errors). Those exclusions were dropped
    # during the generalization; projects with bespoke action endpoints can
    # add their own exclusions via an overlay rule.
    severity: error
    given: $.paths[?(@property.match("/[a-z][a-zA-Z]+s$") && !@property.match("/bulk/") && !@property.match("/_system/"))].post.responses
    then:
      - field: "201"
        function: truthy
      - field: "201.headers.Location"
        function: truthy

  specfuse-put-patch-200-complete:
    description: "PUT/PATCH must always return 200 with Location header and resource body."
    severity: error
    given: $.paths[*][put,patch].responses
    then:
      - field: "200"
        function: truthy
      - field: "200.headers.Location"
        function: truthy
      - field: "200.content.application/json.schema"
        function: truthy

  specfuse-delete-204:
    description: "DELETE must return 204."
    severity: error
    given: $.paths[*].delete.responses
    then:
      field: "204"
      function: truthy

  specfuse-415-when-request-body:
    description: "Endpoints with requestBody should define 415."
    severity: warn
    given: $.paths[*][?(["post","put","patch","delete"].indexOf(@property) !== -1 && @.requestBody)]
    then:
      field: responses.415
      function: truthy

  specfuse-406-when-alt-accept:
    description: "If multiple response media types are declared, include 406."
    severity: warn
    # The "multiple media types" half of this rule cannot live in `given`:
    # JSONPath filters cannot count an object's keys. While the `given` was
    # inert nobody noticed, because a rule that matches nothing never
    # contradicts its own description. Live, the old form demanded 406 from
    # EVERY operation returning a 200 body — 8 findings against a conformant
    # hello-orders. The media-type count therefore belongs in `then`, where
    # JSON Schema can express it as `minProperties: 2`.
    given: $.paths[*][?(["get","post","put","patch","delete"].indexOf(@property) !== -1 && @.responses && @.responses["200"] && @.responses["200"].content)]
    then:
      function: schema
      functionOptions:
        schema:
          if:
            type: object
            required: [responses]
            properties:
              responses:
                type: object
                required: ["200"]
                properties:
                  "200":
                    type: object
                    required: [content]
                    properties:
                      content:
                        type: object
                        minProperties: 2
          then:
            type: object
            required: [responses]
            properties:
              responses:
                type: object
                required: ["406"]

  # ===== Concurrency & ETags =====
  #
  # `specfuse-etag-on-get` USED TO LIVE HERE and is deliberately gone. Do not
  # reinstate it, in this or any narrowed form. See `compatibility.md` §35.
  #
  # It keyed on PATH SHAPE alone — a segment ending in `{xId}`, or `/current`,
  # `/settings`, `/preferences` — and demanded an `ETag` on the `200`. That was
  # right while "mutable resource" and "concurrency-controlled resource" were the
  # same set. Since `x-entity.concurrency` gained `none` and `{mode: delegated,
  # to: <root>}` they are different sets: such an entity publishes no validator
  # of its own, the generated controller never writes the header, and the pinned
  # generator reports the declaration as `ENTITY_TAG_DECLARED_UNGATED` — an
  # ERROR since 0.8.0, which is the jar `generator.lock` has pinned since kit
  # 0.14.0. Measured on one two-entity probe against the pinned 0.9.0 jar:
  #
  #   ETag declared on the `none` entity's GET  ->  generator ERROR, Spectral clean
  #   ETag dropped (the generator's own fix)    ->  generator clean, Spectral warn
  #
  # No authorable state satisfied both. A Spectral `given` cannot resolve a
  # response `$ref` to the target entity's `x-entity.concurrency`, so the rule
  # could not be narrowed into agreement without a custom resolver — and even
  # with one, the kit would be re-implementing an ERROR-severity generator rule
  # at `warn`, with its own resolution logic, free to drift.
  #
  # This is a check MIGRATING to the generator, not a check being dropped. The
  # generator owns both directions and the case the path regex could only
  # approximate:
  #
  #   ENTITY_TAG_DECLARED_UNGATED      ERROR       what the old rule contradicted
  #   ENTITY_TAG_UNDECLARED_GATED      ERROR       what the old rule covered
  #   ENTITY_TAG_DECLARED_COLLECTION   WARNING     a list body is not a row
  #   ENTITY_TAG_CENSUS                SUGGESTION
  #
  # `Vendor_Extensions.md` §1.1 documents all four. `API_Handbook.md` section 2
  # states the replacement rule in prose: the `ETag` header belongs on a safe
  # read IF AND ONLY IF the response entity declares `concurrency: optimistic`.

  specfuse-ifmatch-on-write:
    description: "PUT/PATCH/DELETE must accept If-Match and define 412."
    severity: error
    given: $.paths[*][put,patch,delete]
    then:
      - field: parameters
        function: schema
        functionOptions:
          schema:
            type: array
            contains:
              type: object
              properties:
                name: { const: "If-Match" }
                in: { const: "header" }
      - field: responses.412
        function: truthy

  # These two rules replace `specfuse-428-on-write`, which required the
  # opposite. See `compatibility.md` §34 for the full account; the short form:
  #
  #   `If-Match` is `required: true` (specfuse-ifmatch-on-write, and the
  #   generator's own AI_IFMATCH_NOT_REQUIRED). A required header that is absent
  #   is rejected by model validation with a `400` before any handler or
  #   concurrency gate runs, so no generated code path reaches a `428`. The
  #   generator emits no `PreconditionRequiredException` and carries no `428` in
  #   any template, and since 0.8.0 it reports every declaration as a hard
  #   ERROR:
  #
  #     PRECONDITION_REQUIRED_DECLARED_UNEMITTED — "declares a '428'
  #     (Precondition Required) response, but the generator never emits 428
  #     under any entity configuration"
  #
  #   Keeping `required: true` is the deliberate trade: a forgotten `If-Match`
  #   becomes a compile error in the generated typed clients, which is strictly
  #   better than a runtime status telling you the same thing. A stale ETag is
  #   still `412`.
  #
  # Both ship at `warn`. The pinned generator already fails a bundle carrying
  # `428`, so Spectral severity only decides who tells you first — and a
  # consumer upgrading into this kit has a full set of declarations to clear.
  specfuse-no-428:
    description: >-
      Operations must NOT declare 428. If-Match is required:true, so an absent
      header fails model validation with 400 before any concurrency gate runs,
      and no generated code path emits 428. A present-but-stale ETag is 412.
      See API Handbook section 2.
    message: "{{path}} declares a 428 response the generator never emits. Remove it; keep If-Match required:true."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete]
    then:
      field: responses.428
      function: undefined

  # Inverting the declaration rule on its own is not enough: it checks
  # `responses.428` and nothing else, so a consumer clears the declarations,
  # goes green, and keeps shipping descriptions promising a status the API
  # cannot emit. That prose reaches every reader of the published spec.
  #
  # Two scoping notes, both load-bearing:
  #   * `given` is anchored under `paths`, so byte sizes and other numbers
  #     elsewhere in the document are out of range.
  #   * `\b` refuses to match `428` inside a longer number, which is what keeps
  #     a `52428800` (50 MB) `maxFileSize` from firing. A naive substring match
  #     produces false positives on any real bundle.
  specfuse-no-428-in-prose:
    description: >-
      No description under an operation may promise 428. A missing If-Match is
      400 — the header is required:true, so model validation rejects the request
      before any concurrency gate runs — and a stale ETag is 412. Drop the
      clause; keep the 412 half. See API Handbook section 2.
    message: "{{path}} promises 428 in prose. A missing If-Match is 400, a stale ETag is 412 — the API emits no 428."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete]..description
    then:
      function: pattern
      functionOptions:
        notMatch: "\\b428\\b"

  # ===== Predefined error responses (presence + correct $ref) =====
  specfuse-401-required:
    description: "Protected operations must declare 401."
    severity: error
    given: $.paths[*][?(["get","post","put","patch","delete"].indexOf(@property) !== -1 && @.security)]
    then:
      field: responses.401
      function: truthy

  specfuse-401-predefined:
    description: "Protected operations must use components.responses.UnauthorizedError for 401."
    severity: error
    given: $.paths[*][?(["get","post","put","patch","delete"].indexOf(@property) !== -1 && @.security)].responses.401
    # `resolved: false` is load-bearing: on the resolved document the `$ref` has
    # already been inlined, so `field: $ref` sees nothing and this error-severity
    # rule reports on no document, ever. The `truthy` check is the second half —
    # `pattern` alone is silent on a MISSING `$ref`, so an inline response that
    # bypasses the shared component passed the rule even once it could see it.
    resolved: false
    then:
      - field: $ref
        function: truthy
      - field: $ref
        function: pattern
        functionOptions:
          match: "^#/components/responses/UnauthorizedError$"

  specfuse-403-required:
    description: "Protected operations must declare 403."
    severity: error
    given: $.paths[*][?(["get","post","put","patch","delete"].indexOf(@property) !== -1 && @.security)]
    then:
      field: responses.403
      function: truthy

  specfuse-403-predefined:
    description: "Protected operations must use components.responses.ForbiddenError for 403."
    severity: error
    given: $.paths[*][?(["get","post","put","patch","delete"].indexOf(@property) !== -1 && @.security)].responses.403
    # `resolved: false` is load-bearing: on the resolved document the `$ref` has
    # already been inlined, so `field: $ref` sees nothing and this error-severity
    # rule reports on no document, ever. The `truthy` check is the second half —
    # `pattern` alone is silent on a MISSING `$ref`, so an inline response that
    # bypasses the shared component passed the rule even once it could see it.
    resolved: false
    then:
      - field: $ref
        function: truthy
      - field: $ref
        function: pattern
        functionOptions:
          match: "^#/components/responses/ForbiddenError$"

  specfuse-404-required:
    description: "Operations with {xxxId} path parameters must declare 404 Not Found."
    severity: error
    given: $.paths[?(@property.match("\\{[a-zA-Z0-9]+Id\\}"))][get,post,put,patch,delete]
    then:
      field: responses.404
      function: truthy

  specfuse-404-predefined:
    description: "Operations with {xxxId} path parameters must use components.responses.NotFoundError for 404."
    severity: error
    given: $.paths[?(@property.match("\\{[a-zA-Z0-9]+Id\\}"))][get,post,put,patch,delete].responses.404
    # `resolved: false` is load-bearing: on the resolved document the `$ref` has
    # already been inlined, so `field: $ref` sees nothing and this error-severity
    # rule reports on no document, ever. The `truthy` check is the second half —
    # `pattern` alone is silent on a MISSING `$ref`, so an inline response that
    # bypasses the shared component passed the rule even once it could see it.
    resolved: false
    then:
      - field: $ref
        function: truthy
      - field: $ref
        function: pattern
        functionOptions:
          match: "^#/components/responses/NotFoundError$"

  specfuse-400-required:
    description: "Operations with requestBody must declare 400 Bad Request."
    severity: error
    given: $.paths[*][?(["post","put","patch","delete"].indexOf(@property) !== -1 && @.requestBody)]
    then:
      field: responses.400
      function: truthy

  specfuse-400-predefined:
    description: "Operations with requestBody must use components.responses.BadRequestError for 400."
    severity: error
    given: $.paths[*][?(["post","put","patch","delete"].indexOf(@property) !== -1 && @.requestBody)].responses.400
    # `resolved: false` is load-bearing: on the resolved document the `$ref` has
    # already been inlined, so `field: $ref` sees nothing and this error-severity
    # rule reports on no document, ever. The `truthy` check is the second half —
    # `pattern` alone is silent on a MISSING `$ref`, so an inline response that
    # bypasses the shared component passed the rule even once it could see it.
    resolved: false
    then:
      - field: $ref
        function: truthy
      - field: $ref
        function: pattern
        functionOptions:
          match: "^#/components/responses/BadRequestError$"

  # ===== Pagination Consistency =====
  # NOTE: "If pagination params present -> response must be List" cannot be expressed in
  # Spectral's JSONPath (no wildcard inside filter). Covered directionally by the rule below.

  specfuse-list-response-requires-pagination-params:
    description: "If response is {Resource}List, all pagination parameters (page, pageSize, sort) must be present."
    severity: error
    # `resolved: false` is load-bearing: the `if` below keys off a response
    # schema whose `$ref` NAME ends in `List`, and on the resolved document that
    # ref has already been inlined. With the ref gone the condition is never
    # satisfied, so this error-severity rule stays silent even now that its
    # `given` selects nodes again. Fixing the JSONPath alone left it inert —
    # see fixtures/inert-rules-regression.yaml.
    resolved: false
    given: $.paths[*][?(@property === 'get' && @.responses && @.responses["200"])]
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              responses:
                properties:
                  "200":
                    properties:
                      content:
                        properties:
                          application/json:
                            properties:
                              schema:
                                properties:
                                  $ref:
                                    type: string
                                    pattern: "List$"
                                required: ["$ref"]
                            required: ["schema"]
                        required: ["application/json"]
                    required: ["content"]
                required: ["200"]
            required: ["responses"]
          then:
            # Each parameter is accepted either inline (`name: page`) or as a
            # `$ref` whose pointer ends in the parameter name — the shape the
            # kit's own templates and examples/hello-orders/ use. Both forms are
            # needed because `resolved: false` above is what lets the `if` see
            # the response schema's ref NAME, and on an unresolved document a
            # $ref parameter has no `name` to match. A project that stores its
            # `page` parameter under some other component key will read as
            # missing here; that is the cost of keying off the pointer, and it
            # is what scripts/spectral-ratchet.py exists to absorb.
            properties:
              parameters:
                type: array
                allOf:
                  - contains:
                      type: object
                      anyOf:
                        - properties: { name: { const: "page" } }
                          required: [name]
                        - properties: { $ref: { type: string, pattern: "/page$" } }
                          required: ["$ref"]
                  - contains:
                      type: object
                      anyOf:
                        - properties: { name: { const: "pageSize" } }
                          required: [name]
                        - properties: { $ref: { type: string, pattern: "/pageSize$" } }
                          required: ["$ref"]
                  - contains:
                      type: object
                      anyOf:
                        - properties: { name: { const: "sort" } }
                          required: [name]
                        - properties: { $ref: { type: string, pattern: "/sort$" } }
                          required: ["$ref"]
            required: ["parameters"]

  # ===== Security =====
  specfuse-global-bearer:
    description: "Global bearerAuth security scheme must be defined."
    severity: error
    given: $
    then:
      field: components.securitySchemes.bearerAuth
      function: truthy

  specfuse-protected-ops-require-security:
    description: "Operations should declare security explicitly even when global security is set, for clarity and code-gen."
    severity: hint
    given: $.paths[*][get,post,put,patch,delete]
    then:
      field: security
      function: defined

  # ===== Authorization metadata =====
  specfuse-auth-meta-present:
    description: "Secured operations must declare x-roles and x-scopes."
    severity: error
    given: $.paths[*][?(["get","post","put","patch","delete"].indexOf(@property) !== -1 && @.security)]
    then:
      - field: x-roles
        function: schema
        functionOptions:
          schema:
            type: array
            minItems: 1
            items:
              type: string
      - field: x-scopes
        function: schema
        functionOptions:
          schema:
            type: array
            minItems: 1
            items:
              type: string

  # GENERALIZATION: original rm-auth-roles-allowed pinned the values to the
  # source project's closed role set. Per compatibility.md #9 and the kit's stated
  # position, the role enum is project-defined. This kit-level rule now
  # enforces only the structural PascalCase identifier shape. Projects MUST
  # add their own overlay rule constraining x-roles values to the closed set
  # declared in their common/enums.yaml#/Role. See schemas/README.md.
  specfuse-auth-roles-pascal:
    description: "x-roles values must be PascalCase identifiers. The kit does not bake in the closed value-set — projects add an overlay rule that constrains values to their declared role enum."
    severity: error
    given: $.paths[*][?(["get","post","put","patch","delete"].indexOf(@property) !== -1 && @.security)]["x-roles"][*]
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]*$"

  # ---- x-scopes grammar: <domain>[.<Entity>].<operation> -------------------
  #
  # Handbook: Vendor_Extensions.md §3.2.
  #
  # REPLACES `specfuse-auth-scopes-pattern`, which enforced camelCase dotted
  # segments (`^[a-z][a-zA-Z0-9]*(\.[a-z][a-zA-Z0-9]*)*$`) at `warn`. That
  # pattern contradicted the rest of the kit twice over: it rejected the
  # kebab-case a domain is required to use everywhere else, and it rejected the
  # PascalCase an entity name is required to use everywhere else. It also
  # tied nothing to a registry, so a scope could name a domain that did not
  # exist and lint clean forever.
  #
  # `x-scopes` is read by NOTHING in the generator (0 files, against `x-roles`
  # in 8) — see compatibility.md §28. That is why these rules can be authored
  # freely: there is no jar position to contradict and no way to be stricter
  # than a jar that has no opinion. It is also why they are the only enforcement
  # this vocabulary has.
  #
  # Severity is `error` on shape and registry, `warn` on the `all` usage rule.
  # Existing specs predating the grammar are expected to fail; that is what
  # scripts/spectral-ratchet.py is for (schemas/README.md §"Turning the ruleset
  # on against existing specs"). Shipping at `warn` to be promoted later is the
  # path ENTITY_CONCURRENCY_UNDECLARED has been stuck on since 0.7.1.

  specfuse-auth-scopes-shape:
    description: >-
      x-scopes values must be '<domain>.<operation>' or '<domain>.<Entity>.<operation>',
      where operation is one of read | write | delete | all.
    message: "{{error}}"
    severity: error
    given: $.paths
    resolved: false
    then:
      function: openapiScopeGrammar
      functionOptions:
        check: shape

  specfuse-auth-scopes-registry:
    description: >-
      A scope's domain segment must be declared in info.x-domains, and its entity segment
      must name an x-entity schema whose x-entity.domain matches that same domain.
    # The second half is the one that pays: it catches the scope still naming
    # the domain an entity used to live in. Nothing else in the toolchain
    # notices that, and the failure is silent — the scope keeps looking correct.
    #
    # Skipped entirely when info.x-domains is absent or empty: membership is
    # unanswerable, and reporting every scope would bury the missing registry.
    message: "{{error}}"
    severity: error
    given: $.paths
    resolved: false
    then:
      function: openapiScopeGrammar
      functionOptions:
        check: registry

  specfuse-auth-scopes-all-on-operation:
    description: >-
      An operation should require a specific action, not the 'all' aggregate.
    # `all` is a legitimate scope to GRANT a client. It is almost never a
    # correct scope to REQUIRE at an endpoint: an operation performs one
    # action, so `x-scopes: [order.all]` on a GET demands delete rights to
    # read. Warn rather than error — a deliberately broad admin endpoint is a
    # real, if rare, case, and this is a judgement the author can overrule.
    #
    # Declaring `all` alongside a narrower sibling is reported through the same
    # rule with a sharper message: the narrow entries grant nothing extra, and
    # a later attempt to narrow the operation silently fails to narrow it.
    message: "{{error}}"
    severity: warn
    given: $.paths
    resolved: false
    then:
      function: openapiScopeGrammar
      functionOptions:
        check: allUsage

  # ===== Event Emission (AsyncAPI Integration) =====

  specfuse-emits-required-on-writes:
    description: "POST/PUT/PATCH/DELETE operations must declare x-emits listing the events they publish."
    message: "Write operation '{{path}}' is missing x-emits. Declare the event(s) this operation publishes on success (see AsyncAPI Handbook §0.8)."
    severity: error
    given: $.paths[*][post,put,patch,delete]
    then:
      field: x-emits
      function: truthy

  specfuse-emits-event-required:
    description: "Each x-emits entry must have an event field in {Entity}.{Action} format."
    message: "x-emits entry at '{{path}}' is missing 'event'."
    severity: error
    given: $.paths[*][post,put,patch,delete].x-emits[*]
    then:
      field: event
      function: truthy

  specfuse-emits-event-format:
    description: "x-emits event must follow {Entity}.{Action} format (PascalCase dot-separated)."
    message: "x-emits event '{{value}}' must be in '{Entity}.{Action}' format (e.g., 'Order.Created')."
    severity: error
    given: $.paths[*][post,put,patch,delete].x-emits[*].event
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]+\\.[A-Z][A-Za-z0-9]+$"

  # ===== AI Agent Integration (Phase 1: Core Foundations) =====
  specfuse-validate-only-on-writes:
    description: "POST/PUT/PATCH/DELETE operations must support validateOnly query parameter for AI agent integration."
    severity: error
    given: $.paths[*][post,put,patch,delete]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              name: { const: "validateOnly" }
              in: { const: "query" }
              required: { const: false }
              schema:
                type: object
                properties:
                  type: { const: "boolean" }
                  default: { const: false }

  specfuse-idempotency-key-support:
    description: "POST operations should support Idempotency-Key header for retry safety."
    severity: warn
    given: $.paths[*].post
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              name: { const: "Idempotency-Key" }
              in: { const: "header" }
              required: { const: false }
              schema:
                type: object
                properties:
                  type: { const: "string" }
                  format: { const: "uuid" }

  specfuse-change-description-headers:
    description: "Write operations should support change tracking headers for audit trails."
    severity: hint
    given: $.paths[*][post,put,patch,delete]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            anyOf:
              - properties:
                  name: { const: "X-Change-Reason" }
                  in: { const: "header" }
              - properties:
                  name: { const: "X-Agent-Id" }
                  in: { const: "header" }

  specfuse-conflict-response-details:
    description: "409 Conflict responses should include detailed conflict information for AI agents."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete].responses.409.content.application/json.schema
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            error: { }
            currentVersion: { type: string }
            conflictingFields:
              type: array
              items: { type: string }
            currentResource: { }

  # ===== Headers hygiene =====
  specfuse-401-www-authenticate:
    description: "401 should include WWW-Authenticate header."
    severity: hint
    given: $.paths[*][get,post,put,patch,delete].responses.401
    then:
      field: headers.WWW-Authenticate
      function: defined

  specfuse-405-allow:
    description: "405 must include Allow header."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete].responses.405
    then:
      field: headers.Allow
      function: truthy

  specfuse-ratelimit-headers:
    description: "200 responses on rate-limited routes should include RateLimit-* headers."
    severity: hint
    given: $.paths[*].get.responses.200.headers
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            RateLimit-Limit: {}
            RateLimit-Remaining: {}
            RateLimit-Reset: {}

  specfuse-retry-after-on-429-503:
    description: "429/503 must include Retry-After."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete].responses[?(@property=='429' || @property=='503')]
    then:
      field: headers.Retry-After
      function: truthy

  # ===== Versioning / deprecations =====
  specfuse-api-version-header:
    description: "All successful responses should include API-Version header for client awareness and debugging."
    severity: hint
    given: $.paths[*][get,post,put,patch,delete].responses[?(@property.match("^2\\d\\d$"))].headers
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            API-Version:
              type: object
              properties:
                schema:
                  type: object
                  properties:
                    type: { const: "string" }

  # ===== Phase #1 naming suffixes =====
  specfuse-resource-naming-convention:
    description: "Resource-related schemas must follow naming: {Resource}, Basic{Resource}, New{Resource}, Update{Resource}, {Resource}List, {Resource}SearchRequest."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"] || @property.match("^(Basic|New|Update)[A-Z]") || @property.match("[A-Z][a-zA-Z0-9]*(List|SearchRequest)$"))]~
    then:
      function: pattern
      functionOptions:
        match: "^([A-Z][A-Za-z0-9]*|Basic[A-Z][A-Za-z0-9]*|New[A-Z][A-Za-z0-9]*|Update[A-Z][A-Za-z0-9]*|[A-Z][A-Za-z0-9]*List|[A-Z][A-Za-z0-9]*SearchRequest)$"

  specfuse-deprecated-suffixes:
    description: "Avoid deprecated suffixes like Ref, Summary in schema names."
    severity: warn
    given: $.components.schemas[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "Ref$|Summary$"

  # ===== x-entity placement & shape =====
  specfuse-xentity-main-only:
    description: "x-entity must not appear on derivative schemas (Basic*, New*, Update*, *List, *SearchRequest)."
    severity: error
    given: $.components.schemas[?(@ && (@property.match("^(Basic|New|Update)[A-Z]") || @property.match("[A-Z][a-zA-Z0-9]*(List|SearchRequest)$")) && @["x-entity"])]
    then:
      function: falsy
      field: x-entity

  specfuse-xentity-shape:
    description: "x-entity must follow the required shape."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          required: ["domain", "type"]
          properties:
            domain: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
            type: { type: string, enum: ["entity","aggregate"] }
            requiresPagination: { type: boolean, default: true }
            # DEPRECATED, and accepted here for exactly that reason.
            #
            # The generator still parses `schema` (EntityDefinition carries the
            # field and lists it in KNOWN_SUB_KEYS, verified against the pinned
            # 0.5.7 jar), so this guard must accept it — see the note below on
            # `concurrency` for why a closed guard must never reject a form the
            # generator accepts.
            #
            # It is on its way out: database schema names belong in the project
            # file, as `persistence.entities.<Entity>.schema` on a `relational`
            # descriptor (Project_File.md §6.4, §6.8). Deprecation means migrate
            # at your own pace; an ERROR here would have meant migrate now or
            # stop linting, which is not what the generator is telling you.
            # The nudge is `specfuse-xentity-schema-deprecated` (WARN) below.
            schema: { type: string }
            # Lost-update protection for the entity's rows (generator
            # FEAT-2026-0078 / FEAT-2026-0088, Vendor_Extensions.md §1.1).
            #
            # Required with NO default. Absent means *undeclared* — a third
            # state, distinguishable from a declared `none`, and the reason the
            # key exists at all. Do not add a `default:` here: it would erase
            # the distinction the generator's census depends on.
            #
            # `optimistic` — writes require `If-Match`; the generated service
            # emits an ETag and rejects a stale write with 412.
            # `none` — deliberately unprotected. When the entity also exposes an
            # unsafe write (PUT/PATCH/DELETE) it owes a `reason`, which only the
            # object form can carry. That condition needs the entity's path
            # surface, which is not visible from inside this block, so the
            # required-`reason` check is generator-side; the kit's readable
            # nudge is `specfuse-xentity-concurrency-unprotected-needs-reason`
            # below.
            #
            # The string arm accepts `none` deliberately. The generator accepts
            # the bare scalar, and a closed guard that rejects a form the
            # generator accepts does not produce better specs — it fails lint on
            # a spec that generates fine, and the natural fix is to delete the
            # key. See authoring #47 and the note at the top of
            # Vendor_Extensions.md.
            #
            # `reason` is a CLOSED vocabulary as of generator 0.5.7
            # (FEAT-2026-0088/T07). It was an open string until then, with a
            # note to tighten it when the jar shipped the set — the jar has,
            # so this is that tightening. Free text is now INVALID_EXTENSION_VALUE
            # at parse time in the generator, so leaving the guard open would
            # pass lint and fail generation, which is the failure direction that
            # costs an author a whole edit cycle to diagnose.
            #
            # `not-assessed` is a status, not a justification: it records that
            # the contention question has not been answered yet, and it is what
            # lets a sweep complete without anyone inventing a reason. It is the
            # member the ERROR promotion (FEAT-2026-0092) refuses to pass.
            #
            # `other` is the sole escape hatch and the only member carrying
            # `reasonText`. Both directions are errors in the generator:
            # `other` without `reasonText`, and `reasonText` alongside any other
            # member. The `if/then/else` below mirrors that exactly.
            #
            # Deliberately NOT mirrored: the generator also accepts `reasonText`
            # with no `reason` at all (its check is `reason != null && reason !=
            # OTHER`). This guard accepts that shape too rather than tightening
            # past the jar — a guard must never reject what the generator
            # accepts. Reported upstream; tighten here once the jar does.
            #
            # `delegated` is the third mode, added in generator 0.8.0. It says
            # the entity carries no version of its own because its guarantee
            # comes from an ancestor's: the row is only ever written under that
            # ancestor's `If-Match`, so a second version column would be a
            # second thing to get wrong. `to` names the ancestor.
            #
            # Its constraints are all measured against the 0.8.0 jar, and each
            # one is an ERROR there:
            #   * `delegated` may NOT be authored as a bare string — the string
            #     arm below stays `optimistic | none` for exactly that reason
            #     ("delegated requires 'to' and cannot be authored as a bare
            #     string").
            #   * `to` is REQUIRED by `delegated` and FORBIDDEN by the other two
            #     ("x-entity.concurrency.to is only valid when mode: delegated").
            #   * `reason` and `reasonText` are FORBIDDEN alongside `delegated`
            #     — "the delegation itself is the justification". This is why
            #     the object arm splits in two below rather than adding one more
            #     `if/then` to the existing list: the three keys are mutually
            #     exclusive with `to`, and two arms say that once.
            #
            # Two generator checks are NOT mirrored here because neither is
            # visible from inside this block: `DELEGATION_TO_UNRESOLVABLE`
            # (ERROR — `to` names no schema carrying `x-entity`) needs the whole
            # document, and `TO_NOT_IN_BELONGS_TO` (WARNING — `to` is not in
            # this entity's `belongsTo`) needs the sibling key plus the same
            # resolution. The guard checks the shape; the generator checks the
            # target exists.
            concurrency:
              oneOf:
                - type: string
                  enum: ["optimistic","none"]
                - type: object
                  additionalProperties: false
                  required: ["mode"]
                  properties:
                    mode: { type: string, enum: ["optimistic","none"] }
                    reason:
                      type: string
                      enum: ["append-only","single-writer","reference-data","rare-write","not-assessed","other"]
                    reasonText: { type: string, minLength: 1 }
                  allOf:
                    - if:
                        required: ["reason"]
                        properties:
                          reason: { const: "other" }
                      then:
                        required: ["reasonText"]
                    - if:
                        required: ["reason","reasonText"]
                        properties:
                          reason: { not: { const: "other" } }
                      then: false
                - type: object
                  additionalProperties: false
                  required: ["mode","to"]
                  properties:
                    mode: { type: string, const: "delegated" }
                    # The ancestor whose version gates this entity's writes.
                    # PascalCase schema name, same spelling every other
                    # entity-naming key in this block uses.
                    to: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            # Delete semantics for the entity's OWN row (generator
            # FEAT-2026-0080, Vendor_Extensions.md §1.1). Absent resolves to
            # `hard`, the pre-FEAT-2026-0080 generator behaviour, so no
            # existing entity changes meaning by this key being added.
            #
            # `delete` is ALSO what decides the cascade — see the note on
            # `cascadeDelete` below, which is a phantom key. `hard` cascades to
            # the aggregate's descendants; `soft` stamps one row and leaves the
            # children live.
            #
            # Shorthand string form or long object form. `retention` is `none`
            # (keep forever) or an ISO-8601 duration, and is only meaningful
            # with `mode: soft`.
            #
            # Gate 1 is validation-only. The generator's DELETE_* rules check
            # coherence (soft requires a `deletedAt` string/date-time/nullable
            # property, hard forbids one, `deletedByUserId` implies soft), but
            # no stamping, column, or read filtering is emitted yet — that is
            # gate 2. Retention is declared-but-not-enforced until the cleanup
            # worker (FEAT-2026-0081) exists.
            delete:
              oneOf:
                - type: string
                  enum: ["hard","soft"]
                - type: object
                  additionalProperties: false
                  required: ["mode"]
                  properties:
                    mode: { type: string, enum: ["hard","soft"] }
                    # `none`, or an ISO-8601 duration with at least one
                    # component — a bare `P` is not a duration. The generator
                    # rule DELETE_RETENTION_INVALID is the authoritative check;
                    # this catches the malformed values at lint time.
                    retention:
                      type: string
                      pattern: "^(none|P(?=\\d|T\\d)(\\d+Y)?(\\d+M)?(\\d+W)?(\\d+D)?(T(?=\\d)(\\d+H)?(\\d+M)?(\\d+S)?)?)$"
                    # `reason` records WHY an entity is `hard` — added in
                    # generator 0.6.0. It matters because `hard` is also what an
                    # ABSENT declaration resolves to, so "deliberate" and
                    # "nobody decided" are otherwise indistinguishable.
                    #
                    # OPTIONAL here on purpose, and this is the same split
                    # `concurrency` already has: whether a project REQUIRES a
                    # reason is a project convention, not a universal contract.
                    # A soft-delete-only project wants it mandatory; a project
                    # where `delete` is rarely declared does not. Consumers that
                    # want it required add an overlay rule — see schemas/README
                    # §"What the project must provide".
                    #
                    # Kebab-case is the spelling the handbooks use. The
                    # generator lower-cases before matching, so SCREAMING_SNAKE
                    # also parses; the kit pins one spelling so a codebase does
                    # not drift between two.
                    reason:
                      type: string
                      enum: ["no-delete-surface", "reordered-rows", "patch-reconciled", "other"]
                    reasonText: { type: string, minLength: 1 }
                    # Whether an archived (soft-deleted) row is still readable
                    # through the generated read surface. Added in generator
                    # 0.8.0.
                    #
                    # Absent resolves to `restricted`, which is fail-closed:
                    # archived rows stay invisible. That default is why the key
                    # can be added without changing what any existing spec
                    # means, and why the generator nudges rather than errors on
                    # its absence (`ARCHIVE_VISIBILITY_UNDECLARED`, WARNING, on
                    # every soft entity that does not declare it).
                    #
                    #   operational  archived rows remain readable — the row is
                    #                withdrawn from normal use but still part of
                    #                the operational record
                    #   restricted   archived rows are filtered out of reads
                    #
                    # Only meaningful on `soft`: a hard-deleted row is never
                    # archived, so there is nothing for the key to govern. The
                    # generator makes that an ERROR
                    # (`ARCHIVE_VISIBILITY_ON_HARD_DELETE`) and the `if/then`
                    # below mirrors it — for the long form. The shorthand
                    # `delete: hard` and an absent `delete` also resolve to
                    # hard, but neither can carry the key in the first place, so
                    # the guard has nothing to check there.
                    archiveVisibility:
                      type: string
                      enum: ["operational", "restricted"]
                  allOf:
                    # `archiveVisibility` governs archived rows, which only
                    # `soft` produces. Mirrors ARCHIVE_VISIBILITY_ON_HARD_DELETE.
                    - if:
                        required: ["archiveVisibility"]
                      then:
                        properties: { mode: { const: "soft" } }
                    # `reasonText` is required by `other` and FORBIDDEN by every
                    # other value — both directions, mirroring
                    # DELETE_REASON_TEXT_REQUIRED, which fires on each. Same
                    # treatment `concurrency.reasonText` already gets, so this
                    # is the existing pattern applied to the sibling key rather
                    # than a new one.
                    - if:
                        properties: { reason: { const: "other" } }
                        required: ["reason"]
                      then:
                        required: ["reasonText"]
                      else:
                        not: { required: ["reasonText"] }
                    # `reason` explains a `hard` delete; on `soft` it is
                    # meaningless and the generator says so
                    # (DELETE_REASON_REQUIRES_HARD).
                    - if:
                        required: ["reason"]
                      then:
                        properties: { mode: { const: "hard" } }
            # PHANTOM KEYS — accepted here, read by NOTHING.
            #
            # Neither `cascadeDelete` nor `children` appears in the generator at
            # any version checked (compatibility.md §23, §30). A spec declaring
            # them lints clean, validates clean, and cascades nothing — the
            # failure mode `x-entity.delete` was introduced to fix.
            #
            # They stay ACCEPTED rather than being removed, on the standing rule
            # that retiring an extension is the generator's call and not the
            # kit's (follow-up 23's open ask, the `x-entity.schema` precedent).
            # Rejecting them here would turn a silently-inert declaration into a
            # lint error on specs that generate exactly as they do today — the
            # forbidden direction — and would do it for a key the generator has
            # not said it is dropping.
            #
            # The nudge is `specfuse-xentity-cascade-phantom` (WARN) below.
            # Accepting without warning is how a phantom key stays invisible;
            # warning without accepting is the bug that would replace it.
            #
            # What actually cascades: `delete: hard`, over the aggregate's
            # descendant set. `delete: soft` does not cascade at all.
            cascadeDelete: { type: string, enum: ["soft", "hard"] }
            children:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            # Per-property value-object storage configuration
            # (Vendor_Extensions.md §1.1 and §2). An empty object is valid and
            # means "inherit every default from the value object's
            # x-value-object block".
            valueObjects:
              type: object
              additionalProperties:
                type: object
                additionalProperties: false
                properties:
                  storage:
                    type: string
                    enum: ["collection_json", "single_json", "flatten", "serialized", "separate_table"]
                  queryable:
                    oneOf:
                      - type: boolean
                      - type: array
                        uniqueItems: true
                        items: { type: string }
                  indexHints:
                    type: array
                    uniqueItems: true
                    items: { type: string }
                  propertyPrefix: { type: string }
                  serializer: { type: string }
                  # Added in generator 0.6.0. `ValueObjectConfiguration` carries
                  # these alongside storage/queryable/serializer, so a value
                  # object classified or protected per-property lands here. The
                  # guard is `additionalProperties: false`, so omitting them
                  # made the 0.6.0 feature unadoptable — the failure mode the
                  # pin-bump vocabulary gate exists to catch.
                  classification:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                      type: string
                      enum: [pii, sensitive, confidential, exposed, financial, credential, cardholder, sad]
                  # Anchored at its first use in document order and aliased
                  # by `specfuse-xprotection-shape` below. One definition, two
                  # call sites — a YAML alias cannot drift the way two
                  # hand-maintained copies of a schema do.
                  protection: &xProtectionShape
                    type: object
                    additionalProperties: false
                    properties:
                      # ProtectionDefinition$AtRest. Matched case-insensitively
                      # by the generator (`toLowerCase` before `fromString`);
                      # BOTH separators are accepted for never-persist. The
                      # generator lower-cases and normalises before matching, so
                      # `never_persist` and `never-persist` reach it as the same
                      # value — measured against 0.7.0, same result on a value
                      # object and on an entity property. `extensions`, the
                      # command the kit tells consumers to derive a ruleset
                      # from, prints the HYPHEN form, so pinning the underscore
                      # made the kit reject the spelling its own published
                      # vocabulary advertises.
                      #
                      # `neverPersist` (camelCase) is still NOT accepted: the
                      # generator's normalisation collapses separators, not
                      # case boundaries.
                      #
                      # Widening this enum alone opens a hole — see
                      # specfuse-xprotection-never-persist-not-mapped, whose
                      # guard has to match both spellings or it silently stops
                      # covering one of them. The two changes belong together.
                      atRest:
                        type: string
                        enum: [none, encrypted, hashed, never_persist, never-persist]
                      # ProtectionDefinition$Mode. `deterministic` parses and is
                      # then refused by PROTECTION_MODE_UNSUPPORTED ("declared
                      # but unsupported in v1"), so it is accepted here and
                      # flagged by its own rule rather than rejected as a
                      # malformed value — the two are different findings and the
                      # author needs to be told which.
                      mode:
                        type: string
                        enum: [randomized, deterministic]
                      blindIndex:
                        type: object
                        additionalProperties: false
                        properties:
                          equality: { type: boolean }
                          prefix: { type: integer, minimum: 1 }
                          normalization:
                            type: array
                            uniqueItems: true
                            items: { type: string }
                          scope: { type: string, enum: [tenant, global] }
                      masking:
                        type: object
                        additionalProperties: false
                        properties:
                          first: { type: integer, minimum: 0 }
                          last: { type: integer, minimum: 0 }
                      unbounded: { type: boolean }
                      rationale: { type: string, minLength: 1 }
                      reviewedOn: { type: string, format: date }
                      reviewedBy: { type: string, minLength: 1 }
            # Write policy for the entity's rows after insert. Omitted means
            # `mutable`, so declaring nothing keeps the previous behaviour.
            #   mutable     rows are updated in place (the default)
            #   immutable   rows are never modified after insert (audit trails,
            #               ledger transactions)
            #   appendOnly  new rows are added, existing rows are never modified
            #               (event logs)
            # Consumed by specfuse-main-resource-has-updatedAt: a non-mutable
            # entity is exempt from the updatedAt requirement, because an
            # updatedAt on a row that never changes permanently equals createdAt
            # and asserts something untrue. See authoring issue #13.
            mutability: { type: string, enum: ["mutable","immutable","appendOnly"], default: "mutable" }
            hasMany:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            hasOne:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            belongsTo:
              oneOf:
                # Old syntax: simple array (deprecated but still supported)
                - type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                # New syntax: structured cardinality
                - type: object
                  additionalProperties: false
                  properties:
                    allOf:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    oneOf:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    oneOrMore:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    zeroOrMore:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    optional:
                      type: object
                      additionalProperties: false
                      properties:
                        oneOf:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        oneOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        zeroOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    optionalLinks:
                      type: object
                      additionalProperties: false
                      properties:
                        oneOf:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        oneOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        zeroOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            filterableProperties:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*$" }
            searchableProperties:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*$" }
            # Uniqueness constraints on the entity's rows, added in generator
            # 0.8.0 (FEAT-2026-0148). It replaces the deprecated `x-unique`,
            # which the kit never documented and which could not express a
            # composite key — the shape most real constraints turn out to have.
            #
            # A LIST of constraint objects, so an entity can carry several. Both
            # shapes below are measured against the 0.8.0 jar:
            #
            #   uniqueBy:
            #     - properties: [tenantId, code]      # composite
            #     - name: uq_customer_email           # named single-column
            #       properties: [email]
            #
            # `properties` is required and must not be empty ("element is
            # missing the required 'properties' key" / "'properties' list must
            # not be empty" — both ERRORs at parse time). `name` is optional but
            # must be a non-empty string when present.
            #
            # Each member must name a property of THIS schema, matched exactly:
            # the generator resolves the tuple and raises
            # `UNIQUE_BY_UNKNOWN_PROPERTY` otherwise. Dotted paths do not
            # resolve — `address.city` is reported as unknown, not walked — so
            # the pattern here is a single property name, unlike the dotted
            # `filterableProperties` above. That difference is the jar's, not a
            # transcription slip.
            #
            # NOT checked here, because neither is visible from one value:
            # `UNIQUE_BY_UNKNOWN_PROPERTY` needs the schema's property map, and
            # `UNIQUE_BY_DUPLICATE_INDEX_NAME` (ERROR — two constraints on one
            # entity sharing a `name`) needs a cross-element comparison JSON
            # Schema cannot express.
            #
            # `uniqueItems` on both levels is the house tightening every other
            # list in this block gets: the jar accepts a repeated member and
            # counts the tuple composite, which is a duplicated column in an
            # index rather than an intent anyone can state. An empty outer list
            # is accepted — it declares nothing, and the jar takes it silently.
            #
            # The constraint object is closed for the same reason. The jar
            # ignores an unknown member without a word, so closing it here is a
            # tightening — but the usual objection does not apply: the key is
            # new in 0.8.0, so no spec can already carry the shape this would
            # start rejecting, and a typo'd member on a constraint is otherwise
            # silent in both tools.
            uniqueBy:
              type: array
              uniqueItems: true
              items:
                type: object
                additionalProperties: false
                required: ["properties"]
                properties:
                  name: { type: string, minLength: 1 }
                  properties:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
            aiAccess:
              type: object
              additionalProperties: false
              required: [operations]
              properties:
                operations:
                  type: array
                  uniqueItems: true
                  # Empty array is the canonical Tier 0 declaration (deliberate
                  # no-AI-access). `reason` required when empty — enforced by the
                  # generator/DDD validator, not this structural shape rule.
                  items: { type: string, enum: [read, create, update, delete] }
                readableProperties:
                  type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*$" }
                writableProperties:
                  type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
                immutableOnUpdate:
                  type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
                ownedBy:
                  type: string
                  enum: [shared, ai, backend]
                  default: shared
                reason:
                  type: string
                  minLength: 1
              allOf:
                # When operations contains any write verb, writableProperties + reason are required
                - if:
                    properties:
                      operations:
                        contains: { enum: [create, update, delete] }
                    required: [operations]
                  then:
                    required: [writableProperties, reason]
                    properties:
                      writableProperties:
                        type: array
                        minItems: 1

  # An unprotected entity is a claim about who writes its rows, and it is the
  # one `concurrency` value that owes a justification. The shape guard above
  # accepts every form the generator accepts — blocking a form at lint time that
  # generates fine is how a guard stops an adoption instead of a bad spec — so
  # the nudge toward the object form lives here, where it can carry a message an
  # author can act on rather than a `oneOf` failure.
  #
  # WARNING, not ERROR, and unconditional rather than precise: the real rule is
  # "`none` AND the entity exposes an unsafe write", and the unsafe-write half
  # is not visible from inside the x-entity block. The generator owns the
  # precise check (FEAT-2026-0088). Over-firing here on a genuinely read-only
  # entity is the cost of catching it at authoring time; declaring the reason
  # anyway is never wrong.
  #
  # Deliberate — do not "fix" this by dropping `none` from the string arm of
  # specfuse-xentity-shape. See authoring #47.
  # `x-entity.schema` is deprecated: storage technology has been removed from
  # the spec, and a database schema name is deployment configuration rather
  # than a property of the domain model. The generator still reads it, so this
  # is a WARN and not an error — the shape guard accepts the key (see the note
  # there). Migrate to the project file and delete it from the spec.
  specfuse-xentity-schema-deprecated:
    description: "x-entity.schema is deprecated. A database schema name is deployment configuration, not part of the domain model — declare it in the project file as persistence.entities.<Entity>.schema on a `kind: relational` descriptor (Project_File.md §6.4), then remove this key. The generator still honours it for now."
    message: "{{description}}"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      field: schema
      function: undefined

  # Two rules, not one, so the ratchet counts them separately and so the
  # message can name the key the author actually wrote.
  specfuse-xentity-cascade-phantom:
    description: "x-entity.cascadeDelete is read by nothing — the generator has no cascade key, so declaring it cascades nothing while the spec says otherwise. Cascade follows x-entity.delete alone: `hard` cascades to the aggregate's descendants, `soft` does not cascade at all. Remove it, and if children must be archived with the parent that is application logic today. See API_Handbook.md §\"Cascade Deletion\" and compatibility.md §30."
    message: "{{description}}"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      field: cascadeDelete
      function: undefined

  specfuse-xentity-children-phantom:
    description: "x-entity.children is read by nothing — it named the reach of a cascade the generator does not implement. Aggregate membership is already declared by hasMany / hasOne / belongsTo, which the generator does read. Remove it. See API_Handbook.md §\"Cascade Deletion\" and compatibility.md §30."
    message: "{{description}}"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      field: children
      function: undefined

  specfuse-xentity-concurrency-unprotected-needs-reason:
    description: "x-entity.concurrency 'none' declares the entity deliberately unprotected against lost updates. Use the object form and record why: { mode: none, reason: <why no second writer can race> }. See Vendor_Extensions.md §1.1."
    message: "{{description}}"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-entity"].concurrency)]["x-entity"].concurrency
    then:
      function: schema
      functionOptions:
        schema:
          not:
            anyOf:
              # The bare scalar has nowhere to put a reason.
              - const: "none"
              # The object form, with the reason left out.
              - type: object
                required: ["mode"]
                properties:
                  mode: { const: "none" }
                not: { required: ["reason"] }

  specfuse-belongsto-explicit-cardinality:
    description: "belongsTo should use explicit cardinality (oneOf, allOf, oneOrMore, etc.) instead of simple array syntax for clarity"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-entity"].belongsTo)]["x-entity"].belongsTo
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          description: "Use structured cardinality (oneOf, allOf, optional, etc.) instead of array syntax"

  specfuse-belongsto-entity-validation:
    description: "Entities (type: entity) must have belongsTo defined to specify their aggregate context"
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              type: { const: "entity" }
            required: [type]
          then:
            required: [belongsTo]

  # ===== x-value-object validation =====
  specfuse-xvalueobject-shape:
    description: "x-value-object must follow the required shape."
    severity: error
    given: $.components.schemas[*]["x-value-object"]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          required: ["defaultStorage"]
          properties:
            defaultStorage:
              type: string
              enum: ["collection_json", "single_json", "flatten", "serialized", "separate_table"]
            defaultQueryable:
              oneOf:
                - type: boolean
                - type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
            defaultPropertyPrefix:
              type: string
              pattern: "^[a-z][A-Za-z0-9]*_?$"
            immutable:
              type: boolean
              default: true
            comparable:
              type: boolean
              default: true
            generateBuilder:
              type: boolean
              default: false
            validationRules:
              type: array
              items:
                type: object
                required: ["rule", "message"]
                properties:
                  rule: { type: string }
                  message: { type: string }
                  severity: { type: string, enum: ["error", "warning", "info"] }
            customSerializers:
              type: array
              uniqueItems: true
              items: { type: string }

  specfuse-xvalueobject-not-main-resource:
    description: "x-value-object should not be used on main resources (schemas with x-entity); value objects are embedded types."
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-value-object"])]
    then:
      function: falsy
      field: x-value-object

  specfuse-xvalueobject-no-xentity:
    description: "Schemas with x-value-object should not have x-entity; value objects are not entities."
    severity: error
    given: $.components.schemas[?(@ && @["x-value-object"] && @["x-entity"])]
    then:
      function: falsy
      field: x-entity

  # ===== Schema design rules =====
  specfuse-no-inline-enums:
    description: "Properties must not define inline enums; use $ref to separate enum schemas instead."
    severity: error
    # Unresolved: a property that $refs a standalone enum schema must not be
    # flagged; only genuinely authored inline enums should fire.
    resolved: false
    given: $.components.schemas[*].properties[?(@ && @.enum)]
    then:
      function: falsy

  specfuse-no-inline-objects:
    description: "Properties must not define inline objects; use $ref to separate object schemas instead."
    severity: error
    # Run against the UNRESOLVED doc so a property that $refs a standalone object
    # schema is not inlined-then-flagged; only genuinely authored inline objects fire.
    resolved: false
    given: $.components.schemas[*].properties[?(@ && @.type === 'object' && @.properties)]
    then:
      function: falsy

  specfuse-no-duplicate-enum-entries:
    description: "Enum values must not have duplicate entries."
    message: "{{error}}"
    severity: warn
    # Null-safe replacement for the built-in `duplicated-entry-in-enum`, which is
    # turned off above because its filter omits the leading `@ &&` guard and
    # therefore crashes the whole run on any null in the document.
    given: $..[?(@ && @property !== 'properties' && @.enum && @.enum.constructor.name === 'Array')]
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          uniqueItems: true

  # ===== Relationship classification and projection markers =====
  # Vendor_Extensions.md §1.7-1.9, API_Handbook.md §9.5.
  #
  # Since implicit `{Entity}Id` -> `belongsTo` inference was retired in 0.5.4, a
  # uuid property carries no relationship meaning on its own. These rules police
  # the shape of the explicit markers. Whether a given FK-shaped property was
  # classified AT ALL needs the entity graph and is generator-side —
  # see compatibility.md.

  specfuse-x-references-shape:
    description: "x-references must name a PascalCase entity, or the literal 'none' for a uuid that is not a foreign key."
    message: "x-references must be a PascalCase entity name or 'none'. See Vendor_Extensions.md §1.7."
    severity: error
    given: $.components.schemas[*].properties[*]["x-references"]
    then:
      function: pattern
      functionOptions:
        match: "^(none|[A-Z][A-Za-z0-9]*)$"

  specfuse-opaque-reference-justified:
    description: "x-references: none suppresses relationship classification, so it must carry a description saying why the uuid is not a foreign key."
    message: "x-references: none requires a description justifying why this uuid identifies no entity. Without one it is indistinguishable from an unclassified FK. See Vendor_Extensions.md §1.7."
    severity: error
    given: $.components.schemas[*].properties[?(@ && @["x-references"] === 'none')]
    then:
      field: description
      function: truthy

  specfuse-x-fk-for-shape:
    description: "x-fk-for must name a PascalCase entity; an owning FK always has a target, so 'none' is not valid."
    message: "x-fk-for must be a PascalCase entity name. See Vendor_Extensions.md §1.8."
    severity: error
    given: $.components.schemas[*].properties[*]["x-fk-for"]
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]*$"

  specfuse-fk-marker-exclusive:
    description: "x-references and x-fk-for declare opposite ownership and must not appear on the same property."
    message: "A property carries both x-references (association, NoAction) and x-fk-for (composition, Cascade). Pick one — they mean opposite things. See API_Handbook.md §9.5."
    severity: error
    given: $.components.schemas[*].properties[?(@ && @["x-references"] && @["x-fk-for"])]
    then:
      field: x-fk-for
      function: falsy

  specfuse-projection-coherence:
    description: "x-expand-of must name a sibling identifier property; x-projection must mark a non-required array of $ref."
    message: "{{error}}"
    severity: error
    # Unresolved: a collection projection is REQUIRED to be an array of $ref, so
    # linting the resolved document would inline the very $ref the rule checks
    # for and flag every correct projection. This is the resolution-sensitivity
    # trap described in schemas/README.md — the rule inspects schema shape, so it
    # must see the document as authored.
    resolved: false
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      function: openapiProjectionCoherence

  # Projections and relationship markers are read-only server-side concerns.
  # A client cannot write a projection, and a derivative DTO does not own the
  # relationship — so these markers have no meaning on New*/Update* shapes.
  specfuse-no-projection-markers-on-derivatives:
    description: "Projection markers must not appear on New{Resource} or Update{Resource} derivatives."
    message: "Projection markers are read-only and belong on the main resource, not on a request derivative. See Vendor_Extensions.md §1.9."
    severity: error
    given: $.components.schemas[?(@property.match("^(New|Update)[A-Z]"))].properties[*]
    then:
      field: x-projection
      function: falsy

  specfuse-no-expand-of-on-derivatives:
    description: "x-expand-of must not appear on New{Resource} or Update{Resource} derivatives."
    message: "x-expand-of is a read-only projection and belongs on the main resource, not on a request derivative. See Vendor_Extensions.md §1.9."
    severity: error
    given: $.components.schemas[?(@property.match("^(New|Update)[A-Z]"))].properties[*]
    then:
      field: x-expand-of
      function: falsy

  # ===== PATCH child-collection reconcile =====
  # API_Handbook.md §1.5.1. A collection present in a PATCH body is the complete
  # desired set; child-entity collections reconcile by identity. That contract
  # needs an optional `id` on the element DTO — without it the only fallback is
  # delete-then-add, which recreates rows with new PKs on every PATCH.
  #
  # WARN kit-side, matching the validate-time severity; the generator fails
  # closed at generation time rather than emitting the destructive fallback.
  specfuse-child-collection-reconcile-id:
    description: "An Update{Child} used as an array element inside an Update{Parent} must expose an optional 'id'."
    message: "{{error}}"
    severity: warn
    # Unresolved: the rule keys off `items.$ref` naming an Update* schema, and
    # resolution inlines the target and erases the name. See schemas/README.md.
    resolved: false
    given: $.components.schemas
    then:
      function: openapiChildCollectionReconcile

  # ===== HTTP response correctness =====
  specfuse-409-on-delete:
    description: "DELETE operations should define 409 for business rule conflicts."
    severity: warn
    given: $.paths[*].delete.responses
    then:
      field: "409"
      function: truthy

  specfuse-409-on-put-patch:
    description: "PUT/PATCH operations should define 409 for state transition and business rule conflicts."
    severity: warn
    given: $.paths[*][put,patch].responses
    then:
      field: "409"
      function: truthy

  specfuse-delete-204-no-body:
    description: "DELETE 204 response must not define response body content."
    severity: error
    given: $.paths[*].delete.responses.204
    then:
      field: content
      function: falsy

  specfuse-put-patch-no-204:
    description: "PUT/PATCH must return 200, never 204."
    severity: error
    given: $.paths[*][put,patch].responses
    then:
      field: "204"
      function: falsy

  # ===== Banned parameter names =====
  specfuse-no-q-param:
    description: "Use 'search' instead of 'q' for free-text search."
    severity: error
    given: $.paths[*][get,post,put,patch,delete].parameters[*]
    then:
      field: name
      function: pattern
      functionOptions:
        notMatch: "^q$"

  specfuse-no-sortby-sortorder:
    description: "Use 'sort' instead of 'sortBy' or 'sortOrder'."
    severity: error
    given: $.paths[*][get,post,put,patch,delete].parameters[*]
    then:
      field: name
      function: pattern
      functionOptions:
        notMatch: "^(sortBy|sortOrder)$"

  # ===== Main resource required fields =====
  specfuse-main-resource-has-id:
    description: "Main resources (schemas with x-entity) must have 'id' property."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      field: properties.id
      function: truthy

  specfuse-main-resource-has-createdAt:
    description: "Main resources (schemas with x-entity) must have 'createdAt' property."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      field: properties.createdAt
      function: truthy

  specfuse-main-resource-has-updatedAt:
    description: "Mutable main resources (schemas with x-entity) must have 'updatedAt' property."
    message: "Mutable entities must expose 'updatedAt'. If this entity's rows are never modified after insert, declare x-entity.mutability: immutable or appendOnly instead of adding the field."
    severity: error
    # Entities that declare a non-mutable write policy are exempt: an updatedAt
    # on a row that never changes permanently equals createdAt, so requiring it
    # makes the spec assert something untrue. `id` and `createdAt` stay required
    # for every entity regardless of write policy — only updatedAt is meaningless
    # for append-only and immutable rows.
    #
    # This is not an escape hatch. `mutability` is itself validated against a
    # closed set by specfuse-xentity-shape, so mislabelling a mutable entity to
    # dodge this rule is a visible, reviewable edit rather than a silent
    # suppression. See authoring issue #13.
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-entity"].mutability !== "immutable" && @["x-entity"].mutability !== "appendOnly")]
    then:
      field: properties.updatedAt
      function: truthy

  # ===== New{Resource} forbidden fields =====
  specfuse-new-resource-no-id:
    description: "New{Resource} (create) schemas must not include 'id' property."
    severity: error
    given: $.components.schemas[?(@property.match("^New[A-Z]"))].properties
    then:
      field: id
      function: falsy

  specfuse-new-resource-no-createdAt:
    description: "New{Resource} (create) schemas must not include 'createdAt' property."
    severity: error
    given: $.components.schemas[?(@property.match("^New[A-Z]"))].properties
    then:
      field: createdAt
      function: falsy

  specfuse-new-resource-no-updatedAt:
    description: "New{Resource} (create) schemas must not include 'updatedAt' property."
    severity: error
    given: $.components.schemas[?(@property.match("^New[A-Z]"))].properties
    then:
      field: updatedAt
      function: falsy

  # ===== x-sample data generation annotations =====
  # Validates x-sample vendor extension on OpenAPI schema properties.
  # Reference: handbooks/API_Handbook.md §10, handbooks/Vendor_Extensions.md §6.3,
  #            JSON Schema: schemas/arazzo-extensions/x-sample.schema.json

  # --- Group A: Structural validation ---

  specfuse-x-sample-valid-provider:
    description: "x-sample provider must be one of: faker, fixed, template."
    message: "x-sample provider '{{value}}' is not valid. Must be: faker, fixed, or template. See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample.provider
    then:
      function: enumeration
      functionOptions:
        values:
          - faker
          - fixed
          - template

  specfuse-x-sample-faker-requires-path:
    description: "x-sample with provider 'faker' must include a 'path' field."
    message: "x-sample with provider 'faker' is missing 'path'. Specify a faker method path (e.g., person.firstName). See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              provider: { const: "faker" }
            required: [provider]
          then:
            required: [path]

  specfuse-x-sample-no-unknown-fields:
    description: "x-sample must only contain known fields: provider, path, locale, format."
    message: "x-sample contains unknown fields. Only 'provider', 'path', 'locale', and 'format' are allowed. See Vendor Extensions §6.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          properties:
            provider: {}
            path: {}
            locale: {}
            format: {}

  specfuse-x-sample-fixed-requires-format:
    description: "x-sample with provider 'fixed' must include a 'format' field."
    message: "x-sample with provider 'fixed' is missing 'format'. Specify the literal value to use. See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              provider: { const: "fixed" }
            required: [provider]
          then:
            required: [format]

  specfuse-x-sample-template-requires-format:
    description: "x-sample with provider 'template' must include a 'format' field."
    message: "x-sample with provider 'template' is missing 'format'. Specify a template string with {{faker.path}} interpolation. See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              provider: { const: "template" }
            required: [provider]
          then:
            required: [format]

  # --- Group B: Placement validation ---

  specfuse-x-sample-no-server-generated:
    description: "x-sample must not be placed on server-generated properties (id, createdAt, updatedAt)."
    message: "x-sample is forbidden on server-generated properties. Remove x-sample from id, createdAt, or updatedAt. See API Handbook §10.2."
    severity: error
    given:
      - $.components.schemas[*].properties.id.x-sample
      - $.components.schemas[*].properties.createdAt.x-sample
      - $.components.schemas[*].properties.updatedAt.x-sample
    then:
      function: falsy

  specfuse-x-sample-property-level-only:
    description: "x-sample must be placed on individual properties, not on the schema itself."
    message: "x-sample found at schema level. Move x-sample to individual properties within the schema. See API Handbook §10.2."
    severity: error
    given: $.components.schemas[*].x-sample
    then:
      function: falsy

  # --- Group C: Content validation ---

  specfuse-x-sample-faker-path-format:
    description: "x-sample faker path should use dot-notation starting with a known category."
    message: "Faker path '{{value}}' does not start with a recognized category. Expected one of: person, internet, phone, location, company, date, string, lorem, number. See API Handbook §10.4."
    severity: warn
    given: $.components.schemas[*].properties[*].x-sample.path
    then:
      function: pattern
      functionOptions:
        match: "^(person|internet|phone|location|company|date|string|lorem|number)\\."

  # ===========================================================================
  # Service topology — info.x-services, holds, and Read{Entity}
  # ===========================================================================
  #
  # Handbook: Vendor_Extensions.md §14. Project file: Project_File.md §3.1
  # (`groups[].service`).
  #
  # PIN STATE — READ THIS BEFORE CHANGING A SEVERITY HERE.
  #
  # `info.x-services` is a generator vocabulary that kit 0.8.0's PINNED
  # GENERATOR (0.5.8) DOES NOT KNOW. It landed on generator `main` after 0.5.8
  # and ships in the next generator release. Verified against the pin:
  # `extensions --format json` on 0.5.8 reports `x-entity` keys only and no
  # `x-services`. So on 0.5.8 the key is inert — declaring it changes nothing
  # about generation, and these rules are the ONLY feedback an author gets.
  #
  # That is the shape of the `0.7.0` erratum (compatibility.md §18): a kit that
  # documents and lints a contract its own pinned jar does not implement. The
  # difference, and the reason these ship anyway, is direction. `0.7.0` accepted
  # a VALUE the pinned jar rejected, so following the handbook produced an ERROR
  # at generate time. Here the pinned jar has no opinion at all: it cannot
  # contradict these rules, and no existing spec declares `info.x-services` or a
  # `Read*` schema, so the blast radius on every spec that exists today is zero
  # — exactly as it is generator-side.
  #
  # Each rule below mirrors a generator finding id at the SAME severity. The
  # mapping is recorded per rule so the next pin bump can diff it rather than
  # re-derive it. Do not tighten past the jar; see compatibility.md §24.
  #
  # All of these are gated on a declaration. A spec with no `info.x-services`
  # and no `Read*` schema cannot trip any of them.

  specfuse-services-registry-shape:
    description: >-
      info.x-services must be a mapping of service name to metadata carrying `domains`.
      A bare sequence of service names carries no domains and so expresses nothing.
    # Generator: SERVICE_REGISTRY_UNREADABLE (WARNING on the whole-value shape),
    # SERVICE_ENTRY_UNREADABLE (ERROR, per malformed entry), SERVICE_DOMAINS_MISSING
    # (ERROR). Held at `error` here because a registry the author cannot see is
    # read is worse in an editor than in a build log, and every arm the WARNING
    # covers is a shape the schema function reports as one finding anyway.
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          minProperties: 1
          # Service names are kebab-case, matching the domain vocabulary they
          # own — `scheduling-service`, not `SchedulingService`.
          propertyNames:
            pattern: "^[a-z][a-z0-9-]*$"
          additionalProperties:
            type: object
            additionalProperties: false
            # `domains` is required with no default. A service entry declaring
            # no domains is a typo, not a decision — there is no sensible
            # reading of "a service that owns nothing".
            required: ["domains"]
            properties:
              domains:
                type: array
                minItems: 1
                items:
                  type: string
                  pattern: "^[a-z][a-z0-9-]*$"
              # Optional. A service that keeps no replicas omits it entirely.
              # Entity names, so PascalCase.
              holds:
                type: array
                minItems: 1
                items:
                  type: string
                  pattern: "^[A-Z][A-Za-z0-9]*$"

  specfuse-services-domain-single-owner:
    description: >-
      A domain must be claimed by exactly one service in info.x-services.
    # Generator: SERVICE_DOMAIN_DUPLICATE_OWNER (ERROR). This is the headline
    # check and the reason the registry lives in the spec rather than in
    # project.json — a per-repository project file can never see two services at
    # once, so it could never detect this.
    message: "{{error}}"
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: duplicateOwner

  specfuse-services-domain-registered:
    description: >-
      A domain claimed in info.x-services must be a member of info.x-domains.
    # Generator: SERVICE_DOMAIN_UNREGISTERED (ERROR). Skipped when x-domains is
    # absent — the two registries degrade independently, and an absent domain
    # registry is a separate finding, not 20 unregistered-domain findings.
    message: "{{error}}"
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: unregisteredDomain

  specfuse-services-holds-pairing:
    description: >-
      `holds: [X]` requires that X is an entity in this spec and that a ReadX schema exists.
    # Generator: SERVICE_HOLDS_UNKNOWN_ENTITY (ERROR), SERVICE_HOLDS_NO_READ_MODEL (ERROR).
    # This is the half of the two-halves rule authors get wrong most often:
    # declaring `holds` alone has nothing to generate.
    message: "{{error}}"
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: holds

  specfuse-read-model-unheld:
    description: >-
      A Read{Entity} schema that no service holds is authored and unused.
    # Generator: READ_MODEL_UNHELD (WARNING). The other half of the pairing:
    # publishing a Read{Entity} alone would make every group referencing that
    # entity legal, including one whose author never considered keeping a copy.
    # WARNING and not ERROR because authoring the owner's half first, before the
    # holder declares itself, is a legitimate order to work in.
    message: "{{error}}"
    severity: warn
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: unheld

  specfuse-read-model-primary-key:
    description: >-
      A Read{Entity} must carry its source's primary key ('id' or '{Entity}Id').
    # Generator: READ_MODEL_NO_PRIMARY_KEY (ERROR). Same key detection as the
    # jar: a property named `id` or `{Source}Id`, case-insensitively.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: primaryKey

  specfuse-read-model-nested-entity:
    description: >-
      A Read{Entity} must not embed another entity or a Basic* projection — flatten to the FK.
    # Generator: READ_MODEL_NESTED_ENTITY (ERROR). Enum- and value-object-typed
    # properties are fine and never trip this. `resolved: false` is load-bearing:
    # the check keys on the $ref NAME, which resolution erases.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: nested

  specfuse-read-model-not-a-wire-type:
    description: >-
      A Read{Entity} must not appear as a request body, a response, or a projection embed.
    # Generator: READ_MODEL_NOT_A_WIRE_TYPE (ERROR). A replica is a store shape.
    # This is the whole reason `Basic*` was not reused for it — `Basic*` carries
    # expandable refs and lives in the Api layer, and reusing it would weld a
    # consuming service's database table to another team's response DTO.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: wireType

  specfuse-read-model-source-delete:
    description: >-
      A Read{Entity}'s source must declare x-entity.delete, and a soft-delete source's
      replica must carry the deletion-state property.
    # Generator: READ_MODEL_SOURCE_DELETE_UNDECLARED (ERROR),
    # READ_MODEL_MISSING_DELETION_STATE (ERROR). One kit rule for two jar ids:
    # they are the same authoring question asked before and after the mode is
    # known, and splitting them would make the ratchet count a fix as a
    # regression when declaring `soft` moves a finding from one id to the other.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: sourceDelete

  # ===========================================================================
  # Data classification — x-classification
  # ===========================================================================
  #
  # Handbook: Vendor_Extensions.md §1.5.
  #
  # Unlike the service-topology group above, this vocabulary IS in the pinned
  # generator (0.5.8) — partially. The jar enforces PRESENCE
  # (`PII_CLASSIFICATION` / finding id `PII_FIELD_MISSING_CLASSIFICATION`, ERROR)
  # and the response-leak guard (`SENSITIVE_FIELD_IN_RESPONSE`, ERROR), and
  # `PiiClassificationValidationRule` states in its own comment that the VALUE is
  # "a structural concern handled by Spectral". The kit had never implemented
  # that half, so §1.5's documented value rules — the closed set, the `exposed`
  # contradiction, the `exposed` justification — were enforced by nothing on
  # either side.
  #
  # These rules are the missing half. They are `error` because each one either
  # mirrors a jar ERROR or covers a §1.5 rule the jar explicitly delegated;
  # none of them tightens past the jar on a surface the jar decides.

  specfuse-classification-values:
    description: >-
      x-classification must be a non-empty array drawn from [pii, sensitive,
      confidential, exposed, financial, credential, cardholder, sad].
    # Not scoped to x-entity schemas: a stray x-classification on a DTO or a
    # value object is still a typo worth naming, and the value set is the same
    # wherever it is written.
    #
    # WIDENED from four values to nine (authoring #76). The four-value set was
    # an ERROR against five tokens the vocabulary now carries, which is the one
    # direction a kit rule must never take (compatibility.md §18) — a consumer
    # writing `cardholder` got a false lint failure with no way past it but to
    # fork the ruleset.
    #
    # Safe against the PINNED jar, and the reason matters. 0.5.8 does not
    # reject the new tokens; it has no opinion on any of them —
    # `PiiClassificationValidationRule` knows only pii/sensitive/encrypted and
    # `validate` PASSES a spec declaring `cardholder`. So this widening cannot
    # contradict a jar position, on the same footing as the x-scopes grammar
    # (compatibility.md §28). It is NOT adopted because a newer jar validates
    # nine values — that jar (0.5.9-SNAPSHOT) is unreleased and unpinned.
    #
    # `encrypted` is GONE from the set as of the generator 0.7.0 pin, which is
    # the "released generator removes it" condition this comment used to wait
    # on. 0.7.0 rejects the token with INVALID_EXTENSION_VALUE at both the
    # property level and the x-value-object usage site, so a spec declaring it
    # now fails generation; the guard below is an error rather than a warning
    # so lint fails first, where the fix is cheap.
    severity: error
    given: $.components.schemas[*].properties[*]["x-classification"]
    then:
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - pii
              - sensitive
              - confidential
              - exposed
              - financial
              - credential
              - cardholder
              - sad

  # ===== x-protection (generator 0.6.0) ====================================
  #
  # 0.6.0 splits the single sensitivity list into two axes: `x-classification`
  # for WHAT the data is, `x-protection` for HOW it is handled. The generator
  # gates the second at ERROR with no grace period — a decision taken
  # deliberately (proposed for demotion and declined 2026-08-21) on the grounds
  # that a hard gate from day one beats retrofitting protection decisions onto
  # an authored spec.
  #
  # These rules exist so a consumer is told at LINT time rather than at GENERATE
  # time. Without them the kit is more permissive than the jar it distributes,
  # which is the same adoption-blocking shape as being stricter — a spec passes
  # the kit and then fails to generate, and the kit looks like the thing that
  # was wrong.

  specfuse-xprotection-shape:
    description: >-
      x-protection must follow the required shape.
    # Aliases the anchor defined at x-entity.valueObjects[*].protection above.
    # Mirrors UNKNOWN_PROTECTION_SUBKEY and INVALID_EXTENSION_VALUE.
    message: "{{error}}"
    severity: error
    given: $.components.schemas[*].properties[*]["x-protection"]
    then:
      function: schema
      functionOptions:
        schema: *xProtectionShape

  specfuse-xprotection-atrest-required:
    description: >-
      A property carrying x-classification must declare x-protection.atRest.
    # Mirrors PROTECTION_ATREST_REQUIRED (error). This is the rule that turns a
    # 0.6.0 pin into a red build on specs authored before it, and it is the
    # single highest-value one to have kit-side: the generator's message arrives
    # at generate time, this one arrives in the editor.
    message: "Property carries x-classification but declares no x-protection.atRest. Every classified property needs an at-rest decision; use `atRest: none` with a rationale to record a deliberate one."
    severity: error
    # Entity schemas only. The generator scopes it the same way — a plain DTO
    # carrying `x-classification` and no `x-protection` validates clean against
    # 0.6.0, so firing here would reject what the jar accepts. Measured, after
    # an over-broad first draft did exactly that on the fixture's NotAnEntity
    # control.
    given: $.components.schemas[?(@ && @["x-entity"])].properties[?(@ && @["x-classification"])]
    then:
      field: x-protection.atRest
      function: truthy

  specfuse-xprotection-none-requires-rationale:
    description: >-
      x-protection.atRest 'none' must carry a rationale.
    # Mirrors PROTECTION_NONE_REQUIRES_RATIONALE (error). `none` is the escape
    # hatch, and an unreviewed escape hatch is how a classified field quietly
    # ends up unprotected. The rationale is what makes it reviewable.
    message: "x-protection.atRest is 'none' with no rationale. Say why plaintext at rest is the right call for this property."
    severity: error
    given: $.components.schemas[*].properties[*]["x-protection"][?(@property === 'atRest' && @ === 'none')]^
    then:
      field: rationale
      function: truthy

  specfuse-xprotection-mode-deterministic-unsupported:
    description: >-
      x-protection.mode 'deterministic' is declared but unsupported.
    # Mirrors PROTECTION_MODE_UNSUPPORTED (error). The key parses, so the shape
    # guard above accepts it on purpose — rejecting it there would report a
    # malformed value, which is a different and misleading finding. This rule
    # says the true thing: the value is well-formed and the generator refuses it.
    message: "x-protection.mode 'deterministic' is unsupported in v1. Only 'randomized' is implemented; the generator errors on this at generate time."
    severity: error
    given: $.components.schemas[*].properties[*]["x-protection"]
    then:
      field: mode
      function: pattern
      functionOptions:
        notMatch: "^deterministic$"

  specfuse-xprotection-credential-write-only:
    description: >-
      x-classification 'credential' requires writeOnly or x-internal-only.
    # Mirrors PROTECTION_CREDENTIAL_REQUIRES_WRITE_ONLY (error). Decidable from
    # the property alone: the generator's "response-bound" test is exactly
    # `neither writeOnly nor x-internal-only`, not an operation-graph walk.
    message: "A 'credential' property must be writeOnly or x-internal-only. As authored it can be read back out of a response."
    severity: error
    given: $.components.schemas[*].properties[?(@ && @["x-classification"] && @["x-classification"].indexOf("credential") !== -1)]
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - { type: object, properties: { writeOnly: { const: true } }, required: [writeOnly] }
            - { type: object, properties: { x-internal-only: { const: true } }, required: [x-internal-only] }

  specfuse-xprotection-hashed-not-response-bound:
    description: >-
      x-protection.atRest 'hashed' requires writeOnly or x-internal-only.
    # Mirrors PROTECTION_HASHED_RESPONSE_BOUND (error). Same locality as above.
    # A digest can never be read back in plaintext, so serving one is either a
    # leak or a lie about what the field contains.
    message: "x-protection.atRest is 'hashed' but the property is response-bound. A digest can never be read back in plaintext — mark it writeOnly or x-internal-only."
    severity: error
    given: $.components.schemas[*].properties[?(@ && @["x-protection"] && @["x-protection"].atRest === "hashed")]
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - { type: object, properties: { writeOnly: { const: true } }, required: [writeOnly] }
            - { type: object, properties: { x-internal-only: { const: true } }, required: [x-internal-only] }

  specfuse-xprotection-sad-not-persisted:
    description: >-
      x-classification 'sad' must not appear on an x-entity property.
    # Mirrors PROTECTION_SAD_MAPPED (error). An x-entity property is mapped to a
    # persisted column by construction, and PCI-DSS forbids retaining sensitive
    # authentication data after authorisation. This one is worth having kit-side
    # even though the generator has it: the remedy is a modelling change (move
    # the field to a request DTO), which is far cheaper to hear while authoring.
    message: "'sad' (PCI sensitive authentication data) must never be stored, but x-entity properties are persisted by construction. Move it to a request DTO."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])].properties[*]["x-classification"]
    then:
      function: schema
      functionOptions:
        schema:
          # Guarded on `type: array`: a malformed scalar `x-classification: sad`
          # is `specfuse-classification-values`' finding, not this one. Without
          # the guard, `not: { contains }` is vacuously true on a non-array and
          # this rule piles a second, misleading error onto the same typo.
          if: { type: array }
          then:
            not: { contains: { const: sad } }

  specfuse-xprotection-never-persist-not-mapped:
    description: >-
      x-protection.atRest never-persist must not appear on an x-entity property.
    # Mirrors PROTECTION_NEVER_PERSIST_MAPPED (error). Same construction as
    # above: declaring never-persist on a column that is persisted by definition
    # is a contradiction the generator refuses to resolve silently.
    #
    # BOTH separators, and the guard has to say so explicitly. The enum above
    # accepts `never_persist` and `never-persist` because the generator
    # normalises them to one value; a `notMatch` anchored on the underscore
    # alone would therefore let the hyphen spelling through — a rule reporting
    # clean while covering nothing, on a "this must never be persisted" check.
    # Verified in both directions by the classification fixture.
    message: "x-protection.atRest is never-persist, but x-entity properties are mapped to a persisted column by construction. Move it to a request DTO."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])].properties[*]["x-protection"]
    then:
      field: atRest
      function: pattern
      functionOptions:
        notMatch: "^never[_-]persist$"

  specfuse-classification-encrypted-superseded:
    description: >-
      x-classification 'encrypted' is retired. Declare x-protection.atRest
      instead.
    # PROMOTED TO ERROR at the generator 0.7.0 pin, which is the condition the
    # previous revision of this comment named: land it "in the release that
    # pins a generator where FE-G02 (`encrypted` removed) and FE-G18
    # (SENSITIVE_FIELD_IN_RESPONSE accepting `atRest: encrypted`) ship
    # together". 0.7.0 ships both, which is what makes the migration safe to
    # advise rather than merely announce — the reason this sat at `warn` was
    # that a spec moving early lost the only declaration the shipped generator
    # read, and that is no longer true.
    #
    # The advice therefore INVERTS. It used to say "keep it for now"; it now
    # says migrate, because 0.7.0 rejects the token outright with
    # INVALID_EXTENSION_VALUE. Erroring here is the cheap failure: lint names
    # the property, generation names only the schema.
    #
    # The token is also gone from the closed enum above, so a spec declaring it
    # fails that guard too. Both fire deliberately — the enum says "not a
    # member", this rule says what to do instead, and only the latter carries
    # the replacement.
    message: "'encrypted' is retired as an x-classification value (generator 0.7.0). Declare 'x-protection: {atRest: encrypted}' on the property instead. See compatibility.md."
    severity: error
    given: $.components.schemas[*].properties[*]["x-classification"]
    then:
      function: schema
      functionOptions:
        schema:
          # Guarded on `type: array` via if/then, not asserted as `type: array`.
          # JSON Schema ignores `contains` on a non-array, so a bare
          # `not: {contains: ...}` is FALSE for a scalar -- this rule fired on
          # `x-classification: pii` (a malformed scalar, no `encrypted` in
          # sight) and told the author a token they never wrote was retired.
          # Tolerable noise while this was a warning; a blocking false message
          # now that it is an error. A malformed scalar belongs to
          # specfuse-classification-values, which already reports it.
          if:
            type: array
          then:
            not:
              contains:
                const: encrypted

  specfuse-classification-exposed-contradiction:
    description: >-
      x-classification 'exposed' must not co-occur with 'sensitive' or 'encrypted'.
    # Vendor_Extensions.md §1.5 rule 5, which names a finding id
    # (CLASSIFICATION_EXPOSED_CONTRADICTION) that exists in neither the kit nor
    # the jar. This rule is that finding.
    #
    # It matters more than a tidiness check: `exposed` is the escape hatch that
    # satisfies SENSITIVE_FIELD_IN_RESPONSE, so a property carrying both reads
    # as "must be masked" to one consumer and "safe to return" to another, and
    # the one that wins decides whether a secret reaches a response body.
    message: "{{error}}"
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      function: openapiClassification
      functionOptions:
        check: exposedContradiction

  specfuse-classification-exposed-needs-description:
    description: >-
      A property classified 'exposed' must carry a description justifying why exposure is safe.
    # Vendor_Extensions.md §1.5 rule 6. `exposed` asserts that a human reviewed
    # a secret-shaped name and found it safe; the description is the only place
    # that review is recorded. Without it the override is indistinguishable
    # from someone silencing a finding.
    message: "{{error}}"
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      function: openapiClassification
      functionOptions:
        check: exposedDescription

  specfuse-classification-pii-required:
    description: >-
      An entity property strongly indicative of PII must declare x-classification.
    # Mirrors the generator's PII_CLASSIFICATION rule (finding id
    # PII_FIELD_MISSING_CLASSIFICATION, ERROR) so the author sees it in the
    # editor rather than at generate time. Presence only — the jar accepts any
    # non-empty classification here, and a kit rule that demanded a particular
    # member would fail lint on specs that generate fine.
    #
    # The trigger list in openapiClassification.js is COPIED from the jar and
    # must be changed only in step with it. Widening it is the forbidden
    # direction; narrowing it silently drops coverage the jar has.
    message: "{{error}}"
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      function: openapiClassification
      functionOptions:
        check: piiRequired
