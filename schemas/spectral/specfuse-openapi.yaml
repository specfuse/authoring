# =============================================================================
# Specfuse OpenAPI Spectral Ruleset
# =============================================================================
# Enforces Specfuse conventions for OpenAPI 3.x specifications.
# Authoritative reference: handbooks/API_Handbook.md
#
# This ruleset validates the universal Specfuse conventions only. Value-set
# constraints that are project-defined (the closed role enum, the project
# domain list, project-specific URL path patterns) are NOT baked in here.
# Projects should extend this ruleset in their own .spectral.yaml and add the
# project-specific overlays. See schemas/README.md.
#
# Generalization notes for items lifted from the source project:
# - All rule IDs renamed from rm-* to specfuse-* (compatibility.md §1).
# - Closed role enum (the source project's closed role set) removed from
#   specfuse-auth-roles-allowed: rule now enforces the structural
#   PascalCase shape only. The project's overlay adds the closed value set.
# - Path-pattern exclusions that named source-specific suffixes (e.g.,
#   /dismiss, /access, /process, /errors on POST endpoints) were dropped:
#   the rule still distinguishes resource-creation paths from action paths
#   by the plural-noun heuristic. Projects with bespoke action verbs can
#   add their own exclusions via an overlay.
# - Illustrative event names in messages updated from source-project fixtures
#   to generic order/customer vocabulary (e.g., Order.Created) to match
#   examples/hello-orders/.
# =============================================================================

extends: "spectral:oas"
formats: [oas3]

functions:
  - openapiProjectionCoherence
  - openapiChildCollectionReconcile
  - openapiServiceRegistry
  - openapiReadModelShape

rules:

  # ===== Disabled / downgraded built-in rules =====
  operation-tag-defined: off

  # Upstream `spectral:oas` ships this rule with an unguarded recursive-descent
  # filter — `$..[?(@property !== 'properties' && @.enum && …)]` — with no `@ &&`
  # null check. Any null value anywhere in the document (a meaningful
  # `effectiveTo: null` in an example payload, a property-level `example: null`,
  # a null schema node) makes it throw
  #   Cannot read properties of null (reading 'enum')
  # which aborts the ENTIRE Spectral run: no findings are emitted, the process
  # exits 2, and any wrapper that only inspects the report reads it as a clean
  # pass. Reproduced against Spectral CLI 6.16.2 / nimma 0.7.2 with a 12-line
  # OpenAPI document. See authoring issue #14.
  #
  # Disabled here and replaced by the null-safe `specfuse-no-duplicate-enum-entries`
  # below, which keeps the coverage without the crash.
  duplicated-entry-in-enum: off

  # ===== Casing & naming =====
  specfuse-path-casing:
    description: "Paths must use camelCase segments (no hyphens/underscores); allow :operations and {params}."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        # Matches: /segment, /camelCase, /{param}, /segment:operation
        # Does NOT match: /kebab-case, /snake_case
        match: "^(/([a-z][a-zA-Z0-9]*|\\{[a-z][a-zA-Z0-9]*\\})(:[a-z][a-zA-Z0-9]*)?)+$"

  specfuse-schema-name-pascal:
    description: "Schema (model) names must be PascalCase."
    severity: error
    given: $.components.schemas[*]~
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]*$"

  specfuse-prop-camel:
    description: "Schema properties must be camelCase."
    severity: error
    given: $.components.schemas[*].properties[*]~
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][A-Za-z0-9]*$"

  specfuse-enum-camel:
    description: "Enum values must be camelCase (skipped when x-enum-case is declared)."
    severity: error
    given:
      - $.components.schemas[?(@ && !@["x-enum-case"] && @.enum)].enum[*]
    then:
      function: casing
      functionOptions:
        type: camel

  specfuse-xenumcase-shape:
    description: "x-enum-case must be one of the allowed formatting strategies."
    severity: error
    given: $.components.schemas[*]["x-enum-case"]
    then:
      function: enumeration
      functionOptions:
        values: ["preserve", "PascalCase", "camelCase", "snake_case", "kebab-case", "SCREAMING_SNAKE_CASE"]

  specfuse-xenumcase-on-enums-only:
    description: "x-enum-case must only be applied to schemas that define enum values."
    severity: error
    given: $.components.schemas[?(@ && @["x-enum-case"] && !@.enum)]
    then:
      function: falsy
      field: x-enum-case

  specfuse-single-tag:
    description: "Operations must have exactly one tag for clear API organization."
    severity: error
    given: $.paths[*][*].tags
    then:
      function: length
      functionOptions:
        min: 1
        max: 1

  # ===== Verbs & statuses =====
  specfuse-post-201-location:
    description: "Resource-creation POST must return 201 with Location header (operation paths ending in a plural noun)."
    # NOTE: The source project excluded source-specific action suffixes
    # (/dismiss, /access, /process, /errors). Those exclusions were dropped
    # during the generalization; projects with bespoke action endpoints can
    # add their own exclusions via an overlay rule.
    severity: error
    given: $.paths[?(@property.match("/[a-z][a-zA-Z]+s$") && !@property.match("/bulk/") && !@property.match("/_system/"))].post.responses
    then:
      - field: "201"
        function: truthy
      - field: "201.headers.Location"
        function: truthy

  specfuse-put-patch-200-complete:
    description: "PUT/PATCH must always return 200 with Location header and resource body."
    severity: error
    given: $.paths[*].[put,patch].responses
    then:
      - field: "200"
        function: truthy
      - field: "200.headers.Location"
        function: truthy
      - field: "200.content.application/json.schema"
        function: truthy

  specfuse-delete-204:
    description: "DELETE must return 204."
    severity: error
    given: $.paths[*].delete.responses
    then:
      field: "204"
      function: truthy

  specfuse-415-when-request-body:
    description: "Endpoints with requestBody should define 415."
    severity: warn
    given: $.paths[*][post,put,patch,delete][?(@ && @.requestBody)]
    then:
      field: responses.415
      function: truthy

  specfuse-406-when-alt-accept:
    description: "If multiple response media types are declared, include 406."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.responses && @.responses["200"] && @.responses["200"].content)]
    then:
      field: responses.406
      function: truthy

  # ===== Concurrency & ETags =====
  specfuse-etag-on-get:
    description: "GET of single mutable resources must document ETag response header (excludes list/collection endpoints)."
    severity: warn
    given: $.paths[?(@property.match("\\{[a-zA-Z]+\\}$") || @property.match("/current$") || @property.match("/settings$") || @property.match("/preferences$"))].get
    then:
      field: responses.200.headers.ETag
      function: defined

  specfuse-ifmatch-on-write:
    description: "PUT/PATCH/DELETE must accept If-Match and define 412."
    severity: error
    given: $.paths[*].[put,patch,delete]
    then:
      - field: parameters
        function: schema
        functionOptions:
          schema:
            type: array
            contains:
              type: object
              properties:
                name: { const: "If-Match" }
                in: { const: "header" }
      - field: responses.412
        function: truthy

  specfuse-428-on-write:
    description: "PUT/PATCH/DELETE must define 428 Precondition Required for missing If-Match."
    severity: warn
    given: $.paths[*].[put,patch,delete]
    then:
      field: responses.428
      function: truthy

  # ===== Predefined error responses (presence + correct $ref) =====
  specfuse-401-required:
    description: "Protected operations must declare 401."
    severity: error
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.security)]
    then:
      field: responses.401
      function: truthy

  specfuse-401-predefined:
    description: "Protected operations must use components.responses.UnauthorizedError for 401."
    severity: error
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.security)].responses.401
    then:
      field: $ref
      function: pattern
      functionOptions:
        match: "^#/components/responses/UnauthorizedError$"

  specfuse-403-required:
    description: "Protected operations must declare 403."
    severity: error
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.security)]
    then:
      field: responses.403
      function: truthy

  specfuse-403-predefined:
    description: "Protected operations must use components.responses.ForbiddenError for 403."
    severity: error
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.security)].responses.403
    then:
      field: $ref
      function: pattern
      functionOptions:
        match: "^#/components/responses/ForbiddenError$"

  specfuse-404-required:
    description: "Operations with {xxxId} path parameters must declare 404 Not Found."
    severity: error
    given: $.paths[?(@property.match("\\{[a-zA-Z0-9]+Id\\}"))][get,post,put,patch,delete]
    then:
      field: responses.404
      function: truthy

  specfuse-404-predefined:
    description: "Operations with {xxxId} path parameters must use components.responses.NotFoundError for 404."
    severity: error
    given: $.paths[?(@property.match("\\{[a-zA-Z0-9]+Id\\}"))][get,post,put,patch,delete].responses.404
    then:
      field: $ref
      function: pattern
      functionOptions:
        match: "^#/components/responses/NotFoundError$"

  specfuse-400-required:
    description: "Operations with requestBody must declare 400 Bad Request."
    severity: error
    given: $.paths[*][post,put,patch,delete][?(@ && @.requestBody)]
    then:
      field: responses.400
      function: truthy

  specfuse-400-predefined:
    description: "Operations with requestBody must use components.responses.BadRequestError for 400."
    severity: error
    given: $.paths[*][post,put,patch,delete][?(@ && @.requestBody)].responses.400
    then:
      field: $ref
      function: pattern
      functionOptions:
        match: "^#/components/responses/BadRequestError$"

  # ===== Pagination Consistency =====
  # NOTE: "If pagination params present -> response must be List" cannot be expressed in
  # Spectral's JSONPath (no wildcard inside filter). Covered directionally by the rule below.

  specfuse-list-response-requires-pagination-params:
    description: "If response is {Resource}List, all pagination parameters (page, pageSize, sort) must be present."
    severity: error
    given: $.paths[*].get[?(@ && @.responses && @.responses["200"])]
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              responses:
                properties:
                  "200":
                    properties:
                      content:
                        properties:
                          application/json:
                            properties:
                              schema:
                                properties:
                                  $ref:
                                    type: string
                                    pattern: "List$"
                                required: ["$ref"]
                            required: ["schema"]
                        required: ["application/json"]
                    required: ["content"]
                required: ["200"]
            required: ["responses"]
          then:
            properties:
              parameters:
                type: array
                allOf:
                  - contains:
                      type: object
                      properties: { name: { const: "page" } }
                      required: [name]
                  - contains:
                      type: object
                      properties: { name: { const: "pageSize" } }
                      required: [name]
                  - contains:
                      type: object
                      properties: { name: { const: "sort" } }
                      required: [name]
            required: ["parameters"]

  # ===== Security =====
  specfuse-global-bearer:
    description: "Global bearerAuth security scheme must be defined."
    severity: error
    given: $
    then:
      field: components.securitySchemes.bearerAuth
      function: truthy

  specfuse-protected-ops-require-security:
    description: "Operations should declare security explicitly even when global security is set, for clarity and code-gen."
    severity: hint
    given: $.paths[*][get,post,put,patch,delete]
    then:
      field: security
      function: defined

  # ===== Authorization metadata =====
  specfuse-auth-meta-present:
    description: "Secured operations must declare x-roles and x-scopes."
    severity: error
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.security)]
    then:
      - field: x-roles
        function: schema
        functionOptions:
          schema:
            type: array
            minItems: 1
            items:
              type: string
      - field: x-scopes
        function: schema
        functionOptions:
          schema:
            type: array
            minItems: 1
            items:
              type: string

  # GENERALIZATION: original rm-auth-roles-allowed pinned the values to the
  # source project's closed role set. Per compatibility.md #9 and the kit's stated
  # position, the role enum is project-defined. This kit-level rule now
  # enforces only the structural PascalCase identifier shape. Projects MUST
  # add their own overlay rule constraining x-roles values to the closed set
  # declared in their common/enums.yaml#/Role. See schemas/README.md.
  specfuse-auth-roles-pascal:
    description: "x-roles values must be PascalCase identifiers. The kit does not bake in the closed value-set — projects add an overlay rule that constrains values to their declared role enum."
    severity: error
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.security)]["x-roles"][*]
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]*$"

  specfuse-auth-scopes-pattern:
    description: "x-scopes values should be camelCase segments separated by dots (e.g., orders.read)."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete][?(@ && @.security)]["x-scopes"][*]
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]*(?:\\.[a-z][a-zA-Z0-9]*)*$"

  # ===== Event Emission (AsyncAPI Integration) =====

  specfuse-emits-required-on-writes:
    description: "POST/PUT/PATCH/DELETE operations must declare x-emits listing the events they publish."
    message: "Write operation '{{path}}' is missing x-emits. Declare the event(s) this operation publishes on success (see AsyncAPI Handbook §0.8)."
    severity: error
    given: $.paths[*].[post,put,patch,delete]
    then:
      field: x-emits
      function: truthy

  specfuse-emits-event-required:
    description: "Each x-emits entry must have an event field in {Entity}.{Action} format."
    message: "x-emits entry at '{{path}}' is missing 'event'."
    severity: error
    given: $.paths[*].[post,put,patch,delete].x-emits[*]
    then:
      field: event
      function: truthy

  specfuse-emits-event-format:
    description: "x-emits event must follow {Entity}.{Action} format (PascalCase dot-separated)."
    message: "x-emits event '{{value}}' must be in '{Entity}.{Action}' format (e.g., 'Order.Created')."
    severity: error
    given: $.paths[*].[post,put,patch,delete].x-emits[*].event
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]+\\.[A-Z][A-Za-z0-9]+$"

  # ===== AI Agent Integration (Phase 1: Core Foundations) =====
  specfuse-validate-only-on-writes:
    description: "POST/PUT/PATCH/DELETE operations must support validateOnly query parameter for AI agent integration."
    severity: error
    given: $.paths[*].[post,put,patch,delete]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              name: { const: "validateOnly" }
              in: { const: "query" }
              required: { const: false }
              schema:
                type: object
                properties:
                  type: { const: "boolean" }
                  default: { const: false }

  specfuse-idempotency-key-support:
    description: "POST operations should support Idempotency-Key header for retry safety."
    severity: warn
    given: $.paths[*].post
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              name: { const: "Idempotency-Key" }
              in: { const: "header" }
              required: { const: false }
              schema:
                type: object
                properties:
                  type: { const: "string" }
                  format: { const: "uuid" }

  specfuse-change-description-headers:
    description: "Write operations should support change tracking headers for audit trails."
    severity: hint
    given: $.paths[*].[post,put,patch,delete]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            anyOf:
              - properties:
                  name: { const: "X-Change-Reason" }
                  in: { const: "header" }
              - properties:
                  name: { const: "X-Agent-Id" }
                  in: { const: "header" }

  specfuse-conflict-response-details:
    description: "409 Conflict responses should include detailed conflict information for AI agents."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete].responses.409.content.application/json.schema
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            error: { }
            currentVersion: { type: string }
            conflictingFields:
              type: array
              items: { type: string }
            currentResource: { }

  # ===== Headers hygiene =====
  specfuse-401-www-authenticate:
    description: "401 should include WWW-Authenticate header."
    severity: hint
    given: $.paths[*][get,post,put,patch,delete].responses.401
    then:
      field: headers.WWW-Authenticate
      function: defined

  specfuse-405-allow:
    description: "405 must include Allow header."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete].responses.405
    then:
      field: headers.Allow
      function: truthy

  specfuse-ratelimit-headers:
    description: "200 responses on rate-limited routes should include RateLimit-* headers."
    severity: hint
    given: $.paths[*].get.responses.200.headers
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            RateLimit-Limit: {}
            RateLimit-Remaining: {}
            RateLimit-Reset: {}

  specfuse-retry-after-on-429-503:
    description: "429/503 must include Retry-After."
    severity: warn
    given: $.paths[*][get,post,put,patch,delete].responses[?(@property=='429' || @property=='503')]
    then:
      field: headers.Retry-After
      function: truthy

  # ===== Versioning / deprecations =====
  specfuse-api-version-header:
    description: "All successful responses should include API-Version header for client awareness and debugging."
    severity: hint
    given: $.paths[*][get,post,put,patch,delete].responses[?(@property.match("^2\\d\\d$"))].headers
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            API-Version:
              type: object
              properties:
                schema:
                  type: object
                  properties:
                    type: { const: "string" }

  # ===== Phase #1 naming suffixes =====
  specfuse-resource-naming-convention:
    description: "Resource-related schemas must follow naming: {Resource}, Basic{Resource}, New{Resource}, Update{Resource}, {Resource}List, {Resource}SearchRequest."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"] || @property.match("^(Basic|New|Update)[A-Z]") || @property.match("[A-Z][a-zA-Z0-9]*(List|SearchRequest)$"))]~
    then:
      function: pattern
      functionOptions:
        match: "^([A-Z][A-Za-z0-9]*|Basic[A-Z][A-Za-z0-9]*|New[A-Z][A-Za-z0-9]*|Update[A-Z][A-Za-z0-9]*|[A-Z][A-Za-z0-9]*List|[A-Z][A-Za-z0-9]*SearchRequest)$"

  specfuse-deprecated-suffixes:
    description: "Avoid deprecated suffixes like Ref, Summary in schema names."
    severity: warn
    given: $.components.schemas[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "Ref$|Summary$"

  # ===== x-entity placement & shape =====
  specfuse-xentity-main-only:
    description: "x-entity must not appear on derivative schemas (Basic*, New*, Update*, *List, *SearchRequest)."
    severity: error
    given: $.components.schemas[?(@ && (@property.match("^(Basic|New|Update)[A-Z]") || @property.match("[A-Z][a-zA-Z0-9]*(List|SearchRequest)$")) && @["x-entity"])]
    then:
      function: falsy
      field: x-entity

  specfuse-xentity-shape:
    description: "x-entity must follow the required shape."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          required: ["domain", "type"]
          properties:
            domain: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
            type: { type: string, enum: ["entity","aggregate"] }
            requiresPagination: { type: boolean, default: true }
            # DEPRECATED, and accepted here for exactly that reason.
            #
            # The generator still parses `schema` (EntityDefinition carries the
            # field and lists it in KNOWN_SUB_KEYS, verified against the pinned
            # 0.5.7 jar), so this guard must accept it — see the note below on
            # `concurrency` for why a closed guard must never reject a form the
            # generator accepts.
            #
            # It is on its way out: database schema names belong in the project
            # file, as `persistence.entities.<Entity>.schema` on a `relational`
            # descriptor (Project_File.md §6.4, §6.8). Deprecation means migrate
            # at your own pace; an ERROR here would have meant migrate now or
            # stop linting, which is not what the generator is telling you.
            # The nudge is `specfuse-xentity-schema-deprecated` (WARN) below.
            schema: { type: string }
            # Lost-update protection for the entity's rows (generator
            # FEAT-2026-0078 / FEAT-2026-0088, Vendor_Extensions.md §1.1).
            #
            # Required with NO default. Absent means *undeclared* — a third
            # state, distinguishable from a declared `none`, and the reason the
            # key exists at all. Do not add a `default:` here: it would erase
            # the distinction the generator's census depends on.
            #
            # `optimistic` — writes require `If-Match`; the generated service
            # emits an ETag and rejects a stale write with 412.
            # `none` — deliberately unprotected. When the entity also exposes an
            # unsafe write (PUT/PATCH/DELETE) it owes a `reason`, which only the
            # object form can carry. That condition needs the entity's path
            # surface, which is not visible from inside this block, so the
            # required-`reason` check is generator-side; the kit's readable
            # nudge is `specfuse-xentity-concurrency-unprotected-needs-reason`
            # below.
            #
            # The string arm accepts `none` deliberately. The generator accepts
            # the bare scalar, and a closed guard that rejects a form the
            # generator accepts does not produce better specs — it fails lint on
            # a spec that generates fine, and the natural fix is to delete the
            # key. See authoring #47 and the note at the top of
            # Vendor_Extensions.md.
            #
            # `reason` is a CLOSED vocabulary as of generator 0.5.7
            # (FEAT-2026-0088/T07). It was an open string until then, with a
            # note to tighten it when the jar shipped the set — the jar has,
            # so this is that tightening. Free text is now INVALID_EXTENSION_VALUE
            # at parse time in the generator, so leaving the guard open would
            # pass lint and fail generation, which is the failure direction that
            # costs an author a whole edit cycle to diagnose.
            #
            # `not-assessed` is a status, not a justification: it records that
            # the contention question has not been answered yet, and it is what
            # lets a sweep complete without anyone inventing a reason. It is the
            # member the ERROR promotion (FEAT-2026-0092) refuses to pass.
            #
            # `other` is the sole escape hatch and the only member carrying
            # `reasonText`. Both directions are errors in the generator:
            # `other` without `reasonText`, and `reasonText` alongside any other
            # member. The `if/then/else` below mirrors that exactly.
            #
            # Deliberately NOT mirrored: the generator also accepts `reasonText`
            # with no `reason` at all (its check is `reason != null && reason !=
            # OTHER`). This guard accepts that shape too rather than tightening
            # past the jar — a guard must never reject what the generator
            # accepts. Reported upstream; tighten here once the jar does.
            concurrency:
              oneOf:
                - type: string
                  enum: ["optimistic","none"]
                - type: object
                  additionalProperties: false
                  required: ["mode"]
                  properties:
                    mode: { type: string, enum: ["optimistic","none"] }
                    reason:
                      type: string
                      enum: ["append-only","single-writer","reference-data","rare-write","not-assessed","other"]
                    reasonText: { type: string, minLength: 1 }
                  allOf:
                    - if:
                        required: ["reason"]
                        properties:
                          reason: { const: "other" }
                      then:
                        required: ["reasonText"]
                    - if:
                        required: ["reason","reasonText"]
                        properties:
                          reason: { not: { const: "other" } }
                      then: false
            # Delete semantics for the entity's OWN row (generator
            # FEAT-2026-0080, Vendor_Extensions.md §1.1). Absent resolves to
            # `hard`, the pre-FEAT-2026-0080 generator behaviour, so no
            # existing entity changes meaning by this key being added.
            #
            # Distinct from `cascadeDelete` below, which declares what happens
            # to the entity's CHILDREN. An aggregate may legitimately carry
            # both; they answer different questions and are not required to
            # agree.
            #
            # Shorthand string form or long object form. `retention` is `none`
            # (keep forever) or an ISO-8601 duration, and is only meaningful
            # with `mode: soft`.
            #
            # Gate 1 is validation-only. The generator's DELETE_* rules check
            # coherence (soft requires a `deletedAt` string/date-time/nullable
            # property, hard forbids one, `deletedByUserId` implies soft), but
            # no stamping, column, or read filtering is emitted yet — that is
            # gate 2. Retention is declared-but-not-enforced until the cleanup
            # worker (FEAT-2026-0081) exists.
            delete:
              oneOf:
                - type: string
                  enum: ["hard","soft"]
                - type: object
                  additionalProperties: false
                  required: ["mode"]
                  properties:
                    mode: { type: string, enum: ["hard","soft"] }
                    # `none`, or an ISO-8601 duration with at least one
                    # component — a bare `P` is not a duration. The generator
                    # rule DELETE_RETENTION_INVALID is the authoritative check;
                    # this catches the malformed values at lint time.
                    retention:
                      type: string
                      pattern: "^(none|P(?=\\d|T\\d)(\\d+Y)?(\\d+M)?(\\d+W)?(\\d+D)?(T(?=\\d)(\\d+H)?(\\d+M)?(\\d+S)?)?)$"
            # Cascade policy on delete (API_Handbook.md §"Cascade Deletion").
            # `children` names the entities the cascade reaches. Scopes the
            # entity's CHILDREN — see `delete` above for the entity's own row.
            cascadeDelete: { type: string, enum: ["soft", "hard"] }
            children:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            # Per-property value-object storage configuration
            # (Vendor_Extensions.md §1.1 and §2). An empty object is valid and
            # means "inherit every default from the value object's
            # x-value-object block".
            valueObjects:
              type: object
              additionalProperties:
                type: object
                additionalProperties: false
                properties:
                  storage:
                    type: string
                    enum: ["collection_json", "single_json", "flatten", "serialized", "separate_table"]
                  queryable:
                    oneOf:
                      - type: boolean
                      - type: array
                        uniqueItems: true
                        items: { type: string }
                  indexHints:
                    type: array
                    uniqueItems: true
                    items: { type: string }
                  propertyPrefix: { type: string }
                  serializer: { type: string }
            # Write policy for the entity's rows after insert. Omitted means
            # `mutable`, so declaring nothing keeps the previous behaviour.
            #   mutable     rows are updated in place (the default)
            #   immutable   rows are never modified after insert (audit trails,
            #               ledger transactions)
            #   appendOnly  new rows are added, existing rows are never modified
            #               (event logs)
            # Consumed by specfuse-main-resource-has-updatedAt: a non-mutable
            # entity is exempt from the updatedAt requirement, because an
            # updatedAt on a row that never changes permanently equals createdAt
            # and asserts something untrue. See authoring issue #13.
            mutability: { type: string, enum: ["mutable","immutable","appendOnly"], default: "mutable" }
            hasMany:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            hasOne:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            belongsTo:
              oneOf:
                # Old syntax: simple array (deprecated but still supported)
                - type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                # New syntax: structured cardinality
                - type: object
                  additionalProperties: false
                  properties:
                    allOf:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    oneOf:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    oneOrMore:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    zeroOrMore:
                      type: array
                      uniqueItems: true
                      items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    optional:
                      type: object
                      additionalProperties: false
                      properties:
                        oneOf:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        oneOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        zeroOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                    optionalLinks:
                      type: object
                      additionalProperties: false
                      properties:
                        oneOf:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        oneOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                        zeroOrMore:
                          type: array
                          uniqueItems: true
                          items: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
            filterableProperties:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*$" }
            searchableProperties:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*$" }
            encryptedProperties:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
            aiAccess:
              type: object
              additionalProperties: false
              required: [operations]
              properties:
                operations:
                  type: array
                  uniqueItems: true
                  # Empty array is the canonical Tier 0 declaration (deliberate
                  # no-AI-access). `reason` required when empty — enforced by the
                  # generator/DDD validator, not this structural shape rule.
                  items: { type: string, enum: [read, create, update, delete] }
                readableProperties:
                  type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*$" }
                writableProperties:
                  type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
                immutableOnUpdate:
                  type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
                ownedBy:
                  type: string
                  enum: [shared, ai, backend]
                  default: shared
                reason:
                  type: string
                  minLength: 1
              allOf:
                # When operations contains any write verb, writableProperties + reason are required
                - if:
                    properties:
                      operations:
                        contains: { enum: [create, update, delete] }
                    required: [operations]
                  then:
                    required: [writableProperties, reason]
                    properties:
                      writableProperties:
                        type: array
                        minItems: 1

  # An unprotected entity is a claim about who writes its rows, and it is the
  # one `concurrency` value that owes a justification. The shape guard above
  # accepts every form the generator accepts — blocking a form at lint time that
  # generates fine is how a guard stops an adoption instead of a bad spec — so
  # the nudge toward the object form lives here, where it can carry a message an
  # author can act on rather than a `oneOf` failure.
  #
  # WARNING, not ERROR, and unconditional rather than precise: the real rule is
  # "`none` AND the entity exposes an unsafe write", and the unsafe-write half
  # is not visible from inside the x-entity block. The generator owns the
  # precise check (FEAT-2026-0088). Over-firing here on a genuinely read-only
  # entity is the cost of catching it at authoring time; declaring the reason
  # anyway is never wrong.
  #
  # Deliberate — do not "fix" this by dropping `none` from the string arm of
  # specfuse-xentity-shape. See authoring #47.
  # `x-entity.schema` is deprecated: storage technology has been removed from
  # the spec, and a database schema name is deployment configuration rather
  # than a property of the domain model. The generator still reads it, so this
  # is a WARN and not an error — the shape guard accepts the key (see the note
  # there). Migrate to the project file and delete it from the spec.
  specfuse-xentity-schema-deprecated:
    description: "x-entity.schema is deprecated. A database schema name is deployment configuration, not part of the domain model — declare it in the project file as persistence.entities.<Entity>.schema on a `kind: relational` descriptor (Project_File.md §6.4), then remove this key. The generator still honours it for now."
    message: "{{description}}"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      field: schema
      function: undefined

  specfuse-xentity-concurrency-unprotected-needs-reason:
    description: "x-entity.concurrency 'none' declares the entity deliberately unprotected against lost updates. Use the object form and record why: { mode: none, reason: <why no second writer can race> }. See Vendor_Extensions.md §1.1."
    message: "{{description}}"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-entity"].concurrency)]["x-entity"].concurrency
    then:
      function: schema
      functionOptions:
        schema:
          not:
            anyOf:
              # The bare scalar has nowhere to put a reason.
              - const: "none"
              # The object form, with the reason left out.
              - type: object
                required: ["mode"]
                properties:
                  mode: { const: "none" }
                not: { required: ["reason"] }

  specfuse-belongsto-explicit-cardinality:
    description: "belongsTo should use explicit cardinality (oneOf, allOf, oneOrMore, etc.) instead of simple array syntax for clarity"
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-entity"].belongsTo)]["x-entity"].belongsTo
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          description: "Use structured cardinality (oneOf, allOf, optional, etc.) instead of array syntax"

  specfuse-belongsto-entity-validation:
    description: "Entities (type: entity) must have belongsTo defined to specify their aggregate context"
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]["x-entity"]
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              type: { const: "entity" }
            required: [type]
          then:
            required: [belongsTo]

  # ===== x-value-object validation =====
  specfuse-xvalueobject-shape:
    description: "x-value-object must follow the required shape."
    severity: error
    given: $.components.schemas[*]["x-value-object"]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          required: ["defaultStorage"]
          properties:
            defaultStorage:
              type: string
              enum: ["collection_json", "single_json", "flatten", "serialized", "separate_table"]
            defaultQueryable:
              oneOf:
                - type: boolean
                - type: array
                  uniqueItems: true
                  items: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
            defaultPropertyPrefix:
              type: string
              pattern: "^[a-z][A-Za-z0-9]*_?$"
            immutable:
              type: boolean
              default: true
            comparable:
              type: boolean
              default: true
            generateBuilder:
              type: boolean
              default: false
            validationRules:
              type: array
              items:
                type: object
                required: ["rule", "message"]
                properties:
                  rule: { type: string }
                  message: { type: string }
                  severity: { type: string, enum: ["error", "warning", "info"] }
            customSerializers:
              type: array
              uniqueItems: true
              items: { type: string }

  specfuse-xvalueobject-not-main-resource:
    description: "x-value-object should not be used on main resources (schemas with x-entity); value objects are embedded types."
    severity: warn
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-value-object"])]
    then:
      function: falsy
      field: x-value-object

  specfuse-xvalueobject-no-xentity:
    description: "Schemas with x-value-object should not have x-entity; value objects are not entities."
    severity: error
    given: $.components.schemas[?(@ && @["x-value-object"] && @["x-entity"])]
    then:
      function: falsy
      field: x-entity

  # ===== Schema design rules =====
  specfuse-no-inline-enums:
    description: "Properties must not define inline enums; use $ref to separate enum schemas instead."
    severity: error
    # Unresolved: a property that $refs a standalone enum schema must not be
    # flagged; only genuinely authored inline enums should fire.
    resolved: false
    given: $.components.schemas[*].properties[?(@ && @.enum)]
    then:
      function: falsy

  specfuse-no-inline-objects:
    description: "Properties must not define inline objects; use $ref to separate object schemas instead."
    severity: error
    # Run against the UNRESOLVED doc so a property that $refs a standalone object
    # schema is not inlined-then-flagged; only genuinely authored inline objects fire.
    resolved: false
    given: $.components.schemas[*].properties[?(@ && @.type === 'object' && @.properties)]
    then:
      function: falsy

  specfuse-no-duplicate-enum-entries:
    description: "Enum values must not have duplicate entries."
    message: "{{error}}"
    severity: warn
    # Null-safe replacement for the built-in `duplicated-entry-in-enum`, which is
    # turned off above because its filter omits the leading `@ &&` guard and
    # therefore crashes the whole run on any null in the document.
    given: $..[?(@ && @property !== 'properties' && @.enum && @.enum.constructor.name === 'Array')]
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          uniqueItems: true

  # ===== Relationship classification and projection markers =====
  # Vendor_Extensions.md §1.7-1.9, API_Handbook.md §9.5.
  #
  # Since implicit `{Entity}Id` -> `belongsTo` inference was retired in 0.5.4, a
  # uuid property carries no relationship meaning on its own. These rules police
  # the shape of the explicit markers. Whether a given FK-shaped property was
  # classified AT ALL needs the entity graph and is generator-side —
  # see compatibility.md.

  specfuse-x-references-shape:
    description: "x-references must name a PascalCase entity, or the literal 'none' for a uuid that is not a foreign key."
    message: "x-references must be a PascalCase entity name or 'none'. See Vendor_Extensions.md §1.7."
    severity: error
    given: $.components.schemas[*].properties[*]["x-references"]
    then:
      function: pattern
      functionOptions:
        match: "^(none|[A-Z][A-Za-z0-9]*)$"

  specfuse-opaque-reference-justified:
    description: "x-references: none suppresses relationship classification, so it must carry a description saying why the uuid is not a foreign key."
    message: "x-references: none requires a description justifying why this uuid identifies no entity. Without one it is indistinguishable from an unclassified FK. See Vendor_Extensions.md §1.7."
    severity: error
    given: $.components.schemas[*].properties[?(@ && @["x-references"] === 'none')]
    then:
      field: description
      function: truthy

  specfuse-x-fk-for-shape:
    description: "x-fk-for must name a PascalCase entity; an owning FK always has a target, so 'none' is not valid."
    message: "x-fk-for must be a PascalCase entity name. See Vendor_Extensions.md §1.8."
    severity: error
    given: $.components.schemas[*].properties[*]["x-fk-for"]
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]*$"

  specfuse-fk-marker-exclusive:
    description: "x-references and x-fk-for declare opposite ownership and must not appear on the same property."
    message: "A property carries both x-references (association, NoAction) and x-fk-for (composition, Cascade). Pick one — they mean opposite things. See API_Handbook.md §9.5."
    severity: error
    given: $.components.schemas[*].properties[?(@ && @["x-references"] && @["x-fk-for"])]
    then:
      field: x-fk-for
      function: falsy

  specfuse-projection-coherence:
    description: "x-expand-of must name a sibling identifier property; x-projection must mark a non-required array of $ref."
    message: "{{error}}"
    severity: error
    # Unresolved: a collection projection is REQUIRED to be an array of $ref, so
    # linting the resolved document would inline the very $ref the rule checks
    # for and flag every correct projection. This is the resolution-sensitivity
    # trap described in schemas/README.md — the rule inspects schema shape, so it
    # must see the document as authored.
    resolved: false
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      function: openapiProjectionCoherence

  # Projections and relationship markers are read-only server-side concerns.
  # A client cannot write a projection, and a derivative DTO does not own the
  # relationship — so these markers have no meaning on New*/Update* shapes.
  specfuse-no-projection-markers-on-derivatives:
    description: "Projection markers must not appear on New{Resource} or Update{Resource} derivatives."
    message: "Projection markers are read-only and belong on the main resource, not on a request derivative. See Vendor_Extensions.md §1.9."
    severity: error
    given: $.components.schemas[?(@property.match("^(New|Update)[A-Z]"))].properties[*]
    then:
      field: x-projection
      function: falsy

  specfuse-no-expand-of-on-derivatives:
    description: "x-expand-of must not appear on New{Resource} or Update{Resource} derivatives."
    message: "x-expand-of is a read-only projection and belongs on the main resource, not on a request derivative. See Vendor_Extensions.md §1.9."
    severity: error
    given: $.components.schemas[?(@property.match("^(New|Update)[A-Z]"))].properties[*]
    then:
      field: x-expand-of
      function: falsy

  # ===== PATCH child-collection reconcile =====
  # API_Handbook.md §1.5.1. A collection present in a PATCH body is the complete
  # desired set; child-entity collections reconcile by identity. That contract
  # needs an optional `id` on the element DTO — without it the only fallback is
  # delete-then-add, which recreates rows with new PKs on every PATCH.
  #
  # WARN kit-side, matching the validate-time severity; the generator fails
  # closed at generation time rather than emitting the destructive fallback.
  specfuse-child-collection-reconcile-id:
    description: "An Update{Child} used as an array element inside an Update{Parent} must expose an optional 'id'."
    message: "{{error}}"
    severity: warn
    # Unresolved: the rule keys off `items.$ref` naming an Update* schema, and
    # resolution inlines the target and erases the name. See schemas/README.md.
    resolved: false
    given: $.components.schemas
    then:
      function: openapiChildCollectionReconcile

  # ===== HTTP response correctness =====
  specfuse-409-on-delete:
    description: "DELETE operations should define 409 for business rule conflicts."
    severity: warn
    given: $.paths[*].delete.responses
    then:
      field: "409"
      function: truthy

  specfuse-409-on-put-patch:
    description: "PUT/PATCH operations should define 409 for state transition and business rule conflicts."
    severity: warn
    given: $.paths[*].[put,patch].responses
    then:
      field: "409"
      function: truthy

  specfuse-delete-204-no-body:
    description: "DELETE 204 response must not define response body content."
    severity: error
    given: $.paths[*].delete.responses.204
    then:
      field: content
      function: falsy

  specfuse-put-patch-no-204:
    description: "PUT/PATCH must return 200, never 204."
    severity: error
    given: $.paths[*].[put,patch].responses
    then:
      field: "204"
      function: falsy

  # ===== Banned parameter names =====
  specfuse-no-q-param:
    description: "Use 'search' instead of 'q' for free-text search."
    severity: error
    given: $.paths[*][get,post,put,patch,delete].parameters[*]
    then:
      field: name
      function: pattern
      functionOptions:
        notMatch: "^q$"

  specfuse-no-sortby-sortorder:
    description: "Use 'sort' instead of 'sortBy' or 'sortOrder'."
    severity: error
    given: $.paths[*][get,post,put,patch,delete].parameters[*]
    then:
      field: name
      function: pattern
      functionOptions:
        notMatch: "^(sortBy|sortOrder)$"

  # ===== Main resource required fields =====
  specfuse-main-resource-has-id:
    description: "Main resources (schemas with x-entity) must have 'id' property."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      field: properties.id
      function: truthy

  specfuse-main-resource-has-createdAt:
    description: "Main resources (schemas with x-entity) must have 'createdAt' property."
    severity: error
    given: $.components.schemas[?(@ && @["x-entity"])]
    then:
      field: properties.createdAt
      function: truthy

  specfuse-main-resource-has-updatedAt:
    description: "Mutable main resources (schemas with x-entity) must have 'updatedAt' property."
    message: "Mutable entities must expose 'updatedAt'. If this entity's rows are never modified after insert, declare x-entity.mutability: immutable or appendOnly instead of adding the field."
    severity: error
    # Entities that declare a non-mutable write policy are exempt: an updatedAt
    # on a row that never changes permanently equals createdAt, so requiring it
    # makes the spec assert something untrue. `id` and `createdAt` stay required
    # for every entity regardless of write policy — only updatedAt is meaningless
    # for append-only and immutable rows.
    #
    # This is not an escape hatch. `mutability` is itself validated against a
    # closed set by specfuse-xentity-shape, so mislabelling a mutable entity to
    # dodge this rule is a visible, reviewable edit rather than a silent
    # suppression. See authoring issue #13.
    given: $.components.schemas[?(@ && @["x-entity"] && @["x-entity"].mutability !== "immutable" && @["x-entity"].mutability !== "appendOnly")]
    then:
      field: properties.updatedAt
      function: truthy

  # ===== New{Resource} forbidden fields =====
  specfuse-new-resource-no-id:
    description: "New{Resource} (create) schemas must not include 'id' property."
    severity: error
    given: $.components.schemas[?(@property.match("^New[A-Z]"))].properties
    then:
      field: id
      function: falsy

  specfuse-new-resource-no-createdAt:
    description: "New{Resource} (create) schemas must not include 'createdAt' property."
    severity: error
    given: $.components.schemas[?(@property.match("^New[A-Z]"))].properties
    then:
      field: createdAt
      function: falsy

  specfuse-new-resource-no-updatedAt:
    description: "New{Resource} (create) schemas must not include 'updatedAt' property."
    severity: error
    given: $.components.schemas[?(@property.match("^New[A-Z]"))].properties
    then:
      field: updatedAt
      function: falsy

  # ===== x-sample data generation annotations =====
  # Validates x-sample vendor extension on OpenAPI schema properties.
  # Reference: handbooks/API_Handbook.md §10, handbooks/Vendor_Extensions.md §6.3,
  #            JSON Schema: schemas/arazzo-extensions/x-sample.schema.json

  # --- Group A: Structural validation ---

  specfuse-x-sample-valid-provider:
    description: "x-sample provider must be one of: faker, fixed, template."
    message: "x-sample provider '{{value}}' is not valid. Must be: faker, fixed, or template. See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample.provider
    then:
      function: enumeration
      functionOptions:
        values:
          - faker
          - fixed
          - template

  specfuse-x-sample-faker-requires-path:
    description: "x-sample with provider 'faker' must include a 'path' field."
    message: "x-sample with provider 'faker' is missing 'path'. Specify a faker method path (e.g., person.firstName). See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              provider: { const: "faker" }
            required: [provider]
          then:
            required: [path]

  specfuse-x-sample-no-unknown-fields:
    description: "x-sample must only contain known fields: provider, path, locale, format."
    message: "x-sample contains unknown fields. Only 'provider', 'path', 'locale', and 'format' are allowed. See Vendor Extensions §6.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          properties:
            provider: {}
            path: {}
            locale: {}
            format: {}

  specfuse-x-sample-fixed-requires-format:
    description: "x-sample with provider 'fixed' must include a 'format' field."
    message: "x-sample with provider 'fixed' is missing 'format'. Specify the literal value to use. See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              provider: { const: "fixed" }
            required: [provider]
          then:
            required: [format]

  specfuse-x-sample-template-requires-format:
    description: "x-sample with provider 'template' must include a 'format' field."
    message: "x-sample with provider 'template' is missing 'format'. Specify a template string with {{faker.path}} interpolation. See API Handbook §10.3."
    severity: error
    given: $.components.schemas[*].properties[*].x-sample
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              provider: { const: "template" }
            required: [provider]
          then:
            required: [format]

  # --- Group B: Placement validation ---

  specfuse-x-sample-no-server-generated:
    description: "x-sample must not be placed on server-generated properties (id, createdAt, updatedAt)."
    message: "x-sample is forbidden on server-generated properties. Remove x-sample from id, createdAt, or updatedAt. See API Handbook §10.2."
    severity: error
    given:
      - $.components.schemas[*].properties.id.x-sample
      - $.components.schemas[*].properties.createdAt.x-sample
      - $.components.schemas[*].properties.updatedAt.x-sample
    then:
      function: falsy

  specfuse-x-sample-property-level-only:
    description: "x-sample must be placed on individual properties, not on the schema itself."
    message: "x-sample found at schema level. Move x-sample to individual properties within the schema. See API Handbook §10.2."
    severity: error
    given: $.components.schemas[*].x-sample
    then:
      function: falsy

  # --- Group C: Content validation ---

  specfuse-x-sample-faker-path-format:
    description: "x-sample faker path should use dot-notation starting with a known category."
    message: "Faker path '{{value}}' does not start with a recognized category. Expected one of: person, internet, phone, location, company, date, string, lorem, number. See API Handbook §10.4."
    severity: warn
    given: $.components.schemas[*].properties[*].x-sample.path
    then:
      function: pattern
      functionOptions:
        match: "^(person|internet|phone|location|company|date|string|lorem|number)\\."

  # ===========================================================================
  # Service topology — info.x-services, holds, and Read{Entity}
  # ===========================================================================
  #
  # Handbook: Vendor_Extensions.md §14. Project file: Project_File.md §3.1
  # (`groups[].service`).
  #
  # PIN STATE — READ THIS BEFORE CHANGING A SEVERITY HERE.
  #
  # `info.x-services` is a generator vocabulary that kit 0.8.0's PINNED
  # GENERATOR (0.5.8) DOES NOT KNOW. It landed on generator `main` after 0.5.8
  # and ships in the next generator release. Verified against the pin:
  # `extensions --format json` on 0.5.8 reports `x-entity` keys only and no
  # `x-services`. So on 0.5.8 the key is inert — declaring it changes nothing
  # about generation, and these rules are the ONLY feedback an author gets.
  #
  # That is the shape of the `0.7.0` erratum (compatibility.md §18): a kit that
  # documents and lints a contract its own pinned jar does not implement. The
  # difference, and the reason these ship anyway, is direction. `0.7.0` accepted
  # a VALUE the pinned jar rejected, so following the handbook produced an ERROR
  # at generate time. Here the pinned jar has no opinion at all: it cannot
  # contradict these rules, and no existing spec declares `info.x-services` or a
  # `Read*` schema, so the blast radius on every spec that exists today is zero
  # — exactly as it is generator-side.
  #
  # Each rule below mirrors a generator finding id at the SAME severity. The
  # mapping is recorded per rule so the next pin bump can diff it rather than
  # re-derive it. Do not tighten past the jar; see compatibility.md §24.
  #
  # All of these are gated on a declaration. A spec with no `info.x-services`
  # and no `Read*` schema cannot trip any of them.

  specfuse-services-registry-shape:
    description: >-
      info.x-services must be a mapping of service name to metadata carrying `domains`.
      A bare sequence of service names carries no domains and so expresses nothing.
    # Generator: SERVICE_REGISTRY_UNREADABLE (WARNING on the whole-value shape),
    # SERVICE_ENTRY_UNREADABLE (ERROR, per malformed entry), SERVICE_DOMAINS_MISSING
    # (ERROR). Held at `error` here because a registry the author cannot see is
    # read is worse in an editor than in a build log, and every arm the WARNING
    # covers is a shape the schema function reports as one finding anyway.
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          minProperties: 1
          # Service names are kebab-case, matching the domain vocabulary they
          # own — `scheduling-service`, not `SchedulingService`.
          propertyNames:
            pattern: "^[a-z][a-z0-9-]*$"
          additionalProperties:
            type: object
            additionalProperties: false
            # `domains` is required with no default. A service entry declaring
            # no domains is a typo, not a decision — there is no sensible
            # reading of "a service that owns nothing".
            required: ["domains"]
            properties:
              domains:
                type: array
                minItems: 1
                items:
                  type: string
                  pattern: "^[a-z][a-z0-9-]*$"
              # Optional. A service that keeps no replicas omits it entirely.
              # Entity names, so PascalCase.
              holds:
                type: array
                minItems: 1
                items:
                  type: string
                  pattern: "^[A-Z][A-Za-z0-9]*$"

  specfuse-services-domain-single-owner:
    description: >-
      A domain must be claimed by exactly one service in info.x-services.
    # Generator: SERVICE_DOMAIN_DUPLICATE_OWNER (ERROR). This is the headline
    # check and the reason the registry lives in the spec rather than in
    # project.json — a per-repository project file can never see two services at
    # once, so it could never detect this.
    message: "{{error}}"
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: duplicateOwner

  specfuse-services-domain-registered:
    description: >-
      A domain claimed in info.x-services must be a member of info.x-domains.
    # Generator: SERVICE_DOMAIN_UNREGISTERED (ERROR). Skipped when x-domains is
    # absent — the two registries degrade independently, and an absent domain
    # registry is a separate finding, not 20 unregistered-domain findings.
    message: "{{error}}"
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: unregisteredDomain

  specfuse-services-holds-pairing:
    description: >-
      `holds: [X]` requires that X is an entity in this spec and that a ReadX schema exists.
    # Generator: SERVICE_HOLDS_UNKNOWN_ENTITY (ERROR), SERVICE_HOLDS_NO_READ_MODEL (ERROR).
    # This is the half of the two-halves rule authors get wrong most often:
    # declaring `holds` alone has nothing to generate.
    message: "{{error}}"
    severity: error
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: holds

  specfuse-read-model-unheld:
    description: >-
      A Read{Entity} schema that no service holds is authored and unused.
    # Generator: READ_MODEL_UNHELD (WARNING). The other half of the pairing:
    # publishing a Read{Entity} alone would make every group referencing that
    # entity legal, including one whose author never considered keeping a copy.
    # WARNING and not ERROR because authoring the owner's half first, before the
    # holder declares itself, is a legitimate order to work in.
    message: "{{error}}"
    severity: warn
    given: $.info["x-services"]
    resolved: false
    then:
      function: openapiServiceRegistry
      functionOptions:
        check: unheld

  specfuse-read-model-primary-key:
    description: >-
      A Read{Entity} must carry its source's primary key ('id' or '{Entity}Id').
    # Generator: READ_MODEL_NO_PRIMARY_KEY (ERROR). Same key detection as the
    # jar: a property named `id` or `{Source}Id`, case-insensitively.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: primaryKey

  specfuse-read-model-nested-entity:
    description: >-
      A Read{Entity} must not embed another entity or a Basic* projection — flatten to the FK.
    # Generator: READ_MODEL_NESTED_ENTITY (ERROR). Enum- and value-object-typed
    # properties are fine and never trip this. `resolved: false` is load-bearing:
    # the check keys on the $ref NAME, which resolution erases.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: nested

  specfuse-read-model-not-a-wire-type:
    description: >-
      A Read{Entity} must not appear as a request body, a response, or a projection embed.
    # Generator: READ_MODEL_NOT_A_WIRE_TYPE (ERROR). A replica is a store shape.
    # This is the whole reason `Basic*` was not reused for it — `Basic*` carries
    # expandable refs and lives in the Api layer, and reusing it would weld a
    # consuming service's database table to another team's response DTO.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: wireType

  specfuse-read-model-source-delete:
    description: >-
      A Read{Entity}'s source must declare x-entity.delete, and a soft-delete source's
      replica must carry the deletion-state property.
    # Generator: READ_MODEL_SOURCE_DELETE_UNDECLARED (ERROR),
    # READ_MODEL_MISSING_DELETION_STATE (ERROR). One kit rule for two jar ids:
    # they are the same authoring question asked before and after the mode is
    # known, and splitting them would make the ratchet count a fix as a
    # regression when declaring `soft` moves a finding from one id to the other.
    message: "{{error}}"
    severity: error
    given: $.components.schemas
    resolved: false
    then:
      function: openapiReadModelShape
      functionOptions:
        check: sourceDelete
