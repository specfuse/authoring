# =============================================================================
# Regression fixture: x-classification value rules
# =============================================================================
# Pins the four `specfuse-classification-*` rules. Both directions per rule:
# each fires on its violation AND stays silent on the correct case beside it.
#
# The clean cases matter more than usual here. Three of these rules run over
# EVERY property of every entity schema, so an over-matching one does not
# produce a few wrong findings — it produces one per property across the whole
# spec, which is the state in which a team turns the rule off.
#
#   Customer (the positive control — every property correct, NO finding)
#     id            unclassified scalar, not PII-shaped
#     email         format: email + [pii]                        clean
#     taxId         [pii, encrypted]                             clean
#     creditScore   [sensitive]                                  clean
#     avatarHash    [exposed] + a description                    clean
#     emails        an array named like PII but NOT an exact
#                   match for the jar's narrow name list         clean — must
#                   stay clean, this is the case the narrow list exists for
#
#   BadValues
#     nickname      x-classification: [secret]     -> values (not in the set)
#     alias         x-classification: pii          -> values (scalar, not array)
#     tag           x-classification: []           -> values (minItems)
#
#   BadExposed
#     sessionHash   [exposed, encrypted]           -> exposedContradiction
#     resetSalt     [exposed, sensitive]           -> exposedContradiction
#     tokenHash     [exposed], no description      -> exposedDescription
#     blankHash     [exposed], whitespace-only     -> exposedDescription
#
#   MissingPii
#     firstName     no classification              -> piiRequired (name)
#     dateOfBirth   no classification              -> piiRequired (name)
#     contactEmail  format: email, no class        -> piiRequired (format)
#     phonePrimary  [exposed]                      -> CLEAN for piiRequired.
#                   Presence only, exactly as the jar checks it. See the note
#                   in compatibility.md §26 — this is a real hole, and it is
#                   the JAR's hole. A kit rule that closed it would fail lint
#                   on specs that generate fine.
#     inboxCount    integer, unremarkable name     -> clean
#
#   NotAnEntity (no x-entity)
#     firstName     no classification              -> clean for the three
#                   entity-scoped rules; DTOs project the same fields and
#                   double-flagging every PII property is how the rule dies.
#     nickname      x-classification: [secret]     -> values STILL fires; the
#                   value set is the same wherever it is written.
#
# Not a Specfuse-conformant example — do not copy.
# =============================================================================
openapi: 3.0.3
info:
  title: Classification fixture
  version: "1.0.0"

paths: {}

components:
  schemas:
    # ---- Positive control. No classification finding expected. --------------
    Customer:
      type: object
      x-entity:
        domain: crm
        type: aggregate
      required: [id]
      properties:
        id: { type: string, format: uuid }
        email:
          type: string
          format: email
          x-classification: [pii]
        taxId:
          type: string
          x-classification: [pii, encrypted]
        creditScore:
          type: number
          x-classification: [sensitive]
        avatarHash:
          type: string
          description: >-
            Content address of the public avatar image; not a credential and
            safe on responses despite the secret-shaped name.
          x-classification: [exposed]
        emails:
          type: array
          items: { type: string }

    # ---- Value-set violations. ---------------------------------------------
    BadValues:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        nickname:
          type: string
          x-classification: [secret]
        alias:
          type: string
          x-classification: pii
        tag:
          type: string
          x-classification: []

    # ---- `exposed` violations. ---------------------------------------------
    BadExposed:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        sessionHash:
          type: string
          description: Session fingerprint.
          x-classification: [exposed, encrypted]
        resetSalt:
          type: string
          description: Password reset salt.
          x-classification: [exposed, sensitive]
        tokenHash:
          type: string
          x-classification: [exposed]
        blankHash:
          type: string
          description: "   "
          x-classification: [exposed]

    # ---- Missing classification on PII-shaped properties. ------------------
    MissingPii:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        firstName: { type: string }
        dateOfBirth: { type: string, format: date }
        contactEmail: { type: string, format: email }
        phonePrimary:
          type: string
          description: Reviewed — published directory listing.
          x-classification: [exposed]
        inboxCount: { type: integer }

    # ---- Not an entity. The entity-scoped rules must not reach it. ---------
    NotAnEntity:
      type: object
      properties:
        firstName: { type: string }
        nickname:
          type: string
          x-classification: [secret]

    # ---- The five tokens added on 2026-08-21 (authoring #76). -------------
    # The four-value enum was an ERROR against every one of these while the
    # pinned generator had no opinion on them at all. Each must now be
    # ACCEPTED — this schema is a positive control and must stay silent.
    WidenedVocabulary:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        id: { type: string, format: uuid }
        internalMemo:
          type: string
          x-classification: [confidential]
          x-protection: { atRest: encrypted }
        invoiceTotal:
          type: number
          x-classification: [financial]
          x-protection: { atRest: none, rationale: Shown to the payer on every invoice. }
        apiToken:
          type: string
          writeOnly: true
          x-classification: [credential]
          x-protection: { atRest: hashed }
        cardNumber:
          type: string
          x-classification: [cardholder]
          x-protection: { atRest: encrypted, masking: { first: 0, last: 4 } }

    # ---- `sad` belongs on a request DTO, never on an entity. --------------
    # PCI-DSS forbids retaining sensitive authentication data after
    # authorisation, and an x-entity property is persisted by construction — so
    # the correct shape is a non-entity payload, and this is the control that
    # says so. Must stay silent.
    PaymentAuthorisationRequest:
      type: object
      properties:
        cardVerificationValue:
          type: string
          writeOnly: true
          x-classification: [sad]
          x-protection: { atRest: never_persist }

    # ---- `exposed` pairings under the widened set. ------------------------
    # The contradiction set grew with the vocabulary. Without that, widening
    # would have OPENED a hole: `[cardholder, exposed]` would lint clean.
    # `pii` was always allowed beside `exposed` (your own email, shown to you);
    # `confidential` and `financial` follow that precedent deliberately.
    ExposedPairings:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        id: { type: string, format: uuid }
        # MUST fire — never safe to return.
        exposedCard:
          type: string
          description: Reviewed — displayed on the receipt.
          x-classification: [cardholder, exposed]
        exposedSecret:
          type: string
          description: Reviewed — public key material.
          x-classification: [credential, exposed]
        exposedCvv:
          type: string
          description: Reviewed — shown during entry.
          x-classification: [sad, exposed]
          x-protection: { atRest: never_persist }
        # MUST NOT fire — legitimately visible to the person it concerns.
        ownInvoiceTotal:
          type: number
          description: Reviewed — the customer's own invoice total, shown to that customer.
          x-classification: [financial, exposed]
          x-protection: { atRest: none, rationale: Shown to the payer. }

    # ---- `encrypted` is noticed, not rejected. ----------------------------
    # It stays valid until a RELEASED generator removes it. The warn-level
    # notice must fire, and must not be an error, and must not tell anyone to
    # migrate to x-protection — absent from the pinned jar.
    EncryptedStillValid:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        id: { type: string, format: uuid }
        sinEncrypted:
          type: string
          x-classification: [encrypted]

    # ---- x-protection, generator 0.6.0 (authoring #76 follow-up). ---------
    # Every case below was cross-checked against specfuse-generator-0.6.0.jar:
    # the kit must not reject what the generator accepts, nor accept what it
    # rejects. CI asserts the kit half; the cross-check is in the PR.
    ProtectionShape:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        id: { type: string, format: uuid }
        # MUST fire: classified, no atRest.  (PROTECTION_ATREST_REQUIRED)
        classifiedNoAtRest:
          type: string
          x-classification: [pii]
        # MUST fire: atRest none, no rationale. (PROTECTION_NONE_REQUIRES_RATIONALE)
        noneNoRationale:
          type: string
          x-classification: [pii]
          x-protection: { atRest: none }
        # MUST fire: unknown sub-key.          (UNKNOWN_PROTECTION_SUBKEY)
        unknownSubKey:
          type: string
          x-classification: [pii]
          x-protection: { atRest: encrypted, nope: 1 }
        # MUST fire: value outside the enum.   (INVALID_EXTENSION_VALUE)
        badAtRest:
          type: string
          x-classification: [pii]
          x-protection: { atRest: bogus }
        # MUST fire: camelCase spelling is not accepted — the separator is `_`.
        camelNeverPersist:
          type: string
          x-classification: [pii]
          x-protection: { atRest: neverPersist }
        # MUST fire: parses, but unsupported.  (PROTECTION_MODE_UNSUPPORTED)
        deterministicMode:
          type: string
          x-classification: [pii]
          x-protection: { atRest: encrypted, mode: deterministic }
        # MUST fire: unknown nested sub-key.
        badBlindIndexKey:
          type: string
          x-classification: [pii]
          x-protection: { atRest: encrypted, blindIndex: { equality: true, nope: 1 } }
        # MUST NOT fire — all valid.
        okEncrypted:
          type: string
          x-classification: [pii]
          x-protection:
            atRest: encrypted
            mode: randomized
            blindIndex: { equality: true, prefix: 3, normalization: [lower, trim], scope: tenant }
            masking: { first: 0, last: 4 }
        okNoneWithRationale:
          type: string
          x-classification: [pii]
          x-protection:
            atRest: none
            rationale: Displayed throughout the UI; encrypting it buys nothing.
            reviewedOn: '2026-08-21'
            reviewedBy: kit maintainers
        okUnbounded:
          type: string
          x-classification: [confidential]
          x-protection: { atRest: encrypted, unbounded: true }

    # ---- The exposed mutex, corrected to mirror the generator. ------------
    # #76 set the contradiction set by reasoning; 0.6.0 disagrees on two
    # tokens, measured. The generator is the authority.
    ExposedMutex:
      type: object
      x-entity:
        domain: crm
        type: entity
      properties:
        id: { type: string, format: uuid }
        # MUST fire — generator: PROTECTION_EXPOSED_MUTEX.
        exposedSensitive:
          type: string
          description: Reviewed — see rationale.
          x-classification: [sensitive, exposed]
          x-protection: { atRest: none, rationale: reviewed }
        exposedConfidential:
          type: string
          description: Reviewed — see rationale.
          x-classification: [confidential, exposed]
          x-protection: { atRest: none, rationale: reviewed }
        # MUST fire — `exposed` beside an at-rest decision that hides the value.
        # No conflicting CLASS at all; the class list alone would miss this.
        exposedButEncrypted:
          type: string
          description: Reviewed — see rationale.
          x-classification: [pii, exposed]
          x-protection: { atRest: encrypted }
        # MUST NOT fire — the generator ACCEPTS both of these.
        exposedCardholder:
          type: string
          description: Reviewed — last four only, printed on the receipt.
          x-classification: [cardholder, exposed]
          x-protection: { atRest: none, rationale: Last four digits only. }
        exposedFinancial:
          type: string
          description: Reviewed — the customer's own invoice total.
          x-classification: [financial, exposed]
          x-protection: { atRest: none, rationale: Shown to the payer. }
