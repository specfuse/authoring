      entities: { reads: [Order] }
      dataHandling:
        personalData: true
        providerRegion: ca

  goodInformationalKeys:
    summary: every documented key, parser-read and informational
    action: receive
    channel: { $ref: '#/channels/aiChannel' }
    x-ai:
      enabled: true
      task: recommendation
      model: claude-sonnet
      promptTemplate: order/enrich-order
      capabilities: [structuredOutput]
