asyncapi: 3.0.0

info:
  title: x-ai data handling fixture
  version: 1.0.0

channels:
  aiChannel:
    address: ai.fixture
    messages:
      aiMessage:
        name: AiMessage
        payload:
          type: object

operations:
  goodPersonalWithRegion:
    summary: personal data, region declared
    action: receive
    channel: { $ref: '#/channels/aiChannel' }
    x-ai:
      enabled: true
      task: generation
      entities: { reads: [Order] }
      dataHandling:
        personalData: true
        providerRegion: CA

  goodNoPersonalData:
    summary: no personal data, so no region is needed
    action: receive
    channel: { $ref: '#/channels/aiChannel' }
    x-ai:
      enabled: true
      task: classification
      entities: { reads: [Order] }
      dataHandling:
        personalData: false

  goodLowerCaseRegion:
    summary: the jar upper-cases the region, so lower case is accepted
    action: receive
    channel: { $ref: '#/channels/aiChannel' }
