# =============================================================================
# Regression fixture: x-entity allow-list covers every documented key
# =============================================================================
# `specfuse-xentity-shape` validates x-entity with `additionalProperties: false`.
# That is deliberate — it is what turns a typo into an error rather than a
# silently ignored key — but it means the allow-list must track the handbooks
# exactly. When it does not, a spec that follows the documentation fails lint
# at error severity, across every entity that uses the missing key.
#
# That has now happened twice (authoring #13, #36), which is why this fixture
# exists: it pins the documented surface so the next omission fails here rather
# than in a consumer's project.
#
# Expected (asserted by the `smoke-test` job in .github/workflows/ci.yml):
#
#   FullyDocumented    no specfuse-xentity-shape finding — uses every documented key
#   ShorthandDelete    no finding — `delete` in its string shorthand form
#   ConcurrencyUnprotected  no finding from either concurrency rule — `mode: none`
#                      with the reason it owes
#   BadCascadeValue    flagged: cascadeDelete outside the closed set
#   BadChildName       flagged: children entry is not PascalCase
#   BadStorage         flagged: valueObjects storage outside the closed set
#   UnknownSubKey      flagged: unknown key inside a valueObjects entry
#   BadDeleteMode      flagged: delete mode outside the closed set
#   BadRetention       flagged: retention is neither `none` nor an ISO-8601 duration
#   DeleteUnknownKey   flagged: unknown key inside the long-form delete object
#   BadConcurrencyMode flagged: concurrency mode outside the closed set
#   ConcurrencyUnknownKey  flagged: unknown key inside the concurrency object
#   ConcurrencyOtherWithText  no finding — `reason: other` carrying its reasonText
#   ConcurrencyTextNoReason   no finding — reasonText with no reason; the jar
#                      accepts it, so the guard must not tighten past it
#   ConcurrencyFreeTextReason flagged: free-text reason; the set closed in 0.5.7
#   ConcurrencyOtherNoText    flagged: `other` without the reasonText it requires
#   ConcurrencyTextWithoutOther flagged: reasonText rides with `other` and nothing else
#   TypoKey            flagged: unknown x-entity key (the additionalProperties guard)
#
# And, by `specfuse-xentity-concurrency-unprotected-needs-reason` only — these
# two must NOT appear in any specfuse-xentity-shape finding:
#
#   BareConcurrencyNone  flagged: `none` shorthand has nowhere to carry a reason
#   UnprotectedNoReason  flagged: `mode: none` with the reason omitted
#
# And, by `specfuse-xentity-schema-deprecated` only:
#
#   DeprecatedSchemaKey  flagged: `schema` is deprecated in favour of the
#                      project file's persistence.entities.<E>.schema. The
#                      generator still parses it, so it must NOT appear in any
#                      specfuse-xentity-shape finding.
#
# The last case is the one that matters most: relaxing the schema to fix a
# false positive must not disable the typo-catching that justifies the closed
# allow-list in the first place.
#
# See handbooks/Vendor_Extensions.md §1.1, §2 and API_Handbook.md §"Cascade Deletion".
# Not a Specfuse-conformant example — do not copy.
# =============================================================================
openapi: 3.0.3
info:
  title: x-entity allow-list fixture
  version: "1.0.0"
paths: {}
components:
  schemas:

    # ---- Phantom cascade keys: accepted by the shape guard, warned about. ----
    # Both must stay ACCEPTED (no specfuse-xentity-shape error) and both must
    # draw their own warning. A rule that errors here would fail lint on a spec
    # that generates exactly as it does today.
    CascadePhantom:
      type: object
      x-entity:
        domain: shop
        type: aggregate
        delete: soft
        cascadeDelete: soft
        children: [Line, Payment]
      required: [id]
      properties:
        id: { type: string, format: uuid }
        deletedAt: { type: string, format: date-time, nullable: true }

    # Declares neither phantom key — must draw neither warning.
    CascadeClean:
      type: object
      x-entity:
        domain: shop
        type: aggregate
        delete: hard
      required: [id]
      properties:
        id: { type: string, format: uuid }
    # ---- Every documented key, correctly shaped. No finding expected. ----
    FullyDocumented:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        mutability: mutable
        requiresPagination: true
        concurrency: optimistic
        hasMany: [OrderLine]
        hasOne: [Invoice]
        belongsTo: { allOf: [Tenant] }
        filterableProperties: [status]
        searchableProperties: [reference]
        encryptedProperties: [taxId]
        delete:
          mode: soft
          retention: P30D
        cascadeDelete: soft
        children: [OrderLine, Payment]
        valueObjects:
          shippingAddress:
            storage: 'single_json'
            queryable: false
          contactDetails:
            storage: 'flatten'
            propertyPrefix: 'contact_'
            indexHints: [email]
          tags:
            storage: 'collection_json'
            queryable: ['type', 'value']
          receipt:
            storage: 'serialized'
            serializer: 'protobuf'
          priceBand: {}          # inherits every default from x-value-object
        aiAccess:
          operations: []
          reason: Fixture entity; no agent surface.
      properties:
        id: { type: string, format: uuid }

    # ---- The string shorthand of `delete`. No finding expected. ----
    ShorthandDelete:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        delete: hard
      properties:
        id: { type: string, format: uuid }

    # ---- `concurrency`, object form, deliberately unprotected with its
    # ---- justification. Clean against both concurrency rules.
    ConcurrencyOtherWithText:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: none
          reason: other                 # the sole escape hatch...
          reasonText: "Written only by the nightly reconciliation job."
      properties:
        id: { type: string, format: uuid }

    # ---- `reasonText` with NO `reason` at all. The generator accepts this —
    # ---- its check is `reason != null && reason != OTHER && reasonText != null`
    # ---- (ConcurrencyPolicy bytecode: the `ifnull` on reason skips the throw),
    # ---- so the guard must accept it too. This case exists to make that
    # ---- looseness enforceable rather than advisory: tightening the guard to
    # ---- demand `reason` alongside `reasonText` would reject a spec that
    # ---- generates fine, and would otherwise pass every check in this repo.
    # ---- Remove it only when the jar itself starts rejecting the shape.
    ConcurrencyTextNoReason:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: none
          reasonText: "No reason member; the generator allows this today."
      properties:
        id: { type: string, format: uuid }

    ConcurrencyUnprotected:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: none
          reason: reference-data
      properties:
        id: { type: string, format: uuid }

    # ---- One violation each. ----
    BadCascadeValue:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        cascadeDelete: maybe            # not in the closed set
      properties:
        id: { type: string, format: uuid }

    BadChildName:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        children: [orderLine]           # not PascalCase
      properties:
        id: { type: string, format: uuid }

    BadStorage:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        valueObjects:
          address:
            storage: 'sqlite_blob'      # not a documented storage pattern
      properties:
        id: { type: string, format: uuid }

    UnknownSubKey:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        valueObjects:
          address:
            storage: 'flatten'
            prefix: 'addr_'             # misspelling of propertyPrefix
      properties:
        id: { type: string, format: uuid }

    BadDeleteMode:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        delete: archive                 # only hard | soft
      properties:
        id: { type: string, format: uuid }

    BadRetention:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        delete:
          mode: soft
          retention: '30 days'          # not `none`, not an ISO-8601 duration
      properties:
        id: { type: string, format: uuid }

    DeleteUnknownKey:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        delete:
          mode: soft
          purge: true                   # not a documented delete sub-key
      properties:
        id: { type: string, format: uuid }

    BadConcurrencyMode:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency: pessimistic        # only optimistic | none
      properties:
        id: { type: string, format: uuid }

    ConcurrencyFreeTextReason:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: none
          reason: "it is an append-only log"   # free text — closed set since 0.5.7
      properties:
        id: { type: string, format: uuid }

    ConcurrencyOtherNoText:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: none
          reason: other                 # `other` without reasonText
      properties:
        id: { type: string, format: uuid }

    ConcurrencyTextWithoutOther:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: none
          reason: append-only
          reasonText: "not allowed here"  # reasonText only rides with `other`
      properties:
        id: { type: string, format: uuid }

    ConcurrencyUnknownKey:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: optimistic
          retries: 3                    # not a documented concurrency sub-key
      properties:
        id: { type: string, format: uuid }

    # ---- Accepted by the shape guard, flagged by the reason rule. Both cases
    # ---- must stay OUT of any specfuse-xentity-shape finding: the scalar is a
    # ---- form the generator accepts, and failing lint on it would block the
    # ---- adoption rather than improve the spec (authoring #47).
    BareConcurrencyNone:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency: none               # shorthand — nowhere to put a reason
      properties:
        id: { type: string, format: uuid }

    UnprotectedNoReason:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency:
          mode: none                    # object form, reason omitted
      properties:
        id: { type: string, format: uuid }

    # ---- Deprecated but still parsed by the generator. ----
    # `schema` must NOT be a specfuse-xentity-shape finding — the generator
    # reads it, so rejecting it would fail lint on a spec that generates fine.
    # It MUST be a specfuse-xentity-schema-deprecated finding, or the key
    # becomes invisible and nobody migrates before it is removed.
    DeprecatedSchemaKey:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        concurrency: optimistic
        schema: billing
      properties:
        id: { type: string, format: uuid }

    # ---- The guard that justifies the closed allow-list must still fire. ----
    TypoKey:
      type: object
      x-entity:
        domain: orders
        type: aggregate
        searchablePropertys: [name]     # typo — must not be silently accepted
      properties:
        id: { type: string, format: uuid }
